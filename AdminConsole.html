<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base target="_top">
<style>
  /* ═══ Soft Green — emerald/sage berkartu di atas kertas kehijauan. Tanpa CDN. ═══ */
  :root {
    --g-ink: #183D33; --g-deep: #1F5D4C; --g-mid: #2F8F6F; --g-soft: #8FC9AD;
    --g-mist: #E7F1EA; --g-mist2: #DCEAE1; --g-paper: #F5F8F4;
    --g-gold: #B7893F; --g-gold-soft: #F3E6CF; --g-line: rgba(24,61,51,.14);
    --tunai: #B7893F; --bank: #2F8F6F;
    --success: #2F8F6F; --warning: #B7893F; --danger: #B7893F;
    --admin: #1F5D4C; --admin-dark: #164034; --admin-soft: #E7F1EA; --admin-ink: #183D33;
    --accent2: #B7893F; --accent2-100: #F3E6CF; --accent2-800: #6f5220;
    --bg: #F5F8F4; --card: #ffffff;
    --sidebar: #22664F; --sidebar-2: #1A5040;
    --text: #183D33; --text-muted: #5f7a70;
    --border: rgba(24,61,51,.14); --border-soft: rgba(24,61,51,.09);
    --radius: 16px; --radius-sm: 12px;
    --shadow: 0 8px 20px rgba(24,61,51,.06);
    --shadow-lg: 0 12px 32px rgba(24,61,51,.18);
    --shadow-emerald: 0 12px 26px rgba(24,61,51,.16);
    --tint-tunai: #E7F1EA; --tint-bank: #E7F1EA; --tint-green: #E7F1EA; --tint-coral: #F3E6CF;
    --font: Georgia, 'Times New Roman', 'Noto Serif', 'Liberation Serif', serif;
    --mono: var(--font);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; font-size: 14px; -webkit-font-smoothing: antialiased; }
  .num, .amt, .fig-num, .kpi-value, .cs-v, .stat-val { font-variant-numeric: tabular-nums; }

  /* Perabot koran */
  .kick { font-weight: 700; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--admin); padding-bottom: 6px; border-bottom: 1px solid var(--text); margin-bottom: 14px; display: flex; align-items: baseline; justify-content: space-between; }
  .kick .aside { color: rgba(32,30,29,.5); letter-spacing: .04em; font-weight: 600; }
  .fig-lbl { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: rgba(32,30,29,.55); font-weight: 600; }
  .fig-num { font-weight: 600; letter-spacing: -.02em; line-height: 1; }
  .rowline { border-bottom: 1px solid var(--border-soft); }

  /* Angka pelat CMYK (Total Kas) — murni CSS, hanya di atas kertas terang */
  .cmyk-num { position: relative; display: inline-block; isolation: isolate; line-height: .9; }
  .cmyk-num .paper { position: relative; z-index: 4; color: var(--text); }
  .cmyk-num .plate { position: absolute; left: 0; top: 0; mix-blend-mode: multiply; pointer-events: none; z-index: 1; }
  .cmyk-num .plate-c { color: #00a3d9; transform: translate(-1.6px, .8px); }
  .cmyk-num .plate-m { color: #e5007d; transform: translate(1.6px, -.8px); }
  .cmyk-num .plate-y { color: #ffd400; transform: translate(.4px, 1.6px); }
  @media (prefers-reduced-motion: reduce) { * { animation:none!important; transition:none!important; } }
  .num { font-variant-numeric: tabular-nums; }
  .layout { display: flex; min-height: 100vh; }

  .sidebar { width: 240px; flex-shrink: 0; background: linear-gradient(180deg, var(--sidebar), var(--sidebar-2)); color: #EAF3EE; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 18px 16px; }
  .brand-mark { width: 36px; height: 36px; border-radius: 11px; background: rgba(255,255,255,.16); color: #fff; display: grid; place-items: center; font-size: 18px; }
  .brand-name { font-weight: 700; font-size: 16px; color: #fff; letter-spacing: -.01em; }
  .brand-sub { font-size: 9.5px; color: var(--g-soft); font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
  .nav { flex: 1; overflow-y: auto; padding: 6px 14px 16px; }
  .nav::-webkit-scrollbar { width: 6px; } .nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 9px; }
  .nav-group { margin-top: 16px; }
  .nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--g-soft); font-weight: 700; padding: 0 8px 7px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; color: #D5E7DE; font-weight: 600; cursor: pointer; font-size: 14px; position: relative; transition: color .12s, background .12s; text-decoration: none; border-radius: 11px; }
  .nav-item:hover { color: #fff; background: rgba(255,255,255,.08); }
  .nav-item.active { color: #fff; font-weight: 700; background: rgba(255,255,255,.16); }
  .nav-item .ico { width: 19px; text-align: center; font-size: 14px; flex-shrink: 0; }
  .nav-item .pill { margin-left: auto; background: var(--g-gold); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 20px; }
  .nav-item.active .pill { background: var(--g-gold); color: #fff; }
  .sidebar-foot { padding: 13px; border-top: 1px solid rgba(255,255,255,.14); display: flex; align-items: center; gap: 9px; }
  .sf-avatar { width: 34px; height: 34px; border-radius: 11px; flex-shrink: 0; background: rgba(255,255,255,.16); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .sf-name { font-size: 13px; font-weight: 700; color: #fff; } .sf-role { font-size: 10px; color: var(--g-soft); font-weight: 700; letter-spacing: .04em; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* Masthead + rel tanggal (thick-thin) */
  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(245,248,244,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 18px 34px 12px; display: block; }
  .masthead-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; }
  .crumb { font-weight: 700; }
  .crumb .kickw { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--g-mid); font-weight: 700; }
  .crumb b { display: block; color: var(--g-ink); font-weight: 600; font-size: 34px; letter-spacing: -.01em; line-height: 1.05; }
  .crumb .sep { display: none; }
  .tb-spacer { display: none; }
  .dateline { margin-top: 8px; }
  .dateline-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 0 0; font-size: 11.5px; letter-spacing: .02em; font-weight: 600; color: var(--text-muted); }
  .dateline-row .dl-mid { display: inline-flex; align-items: center; gap: 6px; color: var(--g-deep); font-weight: 700; }
  .dateline-row .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--g-mid); display: inline-block; }
  .qbtn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 12px; border: 1px solid var(--border); font-family: inherit; font-weight: 700; font-size: 12.5px; cursor: pointer; text-decoration: none; }
  .qbtn.primary { background: var(--g-deep); color: #fff; border-color: var(--g-deep); box-shadow: var(--shadow-emerald); } .qbtn.primary:hover { background: var(--admin-dark); }
  .qbtn.ghost { background: #fff; color: var(--g-deep); } .qbtn.ghost:hover { border-color: var(--g-mid); }
  .period-chip { display: none; }

  .content { padding: 22px 30px 40px; }
  .kpi-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 24px; }
  .kpi { background: var(--card); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); border: 1px solid var(--border-soft); }
  .kpi:nth-child(1) { background: linear-gradient(150deg, var(--g-deep), var(--g-mid)); border: none; box-shadow: var(--shadow-emerald); color: #fff; }
  .kpi:nth-child(1) .kpi-label { color: rgba(255,255,255,.85); }
  .kpi:nth-child(1) .kpi-value { color: #fff; }
  .kpi:nth-child(4) { background: var(--g-mist); }
  .kpi:nth-child(5) { background: var(--g-gold-soft); }
  .kpi:nth-child(5) .kpi-value { color: #6f5220; }
  .kpi-label { font-size: 10.5px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; display: flex; align-items: center; gap: 6px; }
  .kpi-label .d { width: 8px; height: 8px; border-radius: 3px; }
  .kpi-value { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin-top: 8px; color: var(--g-deep); }
  .kpi-value .rp { font-size: 12px; color: inherit; opacity: .7; font-weight: 600; margin-right: 1px; }
  .kpi-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; min-height: 22px; }
  .kpi-delta { font-size: 11px; font-weight: 700; } .up { color: var(--success); } .down { color: var(--danger); } .flat { color: var(--text-muted); }
  .spark { height: 22px; }
  .mini-prog { height: 6px; background: var(--border-soft); border-radius: 99px; margin-top: 9px; overflow: hidden; }
  .mini-prog > i { display: block; height: 100%; background: var(--admin); border-radius: 99px; }

  .grid-main { display: grid; grid-template-columns: minmax(0,2.3fr) minmax(300px,1fr); gap: 18px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .panel { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border-soft); margin-bottom: 18px; padding: 16px 18px; }
  .panel-head { display: flex; align-items: baseline; gap: 10px; padding: 0 0 8px; border-bottom: 2px solid var(--admin-soft); margin-bottom: 14px; }
  .panel-title { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--admin); }
  .panel-title small { font-weight: 600; color: var(--text-muted); font-size: 10.5px; margin-left: 8px; letter-spacing: .04em; text-transform: none; }
  .panel-head .tools { margin-left: auto; display: flex; gap: 6px; }
  .link { font-size: 11px; font-weight: 700; color: var(--admin); cursor: pointer; text-decoration: none; letter-spacing: .04em; }

  .chart-body { padding: 0; display: flex; gap: 18px; align-items: stretch; }
  .bars { display: flex; align-items: flex-end; gap: 16px; height: 150px; flex: 1; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  .bar-stack { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 5px; }
  .bar { width: 16px; border-radius: 6px 6px 0 0; transition: height .5s cubic-bezier(.4,0,.2,1); }
  .bar.in { background: var(--g-mid); } .bar.out { background: var(--g-gold); }
  .bar-label { font-size: 11px; color: var(--text-muted); font-weight: 700; }
  .chart-side { width: 148px; flex-shrink: 0; border-left: 1px solid var(--border); padding-left: 16px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .cs-item .cs-l { font-size: 11px; color: var(--text-muted); font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .cs-item .cs-v { font-size: 17px; font-weight: 800; letter-spacing: -.4px; }
  .cs-item .sw { width: 9px; height: 9px; border-radius: 3px; }

  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: rgba(32,30,29,.6); font-weight: 700; padding: 8px 12px 8px 0; background: transparent; border-bottom: 1px solid var(--text); white-space: nowrap; }
  thead th.r { text-align: right; padding-right: 0; }
  tbody td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--border-soft); font-size: 13.5px; vertical-align: middle; }
  tbody tr:hover { background: rgba(32,30,29,.03); }
  tbody tr:last-child td { border-bottom: none; }
  td.r { text-align: right; padding-right: 0; }
  .t-date { color: var(--text-muted); font-weight: 600; white-space: nowrap; font-size: 12.5px; }
  .t-jenis { font-weight: 700; }
  .t-name { color: var(--text-muted); }
  .amt { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .amt.in { color: var(--g-mid); } .amt.out { color: var(--g-gold); }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
  .chip .d { width: 6px; height: 6px; border-radius: 99px; }
  .chip.tunai { background: var(--g-mist); color: var(--g-deep); } .chip.tunai .d { background: var(--g-mid); }
  .chip.bank { background: var(--g-gold-soft); color: #6f5220; } .chip.bank .d { background: var(--g-gold); }
  .badge { font-size: 10.5px; font-weight: 700; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
  .b-ok { background: var(--admin-soft); color: var(--admin-ink); }
  .b-wait { background: #f5ecd6; color: #7a5a1a; }
  .b-need { background: var(--accent2-100); color: var(--accent2-800); }
  .t-oleh { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 11.5px; font-weight: 600; }
  .t-oleh .av { width: 20px; height: 20px; border-radius: 2px; border: 1px solid var(--text); color: var(--text); display: grid; place-items: center; font-size: 9px; font-weight: 700; }
  .table-foot { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 0; font-size: 12px; color: var(--text-muted); }
  .empty { padding: 26px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }

  .rail { display: flex; flex-direction: column; gap: 30px; }
  .count-badge { background: var(--accent2); color: #fff; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 2px; display: grid; place-items: center; }
  .act { display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--border-soft); margin: 0; cursor: pointer; transition: color .12s; background: transparent; text-decoration: none; color: inherit; }
  .act:first-of-type { margin-top: 0; }
  .act:hover { color: var(--admin); }
  .act-ico { width: 26px; flex-shrink: 0; display: grid; place-items: center; font-size: 20px; }
  .act.warn .act-ico, .act.danger .act-ico { color: var(--accent2); } .act.info .act-ico { color: var(--admin); }
  .act-body { flex: 1; min-width: 0; } .act-title { font-weight: 700; font-size: 14px; } .act-sub { font-size: 11px; color: var(--text-muted); }
  .act-count { font-weight: 600; font-size: 18px; margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .act.warn .act-count, .act.danger .act-count { color: var(--accent2); } .act.info .act-count { color: var(--admin); }
  .act .chev { color: var(--text-muted); font-size: 13px; }

  .pc-status { display: inline-flex; align-items: center; gap: 6px; background: var(--admin-soft); color: var(--admin-ink); font-weight: 700; font-size: 10.5px; padding: 3px 9px; border-radius: 2px; text-transform: uppercase; letter-spacing: .06em; }
  .pc-status.closed { background: var(--accent2-100); color: var(--accent2-800); }
  .pc-name { font-size: 18px; font-weight: 600; margin: 10px 0 2px; }
  .pc-range { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .pc-r { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
  .pc-r:first-of-type { border-top: 1px solid var(--border-soft); margin-top: 12px; }
  .pc-r span:first-child { color: var(--text-muted); } .pc-r span:last-child { font-weight: 700; }
  .btn { width: 100%; padding: 11px; border-radius: 2px; border: 1px solid var(--admin); font-family: inherit; font-weight: 700; font-size: 12.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 14px; text-decoration: none; }
  .btn-admin { background: var(--admin); color: #fff; } .btn-admin:hover { background: var(--admin-dark); }

  .sec-body { padding: 2px 0 0; }
  .stat-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--border-soft); }
  .stat-row:last-child { border-bottom: none; }
  .stat-ico { width: 28px; height: 28px; border-radius: 2px; display: grid; place-items: center; font-size: 14px; border: 1px solid var(--border); flex-shrink: 0; }
  .stat-name { font-weight: 600; font-size: 13px; } .stat-sub { font-size: 11px; color: var(--text-muted); }
  .stat-val { margin-left: auto; font-weight: 600; font-size: 17px; }

  .grid-bottom { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 0; }
  .donut-wrap { display: flex; align-items: center; gap: 16px; padding: 4px 0; }
  .donut { position: relative; flex-shrink: 0; }
  .donut-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .donut-center b { font-size: 15px; font-weight: 600; display: block; } .donut-center small { font-size: 10px; color: var(--text-muted); font-weight: 600; }
  .dl { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 7px; }
  .dl .sw { width: 10px; height: 10px; border-radius: 2px; } .dl .nm { font-weight: 600; } .dl .vl { margin-left: auto; font-weight: 700; color: var(--text-muted); }
  .role-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 2px; margin: 0 5px 6px 0; }
  .role-chip .n { background: rgba(0,0,0,.08); padding: 0 5px; border-radius: 2px; }
  .rc-admin { background: var(--admin-soft); color: var(--admin-ink); } .rc-b1 { background:#dce7ef; color:#2f6f9e; } .rc-b2 { background:#e2e6ef; color:#3b4a7a; } .rc-pen { background:#f5ecd6; color:#7a5a1a; } .rc-per { background:#ece4f1; color:#6b4b7a; }
  .log-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border-soft); }
  .log-item:last-child { border-bottom: none; }
  .log-dot { width: 7px; height: 7px; border-radius: 99px; margin-top: 6px; flex-shrink: 0; background: var(--admin); }
  .log-act { font-weight: 700; font-size: 13px; } .log-act .who { color: var(--admin); } .log-time { font-size: 10.5px; color: var(--text-muted); }

  .gate { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .gate-card { background: var(--bg); border-radius: 2px; box-shadow: var(--shadow-lg); border: 1px solid var(--text); padding: 30px; max-width: 380px; text-align: center; }
  .gate-card h2 { font-size: 20px; margin-bottom: 8px; font-weight: 600; } .gate-card p { color: var(--text-muted); margin-bottom: 18px; }
  .loading { min-height: 100vh; display: grid; place-items: center; color: var(--text-muted); font-weight: 600; }

  .nav-item.disabled { opacity: .4; cursor: not-allowed; }
  .nav-item.disabled:hover { color: var(--text); }
  .nav-item .soon { margin-left: auto; font-size: 8.5px; text-transform: uppercase; letter-spacing: .06em; background: rgba(32,30,29,.1); color: var(--text-muted); padding: 2px 6px; border-radius: 2px; font-weight: 700; }
  .abtn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 2px; border: 1px solid var(--text); background: transparent; font-family: inherit; font-weight: 700; font-size: 11.5px; cursor: pointer; color: var(--text); }
  .abtn:hover { border-color: var(--admin); color: var(--admin); }
  .abtn.danger { color: var(--accent2); border-color: var(--accent2); } .abtn.danger:hover { background: var(--accent2-100); }
  .asel { padding: 5px 8px; border-radius: 2px; border: 1px solid var(--text); font-family: inherit; font-size: 12px; background: transparent; cursor: pointer; }
  .toastc { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 2px; font-weight: 600; font-size: 13px; z-index: 99; opacity: 0; transition: opacity .2s; box-shadow: var(--shadow-lg); }
  .toastc.show { opacity: 1; }
  /* .card — hanya untuk tile diskret (Buku IR/Setoran/Bank) */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 2px; padding: 14px; }
  .qbtn[disabled] { opacity: .45; cursor: not-allowed; }

  .small-note { display: none; }
  @media (max-width: 1180px) {
    .kpi-strip { grid-template-columns: repeat(3, 1fr); }
    .grid-main { grid-template-columns: 1fr; }
    .grid-bottom { grid-template-columns: 1fr; }
    .chart-side { display: none; }
    .small-note { display: block; margin: 0 0 14px; padding: 10px 14px; background: #FEF3C7; color: #92400E; border-radius: 10px; font-size: 12px; font-weight: 600; }
  }
</style>
</head>
<body>
<div id="root"><div class="loading">Memuat konsol admin…</div></div>

<script>
  // Base URL aplikasi mobile (buang parameter view).
  function appUrl() {
    var u = window.location.href.split('?')[0];
    return u;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function rp(n) { return 'Rp ' + Number(n || 0).toLocaleString('id-ID'); }
  function jt(n) { n = Number(n || 0); if (n >= 1e9) return 'Rp ' + (n/1e9).toFixed(1).replace('.',',') + 'M'; if (n >= 1e6) return 'Rp ' + (n/1e6).toFixed(1).replace('.',',') + 'jt'; if (n >= 1e3) return 'Rp ' + Math.round(n/1e3) + 'rb'; return 'Rp ' + n; }
  function initials(name) { return String(name||'?').split(' ').map(function(w){return w.charAt(0);}).join('').substring(0,2).toUpperCase(); }

  function gate(msg) {
    document.getElementById('root').innerHTML =
      '<div class="gate"><div class="gate-card"><div style="font-size:34px;margin-bottom:8px;">🕌</div>' +
      '<h2>Admin Console</h2><p>' + esc(msg) + '</p>' +
      '<a class="qbtn primary" style="display:inline-flex;" href="' + esc(appUrl()) + '">Buka Aplikasi →</a></div></div>';
  }

  var STATE = null;
  var USERS = {};

  function tk() { try { return localStorage.getItem('kk_session') || ''; } catch(e) { return ''; } }

  // Panggilan server lewat dispatcher token.
  function call(fn, args, ok) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success === false && /belum login|sesi/i.test(res.message || '')) { gate('Sesi berakhir. Masuk lagi lewat aplikasi.'); return; }
        ok(res);
      })
      .withFailureHandler(function(e) { toast('Gagal terhubung. ' + ((e && e.message) || '')); })
      .apiCall(tk(), fn, args || []);
  }

  function toast(msg) {
    var el = document.createElement('div'); el.className = 'toastc'; el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function(){ el.classList.add('show'); }, 10);
    setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ if (el.parentNode) el.remove(); }, 250); }, 2600);
  }

  function load() {
    if (!tk()) { gate('Silakan masuk terlebih dulu lewat aplikasi (di perangkat/browser yang sama).'); return; }
    call('getAdminConsole', [], function(res) {
      if (!res || res.success === false) { gate((res && res.message) || 'Gagal memuat. Khusus Admin.'); return; }
      STATE = res; buildShell(); go('dashboard');
    });
  }

  // Definisi menu; hanya sebagian aktif (sisanya "segera").
  function menuDef() {
    return [
      { grp:'Ringkasan', items:[ ['dashboard','📊','Dashboard'], ['saldo','🧮','Pemeriksaan Saldo'], ['pdf','📄','Laporan PDF'] ] },
      { grp:'Keuangan', items:[ ['bukuir','📖','Buku IR'], ['rincianir','🧾','Rincian IR'], ['kepemilikan','🧭','Kepemilikan Saldo'], ['bagihasil','⚖️','Bagi Hasil'], ['setorandesa','🏘️','Setoran Desa'], ['bank','🏦','Bank &amp; Rekonsiliasi'], ['laporansetoran','📈','Laporan Setoran'] ] },
      { grp:'Jamaah', items:[ ['anggota','👥','Anggota'], ['terobosan','🤝','Terobosan Kelompok'], ['serah','🤲','Serah Terima'] ] },
      { grp:'Tata Kelola', items:[ ['users','🔑','Kelola User'], ['hakakses','🛡️','Hak Akses'], ['devices','📱','Perangkat &amp; Sesi'], ['master','🗂️','Master &amp; Pos'], ['periode','🗓️','Periode'], ['log','📜','Activity Log'] ] }
    ];
  }
  // Semua menu aktif. ep = endpoint (kosong = render tanpa fetch).
  var VIEWS = {
    dashboard:      { title:'Dashboard', run: function(h){ viewDashboard(h); } },
    saldo:          { title:'Pemeriksaan Saldo', ep:'getPemeriksaanSaldo', run: renderSaldo },
    pdf:            { title:'Laporan PDF', run: renderPdf },
    bukuir:         { title:'Buku IR', ep:'getBukuIRData', run: renderBukuIR },
    bagihasil:      { title:'Bagi Hasil', ep:'getBagiHasil', run: renderBagiHasil },
    kepemilikan:    { title:'Kepemilikan Saldo', ep:'getKepemilikanSaldo', run: renderKepemilikan },
    rincianir:      { title:'Rincian IR', ep:'getRincianIR', run: renderRincianIR },
    setorandesa:    { title:'Setoran Desa', ep:'getRekapSetoran', run: renderSetoranDesa },
    bank:           { title:'Bank & Rekonsiliasi', ep:'getRekonsiliasiData', run: renderBank },
    laporansetoran: { title:'Laporan Setoran', ep:'getRekapSetoran', run: renderLaporanSetoran },
    anggota:        { title:'Anggota', ep:'getAnggota', run: renderAnggota },
    terobosan:      { title:'Terobosan Kelompok', ep:'getPatunganList', run: renderTerobosan },
    serah:          { title:'Serah Terima', ep:'getSerahTerimaList', run: renderSerah },
    users:          { title:'Kelola User', ep:'getUserListAdmin', run: viewUsers },
    hakakses:       { title:'Hak Akses', ep:'getPermMatrix', run: renderHakAkses },
    devices:        { title:'Perangkat & Sesi', ep:'getDeviceList', run: viewDevices },
    master:         { title:'Master & Pos', ep:'getPosSetoranAll', run: renderMaster },
    periode:        { title:'Periode', ep:'getAllPeriode', run: renderPeriode },
    log:            { title:'Activity Log', ep:'getActivityLog', epArgs:[200], run: viewLog }
  };

  function buildShell() {
    var d = STATE;
    var groups = menuDef().map(function(g) {
      var items = g.items.map(function(it) {
        var id = it[0], ico = it[1], label = it[2];
        if (VIEWS[id]) return '<div class="nav-item" data-view="' + id + '" onclick="go(\'' + id + '\')"><span class="ico">' + ico + '</span> ' + label + '</div>';
        return '<div class="nav-item disabled" title="Segera hadir"><span class="ico">' + ico + '</span> ' + label + '<span class="soon">segera</span></div>';
      }).join('');
      return '<div class="nav-group"><div class="nav-label">' + g.grp + '</div>' + items + '</div>';
    }).join('');
    document.getElementById('root').innerHTML =
      '<div class="layout"><aside class="sidebar">'
      + '<div class="brand"><div class="brand-mark">🕌</div><div><div class="brand-name">Kas Kelompok</div><div class="brand-sub">Admin Console</div></div></div>'
      + '<nav class="nav">' + groups + '</nav>'
      + '<div class="sidebar-foot"><div class="sf-avatar">' + esc((d.user && d.user.inisial) || 'A') + '</div><div style="flex:1; min-width:0;"><div class="sf-name">' + esc((d.user && d.user.nama) || 'Admin') + '</div><div class="sf-role">' + esc((d.user && d.user.role) || 'ADMIN') + '</div></div><a href="' + esc(appUrl()) + '" title="Aplikasi" style="font-size:14px;text-decoration:none;">⏻</a></div>'
      + '</aside><div class="main">'
      + '<header class="topbar">'
      + '<div class="masthead-row">'
      + '<div class="crumb" id="crumb"><span class="kickw">Admin Console</span><b>Dashboard</b></div>'
      + '<div style="display:flex; gap:8px; align-items:center;">'
      + '<a class="qbtn ghost" href="' + esc(appUrl()) + '">Versi Mobile</a>'
      + '<a class="qbtn primary" href="' + esc(appUrl()) + '">＋ Input Transaksi</a></div>'
      + '</div>'
      + '<div class="dateline"><div class="dateline-row">'
      + '<span>' + esc(tanggalPanjang()) + '</span>'
      + '<span class="dl-mid"><span class="dot"></span>' + esc((d.periode && d.periode.nama) || 'Tanpa periode') + ' · ' + ((d.periode && String(d.periode.status).toUpperCase() === 'OPEN') ? 'Buku Terbuka' : 'Buku Tertutup') + '</span>'
      + '<span>Edisi Internal · ' + esc(d.namaKelompok) + '</span>'
      + '</div></div>'
      + '</header>'
      + '<div class="content" id="content"></div></div></div>';
  }

  // Tanggal panjang Bahasa Indonesia untuk dateline.
  function tanggalPanjang() {
    try {
      var hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
      var bln = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      var t = new Date();
      return hari[t.getDay()] + ', ' + t.getDate() + ' ' + bln[t.getMonth()] + ' ' + t.getFullYear();
    } catch(e) { return ''; }
  }

  function setActive(view, title) {
    var items = document.querySelectorAll('.nav-item[data-view]');
    for (var i = 0; i < items.length; i++) { items[i].classList.toggle('active', items[i].getAttribute('data-view') === view); }
    var cr = document.getElementById('crumb');
    if (cr) cr.innerHTML = '<span class="kickw">Admin Console</span><b>' + esc(title) + '</b>';
  }

  function loadingBox() { return '<div class="loading" style="min-height:300px;">Memuat…</div>'; }

  function go(view) {
    var cfg = VIEWS[view]; if (!cfg) return;
    var host = document.getElementById('content'); if (!host) return;
    setActive(view, cfg.title);
    if (!cfg.ep) { cfg.run(host); return; }
    host.innerHTML = loadingBox();
    call(cfg.ep, cfg.epArgs || [], function(res) { cfg.run(host, res); });
  }
  function errPanel(res) { return '<div class="panel"><div class="empty">' + esc((res && res.message) || 'Gagal memuat.') + '</div></div>'; }

  // ── Helper render umum ──
  function tableHtml(cols, bodyRows) {
    var head = cols.map(function(c){ return '<th' + (c.r ? ' class="r"' : '') + '>' + c.t + '</th>'; }).join('');
    var body = bodyRows || '<tr><td colspan="' + cols.length + '"><div class="empty">Tidak ada data.</div></td></tr>';
    return '<div style="overflow-x:auto;"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }
  function panelBox(title, sub, inner) {
    return '<div class="panel" style="margin-bottom:16px;"><div class="panel-head"><div class="panel-title">' + esc(title) + (sub ? ' <small>' + esc(sub) + '</small>' : '') + '</div></div>' + inner + '</div>';
  }
  function statCards(items) {
    return '<div class="kpi-strip" style="grid-template-columns:repeat(' + Math.min(items.length, 6) + ',1fr);">' + items.map(function(s){
      return '<div class="kpi"><div class="kpi-label"><span class="d" style="background:' + (s.color || 'var(--admin)') + '"></span> ' + esc(s.label) + '</div><div class="kpi-value"><span class="num">' + esc(s.val) + '</span></div></div>';
    }).join('') + '</div>';
  }
  function statusBadge(s) {
    var t = String(s || '').toLowerCase();
    var cls = (t.indexOf('lunas') >= 0 || t.indexOf('aktif') >= 0 || t.indexOf('dikonfirmasi') >= 0 || t.indexOf('balance') >= 0 || t.indexOf('open') >= 0) ? 'b-ok'
            : (t.indexOf('menunggu') >= 0 || t.indexOf('belum') >= 0 || t.indexOf('pending') >= 0) ? 'b-wait' : 'b-need';
    return '<span class="badge ' + cls + '">' + esc(s || '-') + '</span>';
  }
  function num(n) { return Number(n || 0).toLocaleString('id-ID'); }

  // ── VIEW: Pemeriksaan Saldo ──
  function renderSaldo(host, res) {
    if (!res || !res.success) { host.innerHTML = errPanel(res); return; }
    var s = res.saldoSistem || { tunai:0, bank:0, total:0 };
    host.innerHTML = statCards([
      { label:'Saldo Tunai (Sistem)', val: rp(s.tunai), color:'var(--tunai)' },
      { label:'Saldo Bank (Sistem)', val: rp(s.bank), color:'var(--bank)' },
      { label:'Total Kas', val: rp(s.total), color:'var(--admin)' }
    ]) + panelBox('Pemeriksaan Saldo', res.periode ? res.periode.nama : '', '<div class="sec-body"><p style="color:var(--text-muted);padding:6px 0;">Input saldo aktual & tutup buku dilakukan di aplikasi.</p><a class="qbtn primary" style="display:inline-flex;" href="' + esc(appUrl()) + '">Buka di Aplikasi →</a></div>');
  }

  // ── VIEW: Rincian IR (per jamaah + komponen) ──
  function renderRincianIR(host, res) {
    if (!res || !res.success) { host.innerHTML = errPanel(res); return; }
    var t = res.total || {};
    var cols = [{t:'Tanggal'},{t:'Jamaah'},{t:'IR',r:true},{t:'1/10 IR',r:true},{t:'Cicilan',r:true},{t:'Infak Daerah',r:true},{t:'Index',r:true},{t:'Total',r:true}];
    var body = (res.rows || []).map(function(x) {
      return '<tr><td class="t-date">' + esc(x.tanggal) + '</td><td class="t-jenis">' + esc(x.anggota) + '</td>' +
        '<td class="r amt">' + num(x.ir) + '</td>' +
        '<td class="r amt">' + num(x.ir10) + '</td>' +
        '<td class="r amt">' + num(x.cicilan) + '</td>' +
        '<td class="r amt">' + num(x.infakdaerah) + '</td>' +
        '<td class="r amt" style="color:var(--g-mid);">' + num(x.index) + '</td>' +
        '<td class="r amt" style="font-weight:800;">' + num(x.total) + '</td></tr>';
    }).join('');
    var foot = '<tr style="font-weight:800;border-top:2px solid var(--admin-soft);"><td colspan="2">TOTAL (' + (res.jumlah || 0) + ' rincian)</td>' +
      '<td class="r amt">' + num(t.ir) + '</td><td class="r amt">' + num(t.ir10) + '</td><td class="r amt">' + num(t.cicilan) + '</td>' +
      '<td class="r amt">' + num(t.infakdaerah) + '</td><td class="r amt" style="color:var(--g-mid);">' + num(t.index) + '</td>' +
      '<td class="r amt">' + num(t.total) + '</td></tr>';
    host.innerHTML = panelBox('Rincian IR', (res.periode && res.periode.nama) || '', tableHtml(cols, body + foot)) +
      '<p style="color:var(--text-muted);font-size:12px;margin-top:-6px;">IR, 1/10 IR, Cicilan, Infak Daerah = hak Desa; Index = hak Kelompok. Rincian dari transaksi yang dibatalkan tidak ditampilkan.</p>';
  }

  // ── VIEW: Kepemilikan Saldo — rincian asal Milik Kelompok & Titipan Desa/Daerah ──
  function renderKepemilikan(host, res) {
    if (!res || !res.success) { host.innerHTML = errPanel(res); return; }
    var kartu = '<div class="kpi-strip" style="grid-template-columns:repeat(4,1fr);">' +
      '<div class="kpi" style="background:linear-gradient(150deg,var(--g-deep),var(--g-mid));color:#fff;border:none;box-shadow:var(--shadow-emerald);">' +
        '<div class="kpi-label" style="color:rgba(255,255,255,.85);">Milik Kelompok</div>' +
        '<div class="kpi-value" style="color:#fff;">' + rp(res.milikKelompok) + '</div>' +
        '<div class="kpi-foot"><span class="kpi-delta" style="color:rgba(255,255,255,.8);">bebas dipakai</span></div></div>' +
      '<div class="kpi" style="background:var(--g-mist);"><div class="kpi-label">Titipan Desa</div>' +
        '<div class="kpi-value">' + rp(res.milikDesa) + '</div>' +
        '<div class="kpi-foot"><span class="kpi-delta flat">belum disetor</span></div></div>' +
      '<div class="kpi" style="background:var(--g-gold-soft);"><div class="kpi-label">Titipan Daerah</div>' +
        '<div class="kpi-value" style="color:#6f5220;">' + rp(res.milikDaerah) + '</div>' +
        '<div class="kpi-foot"><span class="kpi-delta flat">belum disetor</span></div></div>' +
      '<div class="kpi"><div class="kpi-label">Total Kas</div>' +
        '<div class="kpi-value">' + rp(res.totalKas) + '</div>' +
        '<div class="kpi-foot"><span class="kpi-delta flat">' + esc((res.periode && res.periode.nama) || '') + '</span></div></div>' +
    '</div>';

    // A. Dari mana Total Kas berasal
    var rowsA = ''
      + '<tr><td>Saldo awal periode</td><td class="r amt">' + num(res.saldoAwal) + '</td></tr>'
      + '<tr><td>Pemasukan periode ini</td><td class="r amt in">+ ' + num(res.totalMasuk) + '</td></tr>'
      + '<tr><td>Pengeluaran periode ini <span class="t-name">(termasuk setoran ke desa)</span></td><td class="r amt out">− ' + num(res.totalKeluar) + '</td></tr>'
      + '<tr style="font-weight:800;border-top:2px solid var(--admin-soft);"><td>TOTAL KAS</td><td class="r amt">' + num(res.totalKas) + '</td></tr>';

    // B. Titipan — kenapa sebagian kas bukan milik kelompok
    var rowsB = (res.rincianPos || []).map(function(p) {
      var ket = p.sisa > 0 ? '<span style="color:var(--g-gold);">belum disetor</span>'
              : (p.lebih > 0 ? '<span style="color:var(--g-mid);">lunas, lebih ' + rp(p.lebih) + '</span>' : 'lunas');
      return '<tr><td class="t-jenis">' + esc(p.nama) + '<div class="t-name" style="font-size:11px;">' + esc(p.dasar) + ' · ke ' + esc(p.tujuan) + '</div></td>' +
        '<td class="r amt">' + num(p.kewajiban) + '</td>' +
        '<td class="r amt in">' + num(p.disetor) + '</td>' +
        '<td class="r amt">' + num(p.sisa) + '</td>' +
        '<td>' + ket + '</td></tr>';
    }).join('');
    if (res.belumDirinci > 0) {
      rowsB += '<tr style="background:var(--g-gold-soft);"><td class="t-jenis">Buku IR belum dirinci' +
        '<div class="t-name" style="font-size:11px;">kewajiban belum bisa dihitung sampai dirincikan</div></td>' +
        '<td class="r amt">—</td><td class="r amt">—</td><td class="r amt">' + num(res.belumDirinci) + '</td>' +
        '<td><span style="color:var(--g-gold);">perlu dirinci</span></td></tr>';
    }
    rowsB += '<tr style="font-weight:800;border-top:2px solid var(--admin-soft);"><td>TOTAL TITIPAN</td>' +
      '<td class="r amt">' + num(res.kewajiban) + '</td><td class="r amt in">' + num(res.sudahSetor) + '</td>' +
      '<td class="r amt">' + num(res.milikDesa + res.milikDaerah) + '</td><td></td></tr>';

    // C. Sumber hak kelompok (konteks)
    var rowsC = (res.sumberKelompok || []).map(function(s) {
      return '<tr><td class="t-jenis">' + esc(s.jenis) + '</td><td class="r amt in">' + num(s.nilai) + '</td></tr>';
    }).join('') || '<tr><td colspan="2"><div class="empty">Belum ada pemasukan hak kelompok.</div></td></tr>';
    rowsC += '<tr style="font-weight:800;border-top:2px solid var(--admin-soft);"><td>TOTAL HAK KELOMPOK (periode ini)</td><td class="r amt">' + num(res.hakKelompokPeriode) + '</td></tr>';

    host.innerHTML = kartu +
      '<div style="background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:18px;">' +
        '<b>Milik Kelompok</b> = Total Kas ' + rp(res.totalKas) + ' − Titipan Desa ' + rp(res.milikDesa) + ' − Titipan Daerah ' + rp(res.milikDaerah) + ' = <b style="color:var(--g-deep);">' + rp(res.milikKelompok) + '</b>' +
        (res.kelompokNegatif ? '<div style="color:var(--g-gold);margin-top:6px;">⚠ Kas lebih kecil dari kewajiban — ada kewajiban yang belum tertutup.</div>' : '') +
      '</div>' +
      panelBox('A. Dari mana Total Kas berasal', (res.periode && res.periode.nama) || '', tableHtml([{t:'Uraian'},{t:'Nilai',r:true}], rowsA)) +
      panelBox('B. Titipan — bagian yang bukan milik kelompok', 'kewajiban setor per pos', tableHtml([{t:'Pos'},{t:'Kewajiban',r:true},{t:'Disetor',r:true},{t:'Sisa',r:true},{t:'Keterangan'}], rowsB)) +
      panelBox('C. Sumber hak kelompok dari pemasukan periode ini', 'konteks — sebagian sudah terpakai untuk pengeluaran', tableHtml([{t:'Jenis'},{t:'Hak Kelompok',r:true}], rowsC)) +
      '<p style="color:var(--text-muted);font-size:12px;margin-top:-6px;">Tabel C bukan penjumlahan langsung ke Milik Kelompok: sebagian hak kelompok sudah terpakai untuk pengeluaran periode berjalan. Angka Milik Kelompok dihitung dari sisa kas setelah dikurangi kewajiban yang belum disetor.</p>';
  }

  // ── VIEW: Bagi Hasil (Hak Kelompok / Desa / Daerah) ──
  function renderBagiHasil(host, res) {
    if (!res || !res.success) { host.innerHTML = errPanel(res); return; }
    var totMasuk = res.totalMasuk || 0;
    function pct(v) { return totMasuk > 0 ? Math.round(v / totMasuk * 100) : 0; }
    // Kartu ringkasan: 3 hak + total pemasukan.
    var kartu = '<div class="kpi-strip" style="grid-template-columns:repeat(4,1fr);">' +
      '<div class="kpi" style="background:linear-gradient(150deg,var(--g-deep),var(--g-mid));color:#fff;border:none;box-shadow:var(--shadow-emerald);">' +
        '<div class="kpi-label" style="color:rgba(255,255,255,.85);">Hak Kelompok</div>' +
        '<div class="kpi-value" style="color:#fff;">' + rp(res.kelompok) + '</div>' +
        '<div class="kpi-foot"><span class="kpi-delta" style="color:rgba(255,255,255,.8);">' + pct(res.kelompok) + '% dari pemasukan</span></div></div>' +
      '<div class="kpi" style="background:var(--g-mist);"><div class="kpi-label">Hak Desa</div>' +
        '<div class="kpi-value">' + rp(res.desa) + '</div>' +
        '<div class="kpi-foot"><span class="kpi-delta flat">' + pct(res.desa) + '% dari pemasukan</span></div></div>' +
      '<div class="kpi" style="background:var(--g-gold-soft);"><div class="kpi-label">Hak Daerah</div>' +
        '<div class="kpi-value" style="color:#6f5220;">' + rp(res.daerah) + '</div>' +
        '<div class="kpi-foot"><span class="kpi-delta flat">' + pct(res.daerah) + '% dari pemasukan</span></div></div>' +
      '<div class="kpi"><div class="kpi-label">Total Pemasukan</div>' +
        '<div class="kpi-value">' + rp(totMasuk) + '</div>' +
        '<div class="kpi-foot"><span class="kpi-delta flat">' + esc((res.periode && res.periode.nama) || '') + '</span></div></div>' +
    '</div>';
    // Bar proporsi.
    var bar = '';
    if (totMasuk > 0) {
      bar = '<div style="display:flex;height:14px;border-radius:8px;overflow:hidden;margin:2px 0 18px;box-shadow:var(--shadow);">' +
        '<div style="width:' + pct(res.kelompok) + '%;background:var(--g-mid);"></div>' +
        '<div style="width:' + pct(res.desa) + '%;background:var(--g-soft);"></div>' +
        '<div style="width:' + pct(res.daerah) + '%;background:var(--g-gold);"></div>' +

  // Buka kembali periode CLOSED (perbaiki salah tutup buku). PRIVILEGED.
  function bukaKembaliPeriode(id, nama) {
    if (!confirm('BUKA KEMBALI periode "' + nama + '"?\nPeriode aktif saat ini akan OTOMATIS DITUTUP. Aksi dicatat sebagai Aktivitas Istimewa.\n\nLanjut?')) return;
    var alasan = prompt('Alasan (minimal 10 karakter):');
    if (alasan === null || alasan.trim().length < 10) { toast('Alasan minimal 10 karakter.'); return; }
    function kirim(konf) {
      call('bukaKembaliPeriode', [id, alasan.trim(), konf], function(r) {
        if (r && r.success) { toast('Periode "' + (r.dibukaKembali || nama) + '" dibuka kembali'); go('periode'); return; }
        if (r && r.butuhKonfirmasiNama) {
          var k = prompt('Ketik ULANG nama periode untuk konfirmasi:\n"' + r.nama + '"');
          if (k === null) return;
          if (k.trim() !== r.nama) { toast('Nama tidak cocok.'); return; }
          kirim(k.trim()); return;
        }
        toast((r && r.message) || 'Gagal membuka kembali.');
      });
    }
    kirim('');
  }

  // Buat periode baru dari Admin Console. Saldo awal mengikuti rollforward tutup buku.
  function buatPeriodeBaru() {
    call('getInfoBukaPeriode', [], function(info) {
      if (!info || !info.success) { toast((info && info.message) || 'Gagal memuat info periode.'); return; }
      if (info.adaOpen) { toast('Masih ada periode OPEN. Tutup buku dulu.'); return; }
      var nama = prompt('Nama periode baru:', 'Periode ' + new Date().toISOString().substring(0,7));
      if (nama === null || !nama.trim()) return;
      var tglDefault = info.tglMulaiSaran || new Date().toISOString().substring(0,10);
      var tgl = prompt('Tanggal mulai (YYYY-MM-DD)' + (info.tanggalTutupTerakhir ? ' — sehari setelah tutup ' + info.tanggalTutupTerakhir : '') + ':', tglDefault);
      if (tgl === null || !tgl.trim()) return;
      var payload = { nama: nama.trim(), tglMulai: tgl.trim(), catatan: '' };
      if (info.adaPrev) {
        // Saldo awal terkunci ke rollforward; tawarkan override bila ada selisih.
        var pakaiRf = confirm('Saldo awal akan mengikuti tutup buku terakhir:\nTunai Rp ' + rp(info.rollforwardTunai) + '\nBank Rp ' + rp(info.rollforwardBank) + '\n\nOK = pakai angka itu. Cancel = ada selisih (isi manual + alasan).');
        if (pakaiRf) {
          payload.saldoAwalTunai = info.rollforwardTunai; payload.saldoAwalBank = info.rollforwardBank;
        } else {
          var t = prompt('Saldo Awal Tunai:', String(info.rollforwardTunai));
          if (t === null) return;
          var b = prompt('Saldo Awal Bank:', String(info.rollforwardBank));
          if (b === null) return;
          var alasan = prompt('Alasan selisih (wajib):', '');
          if (alasan === null || !alasan.trim()) { toast('Alasan selisih wajib diisi.'); return; }
          payload.saldoAwalTunai = Number(String(t).replace(/[^0-9]/g,'')) || 0;
          payload.saldoAwalBank = Number(String(b).replace(/[^0-9]/g,'')) || 0;
          payload.overrideRollforward = true; payload.alasanRollforward = alasan.trim();
        }
      } else {
        var t2 = prompt('Saldo Awal Tunai:', '0'); if (t2 === null) return;
        var b2 = prompt('Saldo Awal Bank:', '0'); if (b2 === null) return;
        payload.saldoAwalTunai = Number(String(t2).replace(/[^0-9]/g,'')) || 0;
        payload.saldoAwalBank = Number(String(b2).replace(/[^0-9]/g,'')) || 0;
      }
      call('bukaPeriode', [payload], function(res) {
        if (res && res.success) { toast('Periode baru dibuka ✓'); go('periode'); }
        else toast((res && res.message) || 'Gagal membuka periode.');
      });
    });
  }

  // Sparkline SVG dari array angka.
  function sparkSvg(pts, color, w, h) {
    w = w || 56; h = h || 22; var pad = 2;
    if (!pts || pts.length < 2) return '';
    var min = Math.min.apply(null, pts), max = Math.max.apply(null, pts), rng = (max - min) || 1;
    var step = (w - pad*2)/(pts.length - 1);
    var d = pts.map(function(v,i){ var x=pad+i*step; var y=h-pad-((v-min)/rng)*(h-pad*2); return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); }).join(' ');
    var last=pts[pts.length-1], lx=pad+(pts.length-1)*step, ly=h-pad-((last-min)/rng)*(h-pad*2);
    return '<svg class="spark" width="'+w+'" height="'+h+'"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="2.2" fill="'+color+'"/></svg>';
  }
  function deltaHtml(cur, prev) {
    if (!prev) return '<span class="kpi-delta flat">—</span>';
    var pct = Math.round((cur - prev) / prev * 100);
    if (pct > 0) return '<span class="kpi-delta up">▲ ' + pct + '%</span>';
    if (pct < 0) return '<span class="kpi-delta down">▼ ' + Math.abs(pct) + '%</span>';
    return '<span class="kpi-delta flat">0%</span>';
  }

  function viewDashboard(host) {
    var d = STATE;
    var arus = d.arus6 || [];
    var sparkIn = arus.map(function(a){ return a.masuk; });
    var sparkOut = arus.map(function(a){ return a.keluar; });
    var prevMasuk = arus.length >= 2 ? arus[arus.length-2].masuk : 0;
    var prevKeluar = arus.length >= 2 ? arus[arus.length-2].keluar : 0;
    var avgIn = arus.length ? arus.reduce(function(s,a){return s+a.masuk;},0)/arus.length : 0;
    var avgOut = arus.length ? arus.reduce(function(s,a){return s+a.keluar;},0)/arus.length : 0;

    var roleMap = { 'ADMIN':'rc-admin', 'BENDAHARA_1':'rc-b1', 'BENDAHARA_2':'rc-b2', 'PENULIS':'rc-pen', 'PENEROBOS':'rc-per' };
    var donutColors = ['#0F766E','#14B8A6','#F59E0B','#3B82F6','#A78BFA','#6B21A8'];

    // ── KPI strip ──
    var kpis = ''
      + '<div class="kpi"><div class="kpi-label"><span class="d" style="background:rgba(255,255,255,.7)"></span> Total Kas</div>'
      + '<div class="kpi-value" style="font-size:34px;">' + esc(rp(d.totalKas)) + '</div>'
      + '<div class="kpi-foot"><span class="kpi-delta" style="color:rgba(255,255,255,.75);">saldo terkini</span></div></div>'
      + kpi('Saldo Tunai', 'var(--tunai)', rp(d.kasTunai), '')
      + kpi('Saldo Bank', 'var(--bank)', rp(d.kasBank), '')
      + kpi('Masuk (bln ini)', 'var(--success)', rp(d.masukBulan), deltaHtml(d.masukBulan, prevMasuk) + sparkSvg(sparkIn, '#059669'))
      + kpi('Keluar (bln ini)', 'var(--danger)', rp(d.keluarBulan), deltaHtml(d.keluarBulan, prevKeluar) + sparkSvg(sparkOut, '#DC2626'))
      + '<div class="kpi"><div class="kpi-label"><span class="d" style="background:var(--admin)"></span> Transaksi Periode</div>'
      + '<div class="kpi-value"><span class="num">' + ((d.periode && d.periode.transaksi) || 0) + '</span></div>'
      + '<div class="kpi-foot"><span class="kpi-delta flat">periode berjalan</span></div></div>';

    // ── Arus kas bars ──
    var maxBar = Math.max(1, Math.max.apply(null, arus.map(function(a){ return Math.max(a.masuk, a.keluar); }).concat([1])));
    var barsHtml = arus.length ? arus.map(function(a) {
      var lbl = a.ym ? a.ym.substring(5) + '/' + a.ym.substring(2,4) : '';
      return '<div class="bar-col"><div class="bar-stack">'
        + '<div class="bar in" title="Masuk: ' + rp(a.masuk) + '" style="height:' + Math.round(a.masuk/maxBar*100) + '%"></div>'
        + '<div class="bar out" title="Keluar: ' + rp(a.keluar) + '" style="height:' + Math.round(a.keluar/maxBar*100) + '%"></div>'
        + '</div><div class="bar-label">' + esc(lbl) + '</div></div>';
    }).join('') : '<div class="empty" style="margin:auto;">Belum ada data transaksi.</div>';

    // ── Buku besar ──
    var rows = (d.bukuBesar || []).map(function(t) {
      var chipCls = String(t.sumber).toLowerCase() === 'bank' ? 'bank' : 'tunai';
      var sign = t.arah === 'in' ? '+' : '−';
      return '<tr><td class="t-date">' + esc(t.tgl) + '</td>'
        + '<td class="t-jenis">' + esc(t.jenis) + '</td>'
        + '<td class="t-name">' + esc(t.nama || '—') + '</td>'
        + '<td><span class="chip ' + chipCls + '"><span class="d"></span>' + esc(t.sumber) + '</span></td>'
        + '<td class="r amt ' + t.arah + '">' + sign + Number(t.nominal).toLocaleString('id-ID') + '</td>'
        + '<td><span class="t-oleh"><span class="av">' + esc(initials(t.oleh)) + '</span>' + esc(t.oleh) + '</span></td></tr>';
    }).join('');
    var bukuBody = rows || '<tr><td colspan="6"><div class="empty">Belum ada transaksi pada periode ini.</div></td></tr>';

    // ── Perlu tindakan ──
    var acts = [];
    if (d.belumDirinci > 0) acts.push(actItem('warn', '📖', 'Buku IR belum dirinci', 'Masuk tanpa rincian', d.belumDirinci));
    if (d.serahMenunggu > 0) acts.push(actItem('info', '🤲', 'Serah terima menunggu', 'Perlu konfirmasi bendahara', d.serahMenunggu));
    var actHtml = acts.length ? acts.join('') : '<div class="empty" style="padding:20px 16px;">✅ Tidak ada yang perlu ditindak.</div>';
    var actCount = acts.length;

    // ── Komposisi donut ──
    var komp = d.komposisi || [];
    var donutHtml = komp.length ? donut(komp, donutColors) : '<div class="empty">Belum ada pemasukan.</div>';
    var legend = komp.map(function(k, i) {
      return '<div class="dl"><span class="sw" style="background:' + donutColors[i % donutColors.length] + '"></span><span class="nm">' + esc(k.nama) + '</span><span class="vl">' + k.pct + '%</span></div>';
    }).join('');

    // ── Peran ──
    var roleOrder = ['ADMIN','BENDAHARA_1','BENDAHARA_2','PENULIS','PENEROBOS'];
    var roleLabel = { 'ADMIN':'ADMIN','BENDAHARA_1':'BENDAHARA 1','BENDAHARA_2':'BENDAHARA 2','PENULIS':'PENULIS','PENEROBOS':'PENEROBOS' };
    var roleChips = roleOrder.filter(function(r){ return (d.roles||{})[r]; }).map(function(r) {
      return '<span class="role-chip ' + (roleMap[r]||'') + '">' + roleLabel[r] + ' <span class="n">' + d.roles[r] + '</span></span>';
    }).join('') || '<span class="stat-sub">Belum ada user.</span>';

    // ── Log ──
    var logHtml = (d.logs || []).map(function(l) {
      return '<div class="log-item"><div class="log-dot"></div><div><div class="log-act"><span class="who">' + esc(l.who) + '</span> ' + esc((l.action||'').toLowerCase().replace(/_/g,' ')) + '</div><div class="log-time">' + esc(l.detail) + ' · ' + esc(l.time) + '</div></div></div>';
    }).join('') || '<div class="empty">Belum ada aktivitas.</div>';

    var periodeOpen = d.periode && String(d.periode.status).toUpperCase() === 'OPEN';

    host.innerHTML =
      '<div class="small-note">💡 Konsol ini dirancang untuk layar lebar. Untuk HP, gunakan versi mobile.</div>'
      + '<div class="kpi-strip">' + kpis + '</div>'
      + '<div class="grid-main"><div class="stack">'
        + '<div class="panel"><div class="panel-head"><div class="panel-title">Arus Kas <small>6 bulan terakhir</small></div></div>'
          + '<div class="chart-body"><div class="bars">' + barsHtml + '</div>'
          + '<div class="chart-side">'
            + '<div class="cs-item"><div class="cs-l"><span class="sw" style="background:#059669"></span> Rata2 masuk</div><div class="cs-v num">' + jt(avgIn) + '</div></div>'
            + '<div class="cs-item"><div class="cs-l"><span class="sw" style="background:#DC2626"></span> Rata2 keluar</div><div class="cs-v num">' + jt(avgOut) + '</div></div>'
            + '<div class="cs-item"><div class="cs-l"><span class="sw" style="background:#0F766E"></span> Surplus rata2</div><div class="cs-v num" style="color:var(--admin)">' + jt(avgIn - avgOut) + '</div></div>'
          + '</div></div></div>'
        + '<div class="panel"><div class="panel-head"><div class="panel-title">Buku Besar <small>transaksi periode berjalan</small></div></div>'
          + '<div style="overflow-x:auto;"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Anggota / Ket.</th><th>Sumber</th><th class="r">Nominal</th><th>Oleh</th></tr></thead><tbody>' + bukuBody + '</tbody></table></div>'
          + '<div class="table-foot"><span>Menampilkan ' + (d.bukuBesar||[]).length + ' dari ' + ((d.periode && d.periode.transaksi) || 0) + ' transaksi</span></div></div>'
      + '</div>'
      + '<div class="rail">'
        + '<div class="panel"><div class="panel-head"><div class="panel-title">Perlu Tindakan</div><span class="count-badge" style="margin-left:auto;">' + actCount + '</span></div>' + actHtml + '</div>'
        + '<div class="panel" id="bhPanel"><div class="panel-head"><div class="panel-title">Kepemilikan Saldo <small>dari Total Kas</small></div><span class="link" style="margin-left:auto;" onclick="go(\'kepemilikan\')">Rincian →</span></div><div class="sec-body" id="bhBody"><div class="empty" style="padding:14px 0;">Menghitung…</div></div></div>'
        + '<div class="panel pc"><span class="pc-status ' + (periodeOpen ? '' : 'closed') + '"><span style="width:5px;height:5px;border-radius:99px;background:currentColor;display:inline-block;"></span> ' + (periodeOpen ? 'Buku Terbuka' : 'Buku Tertutup') + '</span>'
          + '<div class="pc-name">' + esc((d.periode && d.periode.nama) || '—') + '</div>'
          + '<div class="pc-range">Mulai: ' + esc((d.periode && d.periode.mulai) || '—') + '</div>'
          + '<div class="pc-r"><span>Saldo awal tunai</span><span class="num">' + rp(d.periode && d.periode.saldoAwalTunai) + '</span></div>'
          + '<div class="pc-r"><span>Saldo awal bank</span><span class="num">' + rp(d.periode && d.periode.saldoAwalBank) + '</span></div>'
          + '<div class="pc-r"><span>Transaksi</span><span class="num">' + ((d.periode && d.periode.transaksi) || 0) + '</span></div>'
          + '<a class="btn btn-admin" href="' + esc(appUrl()) + '">🔒 Kelola di Aplikasi</a></div>'
        + '<div class="panel"><div class="panel-head"><div class="panel-title">Keamanan Akses</div><a class="link" style="margin-left:auto;" href="' + esc(appUrl()) + '">Kelola</a></div>'
          + '<div class="sec-body">'
            + '<div class="stat-row"><div class="stat-ico">📱</div><div><div class="stat-name">Perangkat terpercaya</div><div class="stat-sub">Status Aktif</div></div><div class="stat-val">' + d.perangkatAktif + '</div></div>'
            + '<div class="stat-row"><div class="stat-ico">🔐</div><div><div class="stat-name">Sesi aktif</div><div class="stat-sub">Belum kadaluarsa</div></div><div class="stat-val">' + d.sesiAktif + '</div></div>'
          + '</div></div>'
      + '</div></div>'
      + '<div class="grid-bottom">'
        + '<div class="panel"><div class="panel-head"><div class="panel-title">Komposisi Pemasukan</div></div><div class="donut-wrap"><div class="donut">' + donutHtml + '</div><div style="flex:1;">' + legend + '</div></div></div>'
        + '<div class="panel"><div class="panel-head"><div class="panel-title">Pengguna &amp; Peran</div><a class="link" style="margin-left:auto;" href="' + esc(appUrl()) + '">Kelola user</a></div><div class="sec-body"><div style="padding:4px 0 8px;">' + roleChips + '</div>'
          + '<div class="stat-row" style="border-top:1px solid var(--border-soft)"><div class="stat-ico">👤</div><div><div class="stat-name">Total pengguna aktif</div><div class="stat-sub">' + d.userNonaktif + ' nonaktif</div></div><div class="stat-val">' + d.userAktif + '</div></div></div></div>'
        + '<div class="panel"><div class="panel-head"><div class="panel-title">Aktivitas Terbaru</div><span class="link" onclick="go(\'log\')">Semua log</span></div><div class="sec-body">' + logHtml + '</div></div>'
      + '</div>';

    // Animasikan bar setelah render
    setTimeout(function() {
      document.querySelectorAll('.bar').forEach(function(b) { var h = b.style.height; b.style.height = '0'; requestAnimationFrame(function(){ b.style.height = h; }); });
    }, 30);

    // Isi panel Kepemilikan Saldo — dari Total Kas: milik Kelompok/Desa/Daerah (async).
    call('getKepemilikanSaldo', [], function(r) {
      var el = document.getElementById('bhBody');
      if (!el) return;
      if (!r || !r.success) { el.innerHTML = '<div class="empty" style="padding:14px 0;">' + esc((r && r.message) || 'Gagal memuat.') + '</div>'; return; }
      var tot = r.totalKas || 0;
      function pc(v) { return tot > 0 ? Math.round(Math.max(0, v) / tot * 100) : 0; }
      var bar = tot > 0
        ? '<div style="display:flex;height:12px;border-radius:7px;overflow:hidden;margin:2px 0 12px;">' +
            '<div style="width:' + pc(r.milikKelompok) + '%;background:var(--g-mid);"></div>' +
            '<div style="width:' + pc(r.milikDesa) + '%;background:var(--g-soft);"></div>' +
            '<div style="width:' + pc(r.milikDaerah) + '%;background:var(--g-gold);"></div>' +
          '</div>'
        : '';
      function row(sw, nama, val, sub) {
        return '<div class="stat-row"><span class="sw" style="width:11px;height:11px;border-radius:3px;background:' + sw + ';flex:none;"></span>' +
          '<div><div class="stat-name">' + nama + '</div>' + (sub ? '<div class="stat-sub">' + sub + '</div>' : '') + '</div>' +
          '<div class="stat-val">' + rp(val) + '</div></div>';
      }
      // Rincikan asal angka titipan agar jelas: sisa kewajiban vs Buku IR belum dirinci.
      var ketDesa = (r.belumDirinci > 0)
        ? 'sisa kewajiban ' + rp(r.sisaKewajiban) + ' + belum dirinci ' + rp(r.belumDirinci)
        : 'sisa kewajiban belum disetor';
      el.innerHTML = bar +
        row('var(--g-mid)', 'Milik Kelompok', r.milikKelompok, r.kelompokNegatif ? '⚠ kas kurang dari kewajiban' : 'bebas dipakai kelompok') +
        row('var(--g-soft)', 'Titipan Desa', r.milikDesa, ketDesa) +
        row('var(--g-gold)', 'Titipan Daerah', r.milikDaerah, 'sisa kewajiban ke daerah') +
        '<div class="stat-row" style="border-top:1px solid var(--border-soft);"><span class="sw" style="width:11px;flex:none;"></span><div><div class="stat-name">Total Kas</div><div class="stat-sub">sudah disetor ' + rp(r.sudahSetor) + ' dari kewajiban ' + rp(r.kewajiban) + '</div></div><div class="stat-val">' + rp(tot) + '</div></div>';
    });
  }

  function kpi(label, color, value, foot) {
    return '<div class="kpi"><div class="kpi-label"><span class="d" style="background:' + color + '"></span> ' + esc(label) + '</div>'
      + '<div class="kpi-value"><span class="num">' + esc(value) + '</span></div>'
      + '<div class="kpi-foot">' + (foot || '<span class="kpi-delta flat">saldo terkini</span>') + '</div></div>';
  }
  // Angka pelat CMYK — teks asli + 3 lapis warna offset (murni CSS).
  function cmykNum(text) {
    var t = esc(text);
    return '<span class="cmyk-num"><span class="paper">' + t + '</span>'
      + '<span class="plate plate-c" aria-hidden="true">' + t + '</span>'
      + '<span class="plate plate-m" aria-hidden="true">' + t + '</span>'
      + '<span class="plate plate-y" aria-hidden="true">' + t + '</span></span>';
  }
  function actItem(cls, ico, title, sub, count) {
    return '<div class="act ' + cls + '"><div class="act-ico">' + ico + '</div><div class="act-body"><div class="act-title">' + esc(title) + '</div><div class="act-sub">' + esc(sub) + '</div></div><div class="act-count">' + count + ' <span class="chev">›</span></div></div>';
  }
  function donut(komp, colors) {
    var size=118, stroke=20, r=(size-stroke)/2, cx=size/2, cy=size/2, circ=2*Math.PI*r, off=0;
    var total = komp.reduce(function(s,k){ return s + k.nilai; }, 0);
    var svg='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate(-90deg)"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#EFEDE4" stroke-width="'+stroke+'"/>';
    komp.forEach(function(k, i){ var frac = total ? k.nilai/total : 0; var len=frac*circ; svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colors[i%colors.length]+'" stroke-width="'+stroke+'" stroke-dasharray="'+len+' '+(circ-len)+'" stroke-dashoffset="'+(-off)+'"/>'; off+=len; });
    svg+='</svg>';
    return svg + '<div class="donut-center"><b>' + jt(total) + '</b><small>total masuk</small></div>';
  }
  // ── VIEW: Kelola User ──
  function viewUsers(host, res) {
    if (!res || !res.success) { host.innerHTML = errPanel(res); return; }
    var roles = res.roles || [];
    USERS = {};
    (res.data || []).forEach(function(u) { USERS[u.email.toLowerCase()] = u; });
    var rows = (res.data || []).map(function(u) {
      var aktif = String(u.status || 'Aktif').toLowerCase() !== 'nonaktif';
      var eS = esc(u.email).replace(/'/g, "\\'");
      var roleSel = '<select class="asel" onchange="chgRole(\'' + eS + '\', this.value)">' + roles.map(function(r){ return '<option value="' + esc(r) + '"' + (r === u.role ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('') + '</select>';
      return '<tr><td class="t-jenis">' + esc(u.nama || '-') + '</td>'
        + '<td class="t-name">' + esc(u.email) + '</td>'
        + '<td>' + roleSel + '</td>'
        + '<td><span class="badge ' + (aktif ? 'b-ok' : 'b-need') + '">' + (aktif ? 'Aktif' : 'Nonaktif') + '</span></td>'
        + '<td class="t-date">' + esc(u.created || '') + '</td>'
        + '<td style="white-space:nowrap;"><button class="abtn" onclick="toggleUser(\'' + eS + '\',' + aktif + ')">' + (aktif ? 'Nonaktifkan' : 'Aktifkan') + '</button> '
        + '<button class="abtn danger" onclick="delUser(\'' + eS + '\')">Hapus</button></td></tr>';
    }).join('') || '<tr><td colspan="6"><div class="empty">Belum ada user.</div></td></tr>';
    host.innerHTML = '<div class="panel"><div class="panel-head"><div class="panel-title">Kelola User <small>' + (res.data || []).length + ' pengguna</small></div></div>'
      + '<div style="overflow-x:auto;"><table><thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Status</th><th>Dibuat</th><th>Aksi</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }
  function chgRole(email, role) {
    var u = USERS[String(email).toLowerCase()]; if (!u) return;
    call('updateUser', [{ email: u.email, nama: u.nama, role: role, status: u.status }], function(res) {
      if (res && res.success) { toast('Role diperbarui.'); go('users'); } else { toast((res && res.message) || 'Gagal.'); go('users'); }
    });
  }
  function toggleUser(email, aktif) {
    call('setUserStatus', [email, aktif ? 'Nonaktif' : 'Aktif'], function(res) {
      if (res && res.success) { toast('Status diperbarui.'); go('users'); } else toast((res && res.message) || 'Gagal.');
    });
  }
  function delUser(email) {
    if (!confirm('Hapus user ' + email + '? Tindakan ini permanen.')) return;
    call('deleteUser', [email], function(res) {
      if (res && res.success) { toast('User dihapus.'); go('users'); } else toast((res && res.message) || 'Gagal.');
    });
  }

  // ── VIEW: Perangkat & Sesi ──
  function viewDevices(host, res) {
    if (!res || !res.success) { host.innerHTML = errPanel(res); return; }
    var rows = (res.data || []).map(function(dv) {
      var aktif = String(dv.status).toLowerCase() === 'aktif';
      var idS = esc(dv.id).replace(/'/g, "\\'");
      var namaS = esc(dv.nama).replace(/'/g, "\\'");
      return '<tr><td class="t-jenis">' + esc(dv.nama) + '</td>'
        + '<td class="t-name">' + esc(dv.email) + '</td>'
        + '<td class="t-date">' + esc(dv.dibuat) + '</td>'
        + '<td class="t-date">' + esc(dv.terakhir) + '</td>'
        + '<td><span class="badge ' + (aktif ? 'b-ok' : 'b-need') + '">' + esc(dv.status) + '</span></td>'
        + '<td>' + (aktif ? '<button class="abtn danger" onclick="revoke(\'' + idS + '\',\'' + namaS + '\')">Cabut</button>' : '—') + '</td></tr>';
    }).join('') || '<tr><td colspan="6"><div class="empty">Belum ada perangkat.</div></td></tr>';
    host.innerHTML = '<div class="panel"><div class="panel-head"><div class="panel-title">Perangkat &amp; Sesi <small>' + (res.data || []).length + ' perangkat</small></div></div>'
      + '<div class="small-note" style="display:block;margin:12px 16px 0;">Cabut perangkat yang hilang/tidak dikenal — sesi aktifnya langsung berakhir.</div>'
      + '<div style="overflow-x:auto;padding-top:8px;"><table><thead><tr><th>Perangkat</th><th>Email</th><th>Dibuat</th><th>Terakhir</th><th>Status</th><th>Aksi</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }
  function revoke(id, nama) {
    if (!confirm('Cabut perangkat "' + nama + '"? Sesi aktifnya akan berakhir.')) return;
    call('revokeDevice', [id], function(res) {
      if (res && res.success) { toast('Perangkat dicabut (' + (res.sesiDicabut || 0) + ' sesi).'); go('devices'); } else toast((res && res.message) || 'Gagal.');
    });
  }

  // ── VIEW: Activity Log ──
  function viewLog(host, res) {
    if (!res || !res.success) { host.innerHTML = errPanel(res); return; }
    var rows = (res.data || []).map(function(l) {
      return '<tr><td class="t-date">' + esc(l.waktu) + '</td>'
        + '<td class="t-jenis">' + esc(l.user) + '</td>'
        + '<td><span class="badge" style="background:var(--admin-soft);color:var(--admin-dark);">' + esc((l.action || '').replace(/_/g, ' ')) + '</span></td>'
        + '<td class="t-name">' + esc(l.detail) + '</td></tr>';
    }).join('') || '<tr><td colspan="4"><div class="empty">Belum ada aktivitas.</div></td></tr>';
    host.innerHTML = '<div class="panel"><div class="panel-head"><div class="panel-title">Activity Log <small>' + (res.data || []).length + ' terbaru</small></div></div>'
      + '<div style="overflow-x:auto;"><table><thead><tr><th>Waktu</th><th>User</th><th>Aksi</th><th>Detail</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }

  load();
</script>
</body>
</html>
