  // Tutup buku dari halaman Pemeriksaan Saldo (pakai input ps*).
  // Memanggil tutupBuku yang benar-benar mengubah status periode → CLOSED.
  konfirmasiTutupSaldo: function() {
    var saldoTunai = App.num('psTunai');
    var saldoBank  = App.num('psBank');
    var catatan    = (document.getElementById('psCatatan') || {}).value || '';
    if (!confirm('Tutup buku periode ini?\n\nSaldo akhir dicatat final & status periode diubah ke CLOSED. Lanjutkan?')) return;
    this._kirimTutupBuku({ saldoTunaiAktual: saldoTunai, saldoBankAktual: saldoBank, catatan: catatan });
  },

  // Kirim tutup buku; bila server melapor ADA SELISIH, minta alasan lalu resubmit.
  _kirimTutupBuku: function(payload) {
    var self = this;
    self.showLoading('Menutup buku...');
    App.srv()
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          self.toast(res.newPeriode ? ('Buku ditutup ✓ Periode baru: ' + res.newPeriode.nama) : 'Buku berhasil ditutup ✓');
          self.loadDashboard();
          return;
        }
        if (res && res.adaSelisih) {
          var al = prompt('⚠️ ADA SELISIH KAS antara sistem & hitungan aktual:\n' +
            'Selisih Tunai: Rp ' + Number(res.selisihTunai || 0).toLocaleString('id-ID') + '\n' +
            'Selisih Bank: Rp ' + Number(res.selisihBank || 0).toLocaleString('id-ID') + '\n\n' +
            'Selisih akan dicatat sebagai penyesuaian. Alasan selisih (wajib):', '');
          if (al === null) { self.pagePemeriksaanSaldo ? self.pagePemeriksaanSaldo() : self.loadDashboard(); return; }
          al = String(al).trim();
          if (!al) { self.showError('Alasan selisih wajib diisi. Ulangi tutup buku.'); return; }
          payload.alasanSelisih = al;
          self._kirimTutupBuku(payload);
          return;
        }
        self.showError((res && res.message) || 'Gagal tutup buku');
      })
      .withFailureHandler(function(err) { self.showError((err && err.message) || 'Gagal terhubung'); })
      .tutupBuku(payload);
  },

  buatLaporanPDF: function() {
    var btn = document.getElementById('btnLaporanPDF');
    var errEl = document.getElementById('laporanPDFError');
    var resEl = document.getElementById('laporanPDFResult');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Membuat laporan...'; }
    errEl.innerHTML = '';
    resEl.style.display = 'none';
    // Buka tab baru dulu (sebelum async call) agar tidak diblokir popup blocker
    var win = window.open('', '_blank');
    if (win) win.document.write('<html><body style="font-family:Arial;padding:24px;color:#555;">⏳ Menyiapkan laporan...</body></html>');
    App.srv()
      .withSuccessHandler(function(res) {
        if (btn) { btn.disabled = false; btn.textContent = '📄 Buat & Unduh Laporan'; }
        if (!res.success) {
          if (win) win.close();
          errEl.innerHTML = '<div class="error-box">' + (res.message || 'Gagal membuat laporan') + '</div>';
          return;
        }
        // Periode tertutup → arahkan ke berkas arsip (snapshot final).
        if (res.dariArsip && res.arsipUrl) {
          if (win) { win.location.href = res.arsipUrl; } else { window.open(res.arsipUrl, '_blank'); }
          return;
        }
        // Tulis HTML langsung ke tab yang sudah dibuka — render di browser
        if (win) {
          win.document.open();
          win.document.write(res.html);
          win.document.close();
        } else {
          // Fallback: popup diblokir, tampilkan link manual
          resEl.style.display = 'block';
          resEl.innerHTML = '⚠️ Popup diblokir. <a href="#" onclick="App._openLaporanManual();return false;">Klik di sini untuk buka laporan</a>';
          App._laporanHtml = res.html;
        }
      })
      .withFailureHandler(function(err) {
        if (btn) { btn.disabled = false; btn.textContent = '📄 Buat & Unduh Laporan'; }
        if (win) win.close();
        errEl.innerHTML = '<div class="error-box">' + err.message + '</div>';
      })
      .generatePDF();
  },

  _openLaporanManual: function() {
    if (!this._laporanHtml) return;
    var win = window.open('', '_blank');
    if (win) { win.document.open(); win.document.write(this._laporanHtml); win.document.close(); }
  },

        '<div class="form-group"><label>Target Total (Rp)</label><input type="text" inputmode="numeric" data-tsep="1" id="patTarget" placeholder="mis. 11000000" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;text-align:right;"/></div>' +

  _bagiTargetPatungan: function() {
    var counts = this._patunganGradeCounts || {};
    var keys = Object.keys(counts);
    var target = App.num('patTarget');
    if (target <= 0) {
      document.getElementById('patError').innerHTML = '<div class="error-box">Isi Target Total dulu (mis. 11000000)</div>';
      return;
    }
    // Hitung total unit bobot = Σ (bobot_g × jumlah_jamaah_g)
    var totalUnit = 0;
    var bobot = {};
    keys.forEach(function(g) {
      var w = parseFloat((document.getElementById('bobot_' + g) || {}).value);
      if (isNaN(w) || w < 0) w = 1; // default bobot 1 jika kosong
      bobot[g] = w;
      totalUnit += w * counts[g];
    });
    if (totalUnit <= 0) {
      document.getElementById('patError').innerHTML = '<div class="error-box">Total bobot × jamaah harus > 0</div>';
      return;
    }
    var perUnit = target / totalUnit;
    // Nominal per orang grade g = perUnit × bobot_g, dibulatkan ke 10.000 terdekat
    keys.forEach(function(g) {
      var nominal = Math.round((perUnit * bobot[g]) / 10000) * 10000;
      var el = document.getElementById('grade_' + g);
      if (el) { el.value = nominal; App._formatTsep(el); }
    });
    document.getElementById('patError').innerHTML = '';
    this._hitungTotalPatungan();
  },

  _hitungTotalPatungan: function() {
    var counts = this._patunganGradeCounts || {};
    var total = 0;
    Object.keys(counts).forEach(function(g) {
      var el = document.getElementById('grade_' + g);
      if (el) total += (App.num(el)) * counts[g];
    });
    var el = document.getElementById('patTotal');
    if (el) {
      var txt = 'Rp ' + total.toLocaleString('id-ID');
      var tgtEl = document.getElementById('patTarget');
      var target = tgtEl ? (App.num(tgtEl)) : 0;
      if (target > 0) {
        var selisih = total - target;
        if (selisih === 0) txt += ' ✅ (pas target)';
        else txt += (selisih > 0 ? ' (+' : ' (−') + Math.abs(selisih).toLocaleString('id-ID') + ' dari target)';
      }
      el.textContent = txt;
    }
  },

  submitPatungan: function() {
    var self = this;
    var nama = (document.getElementById('patNama') || {}).value || '';
    if (!nama.trim()) {
      document.getElementById('patError').innerHTML = '<div class="error-box">Nama musyawarah wajib diisi</div>';
      return;
    }
    var counts = this._patunganGradeCounts || {};
    var gradeConfig = {};
    var hasGrade = false;
    Object.keys(counts).forEach(function(g) {
      var el = document.getElementById('grade_' + g);
      var val = App.num(el);
      if (val > 0) { gradeConfig[g] = val; hasGrade = true; }
    });
    if (!hasGrade) {
      document.getElementById('patError').innerHTML = '<div class="error-box">Isi minimal satu grade dengan nominal > 0</div>';
      return;
    }
    var data = {
      nama: nama.trim(),
      tanggal: (document.getElementById('patTgl') || {}).value || '',
      catatan: (document.getElementById('patCatatan') || {}).value || '',
      gradeConfig: gradeConfig
    };
    document.getElementById('patError').innerHTML = '<div class="info-box">⏳ Membuat penerobosan...</div>';
    App.srv()
      .withSuccessHandler(function(res) {
        if (!res.success) {
          document.getElementById('patError').innerHTML = '<div class="error-box">' + res.message + '</div>';
          return;
        }
        self.toast('Terobosan Kelompok dibuat! ' + (res.tagihanCount || 0) + ' penerobosan, total Rp ' + (res.total || 0).toLocaleString('id-ID'));
        self.pagePatungan();
      })
      .withFailureHandler(function(err) {
        document.getElementById('patError').innerHTML = '<div class="error-box">' + err.message + '</div>';
      })
      .addPatungan(data);
  },

    var rows = Object.keys(byGrade).sort().map(function(g) {

  pageHakAkses: function() {
    this.history.push('setting');
    this.showLoading('Memuat hak akses...');
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {

      })

      .getPermMatrix();

  renderHakAkses: function(res) {
    var caps = res.capabilities || [];
    var roles = res.roles || [];
    var matrix = res.matrix || {};
    this._hakAksesRoles = roles;
    this._hakAksesCaps = caps.map(function(c){ return c.code; });

    function th(t){ return '<th style="padding:6px 8px;border:1px solid #d1d5db;background:#f3f4f6;font-size:11px;text-align:center;">' + t + '</th>'; }

    var head = '<th style="padding:6px 8px;border:1px solid #d1d5db;background:#f3f4f6;font-size:11px;text-align:left;">Hak Akses</th>' +
      roles.map(function(r){ return th(r.replace('BENDAHARA_','B')); }).join('');

    var lastGrup = '';
    var body = caps.map(function(c) {
      var grupRow = '';
      if (c.grup !== lastGrup) {
        lastGrup = c.grup;
        grupRow = '<tr><td colspan="' + (roles.length+1) + '" style="padding:5px 8px;background:#e5e7eb;font-weight:bold;font-size:11px;">' +
          (c.grup === 'lihat' ? '👁️ LIHAT (Menu)' : '✏️ EDIT / AKSI') + '</td></tr>';
      }
      var cells = roles.map(function(r) {
        var checked = !!(matrix[r] && matrix[r][c.code]);
        var isAdmin = (r === 'ADMIN');
        return '<td style="padding:4px;border:1px solid #d1d5db;text-align:center;">' +
          '<input type="checkbox" data-cap="' + c.code + '" data-role="' + r + '"' +
          (checked ? ' checked' : '') + (isAdmin ? ' disabled title="ADMIN selalu penuh"' : '') + '/></td>';
      }).join('');
      return grupRow + '<tr><td style="padding:4px 8px;border:1px solid #d1d5db;font-size:11px;">' + c.label + '</td>' + cells + '</tr>';
    }).join('');

    var html = this.pageWrapper('Kelola Hak Akses',
      '<div class="info-box mb-12">Centang = role boleh. Kolom ADMIN terkunci (selalu penuh). Perubahan berlaku setelah user login ulang / refresh.</div>' +
      '<div id="hakAksesError"></div>' +
      '<div style="overflow-x:auto;"><table style="border-collapse:collapse;width:100%;"><tr>' + head + '</tr>' + body + '</table></div>' +
      '<button class="btn btn-primary" style="margin-top:14px;" onclick="App.saveHakAkses()">💾 Simpan Hak Akses</button>'
    );
    document.getElementById('app').innerHTML = html;
  },

  saveHakAkses: function() {
    var self = this;
    var roles = this._hakAksesRoles || [];
    var matrix = {};
    roles.forEach(function(r){ matrix[r] = {}; });
    var boxes = document.querySelectorAll('input[type="checkbox"][data-cap]');
    for (var i = 0; i < boxes.length; i++) {
      var b = boxes[i];
      var r = b.getAttribute('data-role');
      var cap = b.getAttribute('data-cap');
      if (!matrix[r]) matrix[r] = {};
      matrix[r][cap] = (r === 'ADMIN') ? true : b.checked;
    }
    document.getElementById('hakAksesError').innerHTML = '<div class="info-box">⏳ Menyimpan...</div>';
    App.srv()
      .withSuccessHandler(function(res) {
        if (!res.success) { document.getElementById('hakAksesError').innerHTML = '<div class="error-box">' + res.message + '</div>'; return; }
        self.toast('Hak akses tersimpan ✓');
        self.pageSetting();
      })
      .withFailureHandler(function(err) {
        document.getElementById('hakAksesError').innerHTML = '<div class="error-box">' + err.message + '</div>';
      })
      .savePermMatrix(matrix);
  },

  renderSettingList: function(title, data, mode) {
    this._settingData = data;
    this._settingMap = {};
    data.forEach(function(item) { App._settingMap[item.id] = item; });
    var list = data.map(function(item) {
      var detail = '';
      if (mode === 'pemasukan' || mode === 'pengeluaran') detail = App.escapeHtml((item.kategori || '') + ' · ' + (item.status || ''));
      else if (mode === 'posSetoran') {
        var sumberTxt = item.sumberTipe === 'bukuir' ? ('Buku IR: ' + item.sumberRef)
          : item.sumberTipe === 'pemasukan' ? ('Pemasukan: ' + item.sumberRef)
          : 'Manual';
        detail = App.escapeHtml(sumberTxt + ' · ' + (item.status || ''));
      }
      else if (mode === 'musyawaroh') detail = App.formatNumber(item.nilai || 0);
      var safeId = String(item.id).replace(/'/g, '&#39;');
      return '<div class="setting-item">' +
        '<div class="setting-item-info"><div class="setting-item-nama">' + App.escapeHtml(item.nama) + '</div><div class="setting-item-detail">' + detail + '</div></div>' +
        '<div class="setting-item-actions">' +
          '<button class="action-btn-sm edit" onclick="App.showSettingForm(App._settingMap[\'' + safeId + '\'])">Edit</button>' +
          '<button class="action-btn-sm hapus" onclick="App.deleteSettingItem(\'' + safeId + '\')">Hapus</button>' +
        '</div>' +
      '</div>';
    }).join('') || '<div class="text-center text-muted" style="padding:24px;">Belum ada data.</div>';

    var html = this.pageWrapper(title,
      '<button class="btn btn-primary mb-16" onclick="App.showSettingForm(null)">+ Tambah</button>' +
      list +
      '<div id="settingModal"></div>'
    );
    document.getElementById('app').innerHTML = html;
  },

          '<option value="bukuir"' + (st === 'bukuir' ? ' selected' : '') + '>Dari kolom Buku IR</option>' +
          '<option value="pemasukan"' + (st === 'pemasukan' ? ' selected' : '') + '>Dari jenis Pemasukan (% Desa)</option>' +
        '</select></div>' +
        '<div class="form-group" id="grpRefBukuIR" style="display:' + (st === 'bukuir' ? 'block' : 'none') + ';"><label>Kolom Buku IR</label><select id="sRefBukuIR">' + irOpts + '</select></div>' +
        '<div class="form-group" id="grpRefPemasukan" style="display:' + (st === 'pemasukan' ? 'block' : 'none') + ';"><label>Jenis Pemasukan</label><select id="sRefPemasukan"><option value="">-- Pilih --</option>' + pmOpts + '</select></div>' +

  closeModalSettingDirect: function() {
    var el = document.getElementById('settingModal');
    if (el) el.innerHTML = '';
  },

  submitSettingItem: function() {
    var mode = this._settingMode;
    var isEdit = !!this._editSettingItem;
    var nama = (document.getElementById('sNama').value || '').trim();
    if (!nama) {
      document.getElementById('settingFormError').innerHTML = '<div class="error-box">Nama wajib diisi.</div>';
      return;
    }
    var data = { nama: nama };
    if (isEdit) data.id = this._editSettingItem.id;

    if (mode === 'pemasukan' || mode === 'pengeluaran') {
      data.kategori = document.getElementById('sKategori').value;
      data.status = document.getElementById('sStatus').value;
    } else if (mode === 'posSetoran') {
      var st = document.getElementById('sSumberTipe').value;
      data.sumberTipe = st;
      if (st === 'bukuir') data.sumberRef = document.getElementById('sRefBukuIR').value;
      else if (st === 'pemasukan') data.sumberRef = document.getElementById('sRefPemasukan').value;
      else data.sumberRef = '';
      data.target = st === 'manual' ? (App.num('sTarget')) : 0;
      data.pengeluaranRef = document.getElementById('sPengeluaranRef').value;
      data.status = document.getElementById('sStatus').value;
      if (st === 'pemasukan' && !data.sumberRef) {
        document.getElementById('settingFormError').innerHTML = '<div class="error-box">Pilih jenis pemasukan terlebih dahulu.</div>';
        return;
      }
    } else if (mode === 'musyawaroh') {
      data.nilai = App.num('sNilai');
      data.keterangan = document.getElementById('sKet').value;
    }

    var fnMap = {
      pemasukan: isEdit ? 'updatePosPemasukan' : 'addPosPemasukan',
      pengeluaran: isEdit ? 'updatePosPengeluaran' : 'addPosPengeluaran',
      posSetoran: isEdit ? 'updatePosSetoran' : 'addPosSetoran',
      musyawaroh: isEdit ? 'updateMusyawaroh' : 'addMusyawaroh'
    };
    var fn = fnMap[mode];
    document.getElementById('settingFormError').innerHTML = '<div class="info-box">Menyimpan...</div>';
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Tersimpan ✓');
          if (mode === 'pemasukan') self.pagePosPemasukan();
          else if (mode === 'pengeluaran') self.pagePosPengeluaran();
          else if (mode === 'posSetoran') self.pagePosSetoran();
          else self.pageMusyawaroh();
        } else {
          document.getElementById('settingFormError').innerHTML = '<div class="error-box">' + res.message + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        document.getElementById('settingFormError').innerHTML = '<div class="error-box">Error: ' + err.message + '</div>';
      })
      [fn](data);
  },

  deleteSettingItem: function(id) {
    if (!confirm('Hapus item ini?')) return;
    var mode = this._settingMode;
    var fnMap = {
      pemasukan: 'deletePosPemasukan',
      pengeluaran: 'deletePosPengeluaran',
      posSetoran: 'deletePosSetoran',
      musyawaroh: 'deleteMusyawaroh'
    };
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Dihapus');
          if (mode === 'pemasukan') self.pagePosPemasukan();
          else if (mode === 'pengeluaran') self.pagePosPengeluaran();
          else if (mode === 'posSetoran') self.pagePosSetoran();
          else self.pageMusyawaroh();
        } else { self.toast('Gagal: ' + res.message); }
      })
      .withFailureHandler(function(err) { self.toast('Error: ' + err.message); })
      [fnMap[mode]](id);
  },

  // ─────────────────────────────────────────────────
  // UTILITIES
  // ─────────────────────────────────────────────────
  // ─────────────────────────────────────────────────
  // RIWAYAT TRANSAKSI SAYA
  // Menampilkan transaksi yang diinput user login.
  // Tampil 10 terbaru; sisanya dapat dilihat dengan scroll.
  // ─────────────────────────────────────────────────
  pageRiwayatSaya: function() {
    this.history.push('dashboard');
    this.showLoading('Memuat riwayat transaksi...');
    var self = this;
    App.srv()
      .withSuccessHandler(function(r) {
        if (r && r.success) self.renderRiwayatSaya(r);
        else self.showError((r && r.message) || 'Gagal memuat riwayat');
      })
      .withFailureHandler(function(err) {
        self.showError((err && err.message) || 'Gagal memuat riwayat');
      })
      .getRiwayatTransaksiSaya();
  },

  renderRiwayatSaya: function(res) {
    var self = this;
    var data = (res && res.data) || [];
    var periodeOpen = !!(res && res.periodeOpen);
    var LIMIT = 10; // jumlah yang tampil sebelum scroll

    // Setelah edit/hapus, kembali ke halaman ini.
    App._editTrxReturn = 'riwayat';
    App._editTrxMap = App._editTrxMap || {};
    data.forEach(function(t) {
      if (t.tipe === 'masuk' || t.tipe === 'keluar') {
        App._editTrxMap[t.id] = { tipe: t.tipe, sumber: t.sumberKas, jenisId: t.jenisId, jenis: t.jenis, anggotaId: t.anggotaId || '', tanggal: t.tanggal, nominal: t.nominal, catatan: t.catatan };
      }
    });

    var content;
    if (!data.length) {
      content = '<div class="info-box">Belum ada transaksi yang Anda input.</div>';
    } else {
      var rows = data.map(function(t) {
        var masuk = (t.tipe === 'masuk');
        var warna = t.tipe === 'mutasi' ? 'var(--bank)' : (masuk ? 'var(--success)' : 'var(--danger)');
        var tanda = t.tipe === 'mutasi' ? '' : (masuk ? '+' : '−');
        var sumber = t.sumberKas ? ' • ' + self._esc(t.sumberKas) : '';
        var catatan = t.catatan ? '<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">' + self._esc(t.catatan) + '</div>' : '';
        // Bisa diedit: periode OPEN + tipe masuk/keluar + punya izin sesuai sumber kas.
        var canEdit = periodeOpen && (t.tipe === 'masuk' || t.tipe === 'keluar') &&
          ((t.sumberKas === 'Tunai' && App.can('trx.edit.tunai')) || (t.sumberKas === 'Bank' && App.can('trx.edit.bank')));
        var eid = self._esc(t.id).replace(/'/g, "\\'");
        var actions = canEdit ? '<div style="display:flex;gap:8px;margin-top:8px;">' +
            '<button class="btn btn-sm btn-warning" onclick="App.editTrx(\'' + eid + '\')">✏️ Edit</button>' +
            '<button class="btn btn-sm btn-danger" onclick="App.hapusTrx(\'' + eid + '\')">🗑️ Hapus</button>' +
          '</div>' : '';
        return '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);">' +
            '<div style="min-width:0;">' +
              '<div style="font-weight:600;">' + self._esc(t.jenis) + (t.noBukti ? ' <span style="font-size:10px;color:var(--admin,#0F766E);font-weight:700;">' + self._esc(t.noBukti) + '</span>' : '') + '</div>' +
              '<div style="font-size:12px;color:var(--text-muted);">' + self.formatDate(t.tanggal) + sumber + '</div>' +
              catatan + actions +
            '</div>' +
            '<div style="font-weight:700;color:' + warna + ';white-space:nowrap;">' + tanda + self.formatNumber(t.nominal) + '</div>' +
          '</div>';
      }).join('');
      // Tanpa scroll internal bila ada tombol aksi (agar tombol tak terpotong).
      var adaAksi = periodeOpen && (App.can('trx.edit.tunai') || App.can('trx.edit.bank'));
      var scrollStyle = (!adaAksi && data.length > LIMIT) ? 'max-height:560px;overflow-y:auto;' : '';
      var hint = (data.length > LIMIT)
        ? '<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">Menampilkan ' + data.length + ' transaksi' + (periodeOpen ? ' — bisa diedit/hapus selama periode belum tutup buku.' : ' (periode sudah tutup buku — hanya lihat).') + '</div>'
        : '';
      content =
        '<div class="card" style="margin-bottom:12px;">' +
          '<div class="stat-row"><span class="stat-label">Total Transaksi Saya</span><span class="stat-value">' + data.length + '</span></div>' +
        '</div>' +
        hint +
        '<div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;' + scrollStyle + '">' + rows + '</div>';
    }
    document.getElementById('app').innerHTML = this.pageWrapper('Riwayat Transaksi Saya', content);
  },

  // FASE 1: escaping HTML untuk semua data dinamis sebelum masuk innerHTML (V5).
  // Wajib membungkus data dari input pengguna (nama, catatan, email, keterangan)
  // agar payload seperti <img onerror=...> tidak tereksekusi (XSS tersimpan).
  escapeHtml: function(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  },
  // Alias lama.
  _esc: function(s) { return this.escapeHtml(s); },

  // ─────────────────────────────────────────────────

  renderImportCsv: function(masterP, masterPK) {

    var optP = aktif(masterP).map(function(p) { return '<option value="' + p.id + '">' + App.escapeHtml(p.nama) + '</option>'; }).join('');

      '<div class="info-box" style="margin-bottom:12px;">Format kolom: <b>Tanggal, Tipe, Nominal, Keterangan</b>.<br>Tanggal <code>YYYY-MM-DD</code>, Tipe <code>masuk</code>/<code>keluar</code>. Baris judul boleh disertakan.</div>' +
      '<div class="form-group"><label>Sumber Kas</label><select id="impSumber"><option value="Bank">Bank</option><option value="Tunai">Tunai</option></select></div>' +
      '<div class="form-group"><label>Jenis untuk baris "masuk"</label><select id="impJenisMasuk">' + (optP || '<option value="">-- tidak ada --</option>') + '</select></div>' +
      '<div class="form-group"><label>Jenis untuk baris "keluar"</label><select id="impJenisKeluar">' + (optPK || '<option value="">-- tidak ada --</option>') + '</select></div>' +
      '<div class="form-group"><label>Data CSV (tempel di sini)</label>' +
        '<textarea id="impCsv" rows="8" placeholder="Tanggal,Tipe,Nominal,Keterangan\n2026-06-05,masuk,50000,Setoran ..." style="font-family:monospace;font-size:12px;"></textarea></div>' +
      '<button class="btn btn-secondary" onclick="App.previewCsv()">👁️ Pratinjau</button>' +
      '<div id="impPreview" style="margin-top:12px;"></div>';
    document.getElementById('app').innerHTML = this.pageWrapper('Input CSV', content);
  },

  previewCsv: function() {
    var raw = (document.getElementById('impCsv').value || '').trim();
    if (!raw) { document.getElementById('impPreview').innerHTML = '<div class="error-box">Tempel data CSV dulu.</div>'; return; }
    var lines = raw.split(/\r?\n/).filter(function(l) { return l.trim(); });
    var rows = [];
    lines.forEach(function(line, idx) {
      var parts = line.split(',');
      if (parts.length < 3) return;
      var tanggal = (parts[0] || '').trim();
      var tipe = (parts[1] || '').trim().toLowerCase();
      var nominal = (parts[2] || '').replace(/[^0-9]/g, '');
      var keterangan = parts.slice(3).join(',').trim();
      // Lewati baris judul (nominal bukan angka pada baris pertama)
      if (idx === 0 && !/^\d+$/.test(nominal)) return;
      rows.push({ tanggal: tanggal, tipe: tipe, nominal: Number(nominal) || 0, keterangan: keterangan });
    });
    this._csvRows = rows;
    if (!rows.length) { document.getElementById('impPreview').innerHTML = '<div class="error-box">Tidak ada baris valid terbaca.</div>'; return; }
    var tMasuk = 0, tKeluar = 0, nInvalid = 0;
    var trs = rows.map(function(r) {
      var ok = (r.tipe === 'masuk' || r.tipe === 'keluar') && r.nominal > 0 && r.tanggal;
      if (!ok) nInvalid++;
      if (r.tipe === 'masuk') tMasuk += r.nominal; else if (r.tipe === 'keluar') tKeluar += r.nominal;
      var warna = r.tipe === 'masuk' ? 'var(--success)' : 'var(--danger)';
      return '<tr' + (ok ? '' : ' style="background:#FEE2E2;"') + '>' +
        '<td style="padding:4px 6px;font-size:12px;">' + App.escapeHtml(r.tanggal) + '</td>' +
        '<td style="padding:4px 6px;font-size:12px;color:' + warna + ';font-weight:600;">' + App.escapeHtml(r.tipe) + '</td>' +
        '<td style="padding:4px 6px;font-size:12px;text-align:right;">' + App.formatNumber(r.nominal) + '</td>' +
        '<td style="padding:4px 6px;font-size:12px;">' + App.escapeHtml(r.keterangan) + '</td></tr>';
    }).join('');
    document.getElementById('impPreview').innerHTML =
      '<div class="card" style="margin-bottom:10px;">' +
        '<div class="stat-row"><span class="stat-label">Baris terbaca</span><span class="stat-value">' + rows.length + (nInvalid ? ' (' + nInvalid + ' invalid)' : '') + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Total Masuk</span><span class="stat-value" style="color:var(--success);">' + App.formatNumber(tMasuk) + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Total Keluar</span><span class="stat-value" style="color:var(--danger);">' + App.formatNumber(tKeluar) + '</span></div>' +
      '</div>' +
      '<div style="max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:8px;"><table style="width:100%;border-collapse:collapse;">' +
        '<thead><tr style="background:#F8FAFC;"><th style="padding:5px 6px;text-align:left;font-size:11px;">Tanggal</th><th style="padding:5px 6px;text-align:left;font-size:11px;">Tipe</th><th style="padding:5px 6px;text-align:right;font-size:11px;">Nominal</th><th style="padding:5px 6px;text-align:left;font-size:11px;">Keterangan</th></tr></thead>' +
        '<tbody>' + trs + '</tbody></table></div>' +
      '<div id="impError" style="margin-top:10px;"></div>' +
      '<button class="btn btn-primary" style="margin-top:10px;" onclick="App.submitImportCsv()">📥 Impor ' + rows.length + ' Transaksi</button>';
  },

          self.toast(msg);
          self.loadDashboard();
        } else {
          errEl.innerHTML = '<div class="error-box">❌ ' + self.escapeHtml((res && res.message) || 'Gagal impor.') + '</div>';
        }
      })
      .withFailureHandler(function(err) { errEl.innerHTML = '<div class="error-box">❌ Gagal terhubung. ' + self.escapeHtml((err && err.message) || '') + '</div>'; })
      .importTransaksiCSV(payload);

  toast: function(msg, duration) {
    var existing = document.querySelector('.toast');
    if (existing) existing.remove();
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function() { el.classList.add('show'); }, 10);
    setTimeout(function() {
      el.classList.remove('show');
      setTimeout(function() { if (el.parentNode) el.remove(); }, 300);
    }, duration || 2500);
  },

  back: function() {
    var prev = this.history.pop();
    if (!prev || prev === 'dashboard') { this.loadDashboard(); return; }
    var map = {
      bukuIR: 'pageBukuIR',
      kelolaBuku: 'pageKelolaBuku',
      setting: 'pageSetting',
      jamaah: 'pageJamaah',
      setoranDesa: 'pageSetoranDesa',
      patungan: 'pagePatungan',
      aturGrade: 'pageAturGrade'
    };
    if (map[prev]) this[map[prev]]();
    else this.loadDashboard();
  },

  formatNumber: function(n) {
    if (!n && n !== 0) return 'Rp 0';
    return 'Rp ' + Number(n).toLocaleString('id-ID');
  },

  formatDate: function(d) {
    if (!d) return '-';
    try {
      var dt = new Date(d);
      if (isNaN(dt.getTime())) return String(d);
      var months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      var days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
      var str = days[dt.getDay()] + ', ' + dt.getDate() + ' ' + months[dt.getMonth()] + ' ' + dt.getFullYear();
      // Tampilkan jam jika ada komponen waktu (bukan hanya tanggal)
      var h = dt.getHours(), m = dt.getMinutes();
      if (h !== 0 || m !== 0) str += ', ' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ' WIB';
      return str;
    } catch(e) { return String(d); }
  },

  submitRekonsiliasi: function() {
    var periode = this._lastRekonData ? this._lastRekonData.periode : null;
    var periodeId = periode ? periode.id : '';
    var data = {
      periodeId: periodeId,
      tanggal: document.getElementById('rekonTgl').value,
      saldoAwal: App.num('rekonSaldoAwal'),
      pemasukan: App.num('rekonMasuk'),
      pengeluaran: App.num('rekonKeluar'),
      saldoAkhirActual: App.num('rekonSaldoAkhir'),
      catatan: document.getElementById('rekonCatatan').value
    };
    document.getElementById('rekonError').innerHTML = '<div class="info-box">Menyimpan...</div>';
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Rekonsiliasi tersimpan ✓');
          self.pageRekonsiliasi();
        } else {
          document.getElementById('rekonError').innerHTML = '<div class="error-box">' + res.message + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        document.getElementById('rekonError').innerHTML = '<div class="error-box">Error: ' + err.message + '</div>';
      })
      .submitRekonsiliasiBank(data);
  },

  showAddPendingForm: function() {
    var today = new Date().toISOString().split('T')[0];
    document.getElementById('pendingModal').innerHTML =
      '<div class="modal-overlay" onclick="App.closeModalPending(event)">' +
        '<div class="modal">' +
          '<div class="modal-title">Tambah Transaksi Pending</div>' +
          '<div class="form-group"><label>Tanggal</label><input type="date" id="pTgl" value="' + today + '"/></div>' +
          '<div class="form-group"><label>Keterangan *</label><input type="text" id="pKet" placeholder="Deskripsi transaksi..."/></div>' +

          '<div class="form-group"><label>Sumber</label>' +
            '<select id="pSumber"><option value="Desa">Desa</option><option value="Daerah">Daerah</option><option value="Jamaah">Jamaah</option><option value="Bank">Bank</option><option value="Manual">Manual</option></select>' +

  closeModalPending: function(e) {

  closeModalPendingDirect: function() {
    var el = document.getElementById('pendingModal');

  },

  submitAddPending: function() {
    var ket = (document.getElementById('pKet').value || '').trim();
    if (!ket) {
      document.getElementById('pendingFormError').innerHTML = '<div class="error-box">Keterangan wajib diisi.</div>';
      return;
    }
    var data = {
      tanggal: document.getElementById('pTgl').value,
      keterangan: ket,
      nominal: App.num('pNominal'),
      sumber: document.getElementById('pSumber').value,
      catatan: document.getElementById('pCatatan').value
    };
    document.getElementById('pendingFormError').innerHTML = '<div class="info-box">Menyimpan...</div>';
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Pending ditambahkan ✓');
          self.pageRekonsiliasi();
        } else {
          document.getElementById('pendingFormError').innerHTML = '<div class="error-box">' + res.message + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        document.getElementById('pendingFormError').innerHTML = '<div class="error-box">Error: ' + err.message + '</div>';

  // ─────────────────────────────────────────────────
  // LAPORAN SETORAN
  // ─────────────────────────────────────────────────
  pageLaporanSetoran: function() {
    this.history.push('dashboard');
    this.showLoading('Menghitung laporan setoran...');
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {
        if (!res.success) { self.showError(res.message); return; }
        self.renderLaporanSetoran(res);
      })
      .withFailureHandler(function(err) { self.showError(err.message); })
      .getLaporanSetoran();
  },

  renderLaporanSetoran: function(res) {
    var self = this;
    self._laporanSetoran = res;
    var s = res.summary || {};
    var data = res.data || [];

    var kewajiban = s.totalTarget || 0;
    var persen = kewajiban > 0 ? Math.round((s.totalSudahSetor || 0) / kewajiban * 100) : 0;

    var summaryCards =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">' +
        '<div style="background:linear-gradient(135deg,#2563EB,#1E40AF);border-radius:12px;padding:14px;color:white;">' +
          '<div style="font-size:11px;opacity:0.85;margin-bottom:4px;">Kewajiban ke Desa</div>' +
          '<div style="font-size:16px;font-weight:800;">' + App.formatNumber(kewajiban) + '</div>' +
          '<div style="font-size:10px;opacity:0.75;margin-top:3px;">' + (s.jumlahBulan || 1) + ' bln × ' + (s.jumlahJamaahAktif || 0) + ' jamaah</div>' +
        '</div>' +
        '<div style="background:linear-gradient(135deg,#059669,#047857);border-radius:12px;padding:14px;color:white;">' +
          '<div style="font-size:11px;opacity:0.85;margin-bottom:4px;">Jatah dari Pemasukan</div>' +
          '<div style="font-size:16px;font-weight:800;">' + App.formatNumber(s.totalJatahDesa || 0) + '</div>' +
          '<div style="font-size:10px;opacity:0.75;margin-top:3px;">otomatis dari % Desa</div>' +
        '</div>' +
        '<div style="background:linear-gradient(135deg,#7C3AED,#6D28D9);border-radius:12px;padding:14px;color:white;">' +
          '<div style="font-size:11px;opacity:0.85;margin-bottom:4px;">Sudah Disetor</div>' +
          '<div style="font-size:16px;font-weight:800;">' + App.formatNumber(s.totalSudahSetor || 0) + '</div>' +
          '<div style="font-size:10px;opacity:0.75;margin-top:3px;">realisasi (' + persen + '%)</div>' +
        '</div>' +
        '<div style="background:linear-gradient(135deg,#F59E0B,#D97706);border-radius:12px;padding:14px;color:white;">' +
          '<div style="font-size:11px;opacity:0.85;margin-bottom:4px;">Tambahan dari Kas</div>' +
          '<div style="font-size:16px;font-weight:800;">' + App.formatNumber(s.totalTopUpKas || 0) + '</div>' +
          '<div style="font-size:10px;opacity:0.75;margin-top:3px;">kekurangan pemasukan</div>' +
        '</div>' +
      '</div>';

    var cards = data.map(function(item, idx) {
      var badgeClass = item.status === 'Lunas' ? 'lunas' : (item.status === 'Sebagian' ? 'pending' : 'belum');
      var topUpRow = item.topUpKas > 0
        ? '<div class="pos-card-row"><span class="pos-card-label">+ dari Kas</span><span class="pos-card-value" style="color:#D97706;">' + App.formatNumber(item.topUpKas) + '</span></div>'
        : '';
      var targetRow = item.targetMusyawaroh > 0
        ? '<div class="pos-card-row"><span class="pos-card-label">Target Musyawaroh</span><span class="pos-card-value">' + App.formatNumber(item.targetMusyawaroh) + '</span></div>'
        : '';
      return '<div class="pos-card">' +
        '<div class="pos-card-header">' +
          '<div class="pos-card-nama">' + App.escapeHtml(item.nama) + ' <span style="font-size:10px;color:var(--text-muted);font-weight:500;">(' + item.pctDesa + '% desa)</span></div>' +
          '<span class="status-badge ' + badgeClass + '">' + item.status + '</span>' +
        '</div>' +
        '<div class="pos-card-row"><span class="pos-card-label">Pemasukan</span><span class="pos-card-value">' + App.formatNumber(item.totalMasuk) + '</span></div>' +
        '<div class="pos-card-row"><span class="pos-card-label">Jatah Desa (otomatis)</span><span class="pos-card-value text-success">' + App.formatNumber(item.jatahDesa) + '</span></div>' +
        targetRow +
        topUpRow +
        '<div class="pos-card-row"><span class="pos-card-label">Sudah Disetor</span><span class="pos-card-value">' + App.formatNumber(item.sudahSetor) + (item.sudahDiinput ? '' : ' <span style="font-size:9px;color:var(--text-muted);">(belum diinput)</span>') + '</span></div>' +
        '<div class="pos-card-row"><span class="pos-card-label">Sisa</span><span class="pos-card-value" style="color:' + (item.sisa > 0 ? 'var(--danger)' : 'var(--success)') + ';font-weight:700;">' + App.formatNumber(item.sisa) + '</span></div>' +
        (item.tindakLanjut ? '<div style="font-size:11px;color:var(--text-muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">' + item.tindakLanjut + '</div>' : '') +
        '<div style="display:flex;gap:6px;margin-top:8px;">' +
          '<button class="btn btn-outline btn-sm" style="flex:1;font-size:12px;" onclick="App.showEditSetoranDesa(' + idx + ')">✏️ Input Setoran</button>' +
          '<button class="action-btn-sm edit" style="flex:1;justify-content:center;font-size:12px;" onclick="App.pageJamaahBelumBayar(\'' + String(item.id).replace(/'/g, "\\'") + '\')">👥 Cek Jamaah</button>' +
        '</div>' +
      '</div>';
    }).join('') || '<div class="text-center text-muted" style="padding:32px;">Belum ada jenis pemasukan dengan jatah desa. Atur % Desa di Master Pemasukan.</div>';

    var html = self.pageWrapper('Laporan Setoran Desa',
      summaryCards + cards + '<div id="setoranDesaModal"></div>'
    );
    document.getElementById('app').innerHTML = html;
  },

  showEditSetoranDesa: function(idx) {
    var item = (this._laporanSetoran && this._laporanSetoran.data) ? this._laporanSetoran.data[idx] : null;
    if (!item) return;
    this._editSetoranDesaItem = item;
    // Saran nilai setoran = kewajiban (target musyawaroh atau jatah desa)
    var saran = item.sudahDiinput ? item.sudahSetor : item.kewajiban;
    document.getElementById('setoranDesaModal').innerHTML =
      '<div class="modal-overlay" onclick="App.closeModalSetoranDesa(event)">' +
        '<div class="modal">' +
          '<div class="modal-title">Setoran Desa: ' + App.escapeHtml(item.nama) + '</div>' +
          '<div class="info-box" style="margin-bottom:10px;font-size:12px;">Jatah dari pemasukan: <b>' + App.formatNumber(item.jatahDesa) + '</b>' +
            (item.topUpKas > 0 ? '<br>Perlu tambahan dari kas: <b>' + App.formatNumber(item.topUpKas) + '</b>' : '') +
            '<br>Kewajiban setor: <b>' + App.formatNumber(item.kewajiban) + '</b></div>' +
          '<div class="form-group"><label>Jumlah Disetor (Rp)</label><input type="text" inputmode="numeric" data-tsep="1" id="sdRealisasi" value="' + saran + '"/></div>' +
          '<div class="form-group"><label>Catatan</label><input type="text" id="sdCatatan" placeholder="opsional"/></div>' +
          '<div id="setoranDesaError"></div>' +
          '<button class="btn btn-primary" onclick="App.submitSetoranDesa()">Simpan Setoran</button>' +
          '<button class="btn btn-outline mt-8" onclick="App.closeModalSetoranDesaDirect()">Batal</button>' +
        '</div>' +
      '</div>';
  },

  closeModalSetoranDesa: function(e) {
    if (e.target.classList.contains('modal-overlay')) this.closeModalSetoranDesaDirect();
  },

  closeModalSetoranDesaDirect: function() {
    var el = document.getElementById('setoranDesaModal');
    if (el) el.innerHTML = '';
  },

  submitSetoranDesa: function() {
    var item = this._editSetoranDesaItem;
    var data = {
      posId: item.id, // disimpan sebagai referensi jenis pemasukan
      realisasi: App.num('sdRealisasi'),
      catatan: document.getElementById('sdCatatan').value
    };
    document.getElementById('setoranDesaError').innerHTML = '<div class="info-box">Menyimpan...</div>';
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Setoran berhasil disimpan ✓');
          self.pageLaporanSetoran();
        } else {
          document.getElementById('setoranDesaError').innerHTML = '<div class="error-box">' + res.message + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        document.getElementById('setoranDesaError').innerHTML = '<div class="error-box">Error: ' + err.message + '</div>';
      })
      .submitRealisasiSetoran(data);
  },

  pageJamaahBelumBayar: function(posNama) {
    this.history.push('laporanSetoran');
    this.showLoading('Memuat data jamaah...');
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {
        if (!res.success) { self.showError(res.message); return; }
        self.renderJamaahBelumBayar(res, 'belum');
      })
      .withFailureHandler(function(err) { self.showError(err.message); })
      .getJamaahBelumBayar(posNama);
  },

  renderJamaahBelumBayar: function(res, activeTab) {
    var self = this;
    self._jamaahBayarData = res;
    var belum = res.belumBayar || [];
    var sudah = res.sudahBayar || [];

    var listBelum = belum.length === 0
      ? '<div class="text-center text-muted" style="padding:32px;">Semua jamaah sudah infak 👍</div>'
      : belum.map(function(a) {
          return '<div class="jamaah-card">' +
            '<div class="jamaah-avatar">' + (a.nama || 'J').charAt(0).toUpperCase() + '</div>' +
            '<div class="jamaah-info">' +
              '<div class="jamaah-nama">' + App.escapeHtml(a.nama) + '</div>' +
              '<div class="jamaah-detail">' + App.escapeHtml(a.noTelp || '-') + '</div>' +
              (a.targetBayar > 0 ? '<div class="jamaah-detail" style="color:var(--danger);font-weight:600;">Belum bayar: ' + App.formatNumber(a.targetBayar) + '</div>' : '') +
            '</div>' +
          '</div>';
        }).join('');

    var listSudah = sudah.length === 0
      ? '<div class="text-center text-muted" style="padding:32px;">Belum ada yang membayar.</div>'
      : sudah.map(function(a) {
          return '<div class="jamaah-card">' +
            '<div class="jamaah-avatar" style="background:linear-gradient(135deg,var(--success),#047857);">' + (a.nama || 'J').charAt(0).toUpperCase() + '</div>' +
            '<div class="jamaah-info">' +
              '<div class="jamaah-nama">' + App.escapeHtml(a.nama) + '</div>' +
              '<div class="jamaah-detail">' + App.escapeHtml(a.noTelp || '-') + '</div>' +
              '<div class="jamaah-detail" style="color:var(--success);font-weight:600;">Bayar: ' + App.formatNumber(a.jumlahBayar) + '</div>' +
            '</div>' +
            '<span class="status-badge lunas">✓ Bayar</span>' +
          '</div>';
        }).join('');

    var total = res.total || {};
    var summary =
      '<div class="card" style="margin-bottom:12px;">' +
        '<div class="stat-row"><span class="stat-label">Pos</span><span class="stat-value">' + App.escapeHtml(res.posNama) + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Total Jamaah</span><span class="stat-value">' + (total.totalAnggota || 0) + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Belum Infak</span><span class="stat-value text-danger">' + (total.belum || 0) + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Sudah Infak</span><span class="stat-value text-success">' + (total.sudah || 0) + '</span></div>' +
      '</div>';

    var html = self.pageWrapper('Jamaah per Pos',
      summary +
      '<div class="tabs">' +
        '<button class="tab-btn' + (activeTab === 'belum' ? ' active' : '') + '" onclick="App.renderJamaahBelumBayar(App._jamaahBayarData, \'belum\')">Belum Infak <span class="badge">' + belum.length + '</span></button>' +
        '<button class="tab-btn' + (activeTab === 'sudah' ? ' active' : '') + '" onclick="App.renderJamaahBelumBayar(App._jamaahBayarData, \'sudah\')">Sudah Infak <span class="badge" style="background:var(--success);">' + sudah.length + '</span></button>' +
      '</div>' +
      (activeTab === 'belum' ? listBelum : listSudah)
    );
    document.getElementById('app').innerHTML = html;
  },

  // ─────────────────────────────────────────────────
  // PENEROBOS — Dashboard (3 tab: Buku IR, Infak, Pembelaan)
  // ─────────────────────────────────────────────────
  pagePenerobos: function(activeTab) {
    this.history.push('dashboard');
    activeTab = activeTab || 'bukuir';
    this._penerobosTab = activeTab;
    this.showLoading('Memuat data...');
    var self = this;
    if (activeTab === 'bukuir') {
      App.srv()
        .withSuccessHandler(function(res) {
          if (!res.success) { self.showError(res.message); return; }
          self._bukuIRBelumSerah = res;
          self.renderPenerobosHome();
        })
        .withFailureHandler(function(err) { self.showError(err.message); })
        .getBukuIRBelumSerah();
    } else if (activeTab === 'infak') {
      App.srv()
        .withSuccessHandler(function(res) {
          if (!res.success) { self.showError(res.message); return; }
          self._penerobosData = res;
          self.renderPenerobosHome();
        })
        .withFailureHandler(function(err) { self.showError(err.message); })
        .getTagihanPenerobos();
    } else {
      App.srv()
        .withSuccessHandler(function(res) {
          if (!res.success) { self.showError(res.message); return; }
          self._pembelaanData = res;
          self.renderPenerobosHome();
        })
        .withFailureHandler(function(err) { self.showError(err.message); })
        .getPembelaanData();
    }
  },

  renderPenerobosHome: function() {
    var tab = this._penerobosTab || 'bukuir';
    var content = '';

    if (tab === 'bukuir') {
      var d = this._bukuIRBelumSerah || {};
      var belum = d.belumSerah || [], sudah = d.sudahSerah || [];
      var listB = belum.length === 0
        ? '<div class="text-center text-muted" style="padding:32px;">Semua buku IR sudah diserahkan 👍</div>'
        : belum.map(function(a) {
            var wa = (a.noTelp || '').replace(/[^0-9]/g, '');
            var waBtn = wa ? '<a href="https://wa.me/62' + wa.replace(/^0/,'') + '?text=' + encodeURIComponent('Assalamu\'alaikum ' + a.nama + ', mohon segera menyerahkan Buku IR. Jazakallah khair') + '" target="_blank" style="background:#25D366;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;text-decoration:none;white-space:nowrap;">WA</a>' : '';
            return '<div class="jamaah-card">' +
              '<div class="jamaah-avatar" style="background:linear-gradient(135deg,#F59E0B,#B45309);">' + (a.nama||'J').charAt(0).toUpperCase() + '</div>' +
              '<div class="jamaah-info">' +
                '<div class="jamaah-nama">' + App.escapeHtml(a.nama) + '</div>' +
                '<div class="jamaah-detail">' + App.formatNumber(a.nominal) + ' · ' + App.formatDate(a.tanggal) + '</div>' +
              '</div>' + waBtn +
            '</div>';
          }).join('');
      content =
        '<div style="display:flex;gap:10px;margin-bottom:12px;">' +
          '<div style="flex:1;text-align:center;background:#FEF3C7;border-radius:10px;padding:12px 0;">' +
            '<div style="font-size:22px;font-weight:700;color:#B45309;">' + belum.length + '</div>' +
            '<div style="font-size:11px;color:#6B7280;">Belum Serah</div>' +
          '</div>' +
          '<div style="flex:1;text-align:center;background:#F0FDF4;border-radius:10px;padding:12px 0;">' +
            '<div style="font-size:22px;font-weight:700;color:var(--success);">' + sudah.length + '</div>' +
            '<div style="font-size:11px;color:#6B7280;">Sudah Serah</div>' +
          '</div>' +
        '</div>' +
        '<div class="section-title mb-8">Belum Menyerahkan Buku IR</div>' +
        listB;

    } else if (tab === 'infak') {
      var summary = (this._penerobosData || {}).summary || [];
      content = summary.map(function(pos, idx) {
        var pct = pos.totalAnggota > 0 ? Math.round((pos.sudah / pos.totalAnggota) * 100) : 0;
        var fillClass = pct >= 100 ? '' : pct >= 60 ? 'warning' : 'danger';
        return '<div class="pos-card" style="cursor:pointer;" onclick="App.pagePenerobosDetail(' + idx + ')">' +
          '<div class="pos-card-header">' +
            '<div style="flex:1;">' +
              '<div class="pos-card-nama">' + App.escapeHtml(pos.nama) + '</div>' +
              '<div class="progress-bar" style="margin-top:6px;"><div class="progress-fill ' + fillClass + '" style="width:' + pct + '%;"></div></div>' +
            '</div>' +
            '<div style="text-align:right;padding-left:12px;">' +
              '<div style="font-size:18px;font-weight:700;color:' + (pct>=100?'var(--success)':'var(--danger)') + ';">' + pct + '%</div>' +
              '<div class="text-small text-muted">' + pos.sudah + '/' + pos.totalAnggota + '</div>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:8px;margin-top:8px;">' +
            '<div style="flex:1;text-align:center;background:#FEF2F2;border-radius:8px;padding:6px 0;"><div style="font-weight:700;color:var(--danger);">' + pos.belum + '</div><div style="font-size:11px;color:#6B7280;">Belum</div></div>' +
            '<div style="flex:1;text-align:center;background:#F0FDF4;border-radius:8px;padding:6px 0;"><div style="font-weight:700;color:var(--success);">' + pos.sudah + '</div><div style="font-size:11px;color:#6B7280;">Sudah</div></div>' +
          '</div>' +
        '</div>';
      }).join('') || '<div class="info-box">Belum ada pos pemasukan aktif.</div>';

    } else {
      // Tab pembelaan
      var pd = this._pembelaanData || {};
      content = this._buildPembelaanContent(pd);
    }

    var html = this.pageWrapper('Dashboard Penerobos',
      '<div class="tabs">' +
        '<button class="tab-btn' + (tab==='bukuir'?' active':'') + '" onclick="App.pagePenerobos(\'bukuir\')">📖 Buku IR</button>' +
        '<button class="tab-btn' + (tab==='infak'?' active':'') + '" onclick="App.pagePenerobos(\'infak\')">💰 Infak</button>' +
        '<button class="tab-btn' + (tab==='pembelaan'?' active':'') + '" onclick="App.pagePenerobos(\'pembelaan\')">📝 Pembelaan</button>' +
      '</div>' +
      content
    );
    document.getElementById('app').innerHTML = html;
  },

  _buildPembelaanContent: function(pd) {
    var belum = pd.belum || [], lunas = pd.lunas || [];
    var today = new Date().toISOString().split('T')[0];

    var listBelum = belum.length === 0
      ? '<div class="text-center text-muted" style="padding:20px;">Belum ada kesanggupan tercatat.</div>'
      : belum.map(function(r) {
          var lewat = r.tanggalJanji && r.tanggalJanji < today;
          var borderColor = lewat ? '#EF4444' : '#F59E0B';
          var tag = lewat ? '<span style="font-size:10px;background:#FEE2E2;color:#B91C1C;border-radius:4px;padding:1px 6px;">Terlambat</span>' : '<span style="font-size:10px;background:#FEF3C7;color:#92400E;border-radius:4px;padding:1px 6px;">Menunggu</span>';
          return '<div style="border:1.5px solid ' + borderColor + ';border-radius:12px;padding:12px;margin-bottom:10px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:flex-start;">' +
              '<div>' +
                '<div style="font-weight:700;">' + App.escapeHtml(r.anggotaNama) + '</div>' +
                '<div class="text-small text-muted">Sanggup: ' + App.formatNumber(r.nominal) + '</div>' +
                '<div class="text-small text-muted">Janji bayar: ' + App.formatDate(r.tanggalJanji) + '</div>' +
                (r.catatan ? '<div class="text-small text-muted">' + App.escapeHtml(r.catatan) + '</div>' : '') +
              '</div>' + tag +
            '</div>' +
            '<div style="display:flex;gap:8px;margin-top:8px;">' +
              '<button class="btn btn-success btn-sm" style="flex:1;" onclick="App.markLunasPembelaan(\'' + r.id + '\')">✓ Lunas</button>' +
            '</div>' +
          '</div>';
        }).join('');

    var listLunas = lunas.length === 0
      ? '<div class="text-center text-muted" style="padding:20px;">Belum ada yang lunas.</div>'
      : lunas.map(function(r) {
          return '<div class="jamaah-card">' +
            '<div class="jamaah-avatar" style="background:linear-gradient(135deg,var(--success),#047857);">' + (r.anggotaNama||'J').charAt(0).toUpperCase() + '</div>' +
            '<div class="jamaah-info">' +
              '<div class="jamaah-nama">' + App.escapeHtml(r.anggotaNama) + '</div>' +
              '<div class="jamaah-detail">' + App.formatNumber(r.nominal) + ' · Lunas ' + App.formatDate(r.lunasAt) + '</div>' +
            '</div>' +
            '<span class="status-badge lunas">Lunas</span>' +
          '</div>';
        }).join('');

    var angOpts = '<option value="">-- Pilih Jamaah --</option>' + (pd.anggotaList || []).map(function(a){
      return '<option value="' + App.escapeHtml(a.id) + '">' + App.escapeHtml(a.nama) + '</option>';
    }).join('');

    return '<div class="card" style="margin-bottom:12px;">' +
        '<div class="section-title mb-8">+ Input Kesanggupan Baru</div>' +
        '<div class="form-group"><label>Jamaah</label><select id="pbAnggota">' + angOpts + '</select></div>' +
        '<div class="form-group"><label>Nominal Sanggup (Rp)</label><input type="text" inputmode="numeric" data-tsep="1" id="pbNominal" placeholder="0" min="0"/></div>' +
        '<div class="form-group"><label>Janji Bayar</label><input type="date" id="pbTanggal" value="' + today + '"/></div>' +
        '<div class="form-group"><label>Catatan</label><input type="text" id="pbCatatan" placeholder="Opsional..."/></div>' +
        '<div id="pbError"></div>' +
        '<button class="btn btn-primary" onclick="App.submitPembelaan()">Simpan Kesanggupan</button>' +
      '</div>' +
      '<div class="section-title mb-8">Menunggu Pembayaran <span class="badge">' + belum.length + '</span></div>' +
      listBelum +
      '<div class="section-title mb-8" style="margin-top:16px;">Sudah Lunas <span class="badge" style="background:var(--success);">' + lunas.length + '</span></div>' +
      listLunas;
  },

  submitPembelaan: function() {
    var anggotaId = (document.getElementById('pbAnggota') || {}).value || '';
    var nominal = App.num('pbNominal');
    var tanggalJanji = (document.getElementById('pbTanggal') || {}).value || '';
    var catatan = (document.getElementById('pbCatatan') || {}).value || '';
    var errEl = document.getElementById('pbError');
    if (!anggotaId) { if(errEl) errEl.innerHTML = '<div class="error-box">Pilih jamaah terlebih dahulu.</div>'; return; }
    if (nominal <= 0) { if(errEl) errEl.innerHTML = '<div class="error-box">Nominal harus lebih dari 0.</div>'; return; }
    if (errEl) errEl.innerHTML = '<div class="info-box">Menyimpan...</div>';
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Kesanggupan berhasil disimpan ✓');
          self.pagePenerobos('pembelaan');
        } else {
          if (errEl) errEl.innerHTML = '<div class="error-box">' + res.message + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        if (errEl) errEl.innerHTML = '<div class="error-box">Error: ' + err.message + '</div>';
      })
      .submitKesanggupanPembelaan({ anggotaId: anggotaId, nominal: nominal, tanggalJanji: tanggalJanji, catatan: catatan });
  },

  markLunasPembelaan: function(id) {
    var self = this;
    if (!confirm('Tandai sebagai lunas?')) return;
    App.srv()
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Ditandai lunas ✓');
          self.pagePenerobos('pembelaan');
        } else {
          self.toast('Gagal: ' + res.message);
        }
      })
      .withFailureHandler(function(err) { self.toast('Error: ' + err.message); })
      .updateStatusPembelaan(id, 'Lunas');
  },

  pagePenerobosDetail: function(idx) {
    this.history.push('penerobos');
    var pos = (this._penerobosData && this._penerobosData.summary) ? this._penerobosData.summary[idx] : null;
    if (!pos) { this.showError('Data tidak ditemukan.'); return; }
    this._penerobosDetail = pos;
    this.renderPenerobosDetail(pos, 'belum');
  },

  renderPenerobosDetail: function(pos, activeTab) {
    var belum = pos.belumBayar || [];
    var sudah = pos.sudahBayar || [];

    var listBelum = belum.length === 0
      ? '<div class="text-center text-muted" style="padding:32px;">Semua jamaah sudah infak!</div>'
      : belum.map(function(a) {
          var wa = (a.noTelp || '').replace(/[^0-9]/g, '');
          var waBtn = wa
            ? '<a href="https://wa.me/62' + wa.replace(/^0/,'') + '?text=' + encodeURIComponent('Assalamu\'alaikum ' + a.nama + ', mohon segera melunasi ' + pos.nama + '. Jazakallah khair') + '" target="_blank" style="background:#25D366;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;text-decoration:none;">WA</a>'
            : '';
          return '<div class="jamaah-card">' +
            '<div class="jamaah-avatar" style="background:linear-gradient(135deg,#EF4444,#B91C1C);">' + (a.nama||'J').charAt(0).toUpperCase() + '</div>' +
            '<div class="jamaah-info"><div class="jamaah-nama">' + App.escapeHtml(a.nama) + '</div><div class="jamaah-detail">' + App.escapeHtml(a.noTelp||'No. HP tidak ada') + '</div></div>' +
            waBtn +
          '</div>';
        }).join('');

    var listSudah = sudah.length === 0
      ? '<div class="text-center text-muted" style="padding:32px;">Belum ada yang membayar.</div>'
      : sudah.map(function(a) {
          return '<div class="jamaah-card">' +
            '<div class="jamaah-avatar" style="background:linear-gradient(135deg,var(--success),#047857);">' + (a.nama||'J').charAt(0).toUpperCase() + '</div>' +
            '<div class="jamaah-info"><div class="jamaah-nama">' + App.escapeHtml(a.nama) + '</div><div class="jamaah-detail">' + App.formatNumber(a.jumlah) + '</div></div>' +
            '<span class="status-badge lunas">✓</span>' +
          '</div>';
        }).join('');

    var pct = pos.totalAnggota > 0 ? Math.round((pos.sudah / pos.totalAnggota) * 100) : 0;
    var html = this.pageWrapper(pos.nama,
      '<div class="card" style="margin-bottom:12px;">' +
        '<div class="stat-row"><span class="stat-label">Total Jamaah</span><span class="stat-value">' + pos.totalAnggota + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Belum Infak</span><span class="stat-value text-danger">' + belum.length + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Sudah Infak</span><span class="stat-value text-success">' + sudah.length + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Progress</span><span class="stat-value">' + pct + '%</span></div>' +
      '</div>' +
      '<div class="tabs">' +
        '<button class="tab-btn' + (activeTab==='belum'?' active':'') + '" onclick="App.renderPenerobosDetail(App._penerobosDetail,\'belum\')">Belum Infak <span class="badge">' + belum.length + '</span></button>' +
        '<button class="tab-btn' + (activeTab==='sudah'?' active':'') + '" onclick="App.renderPenerobosDetail(App._penerobosDetail,\'sudah\')">Sudah Infak <span class="badge" style="background:var(--success);">' + sudah.length + '</span></button>' +
      '</div>' +
      (activeTab === 'belum' ? listBelum : listSudah)
    );
    document.getElementById('app').innerHTML = html;
  },

  markPendingFound: function(id) {
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Status diperbarui menjadi Found ✓');
          self.pageRekonsiliasi();
        } else {
          self.toast('Gagal: ' + res.message);
        }
      })
      .withFailureHandler(function(err) { self.toast('Error: ' + err.message); })
      .updatePendingStatus(id, 'Found', '');
  }
};

document.addEventListener('DOMContentLoaded', function() {
  App.init();
});
</script>
