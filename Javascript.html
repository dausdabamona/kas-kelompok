<script>
var App = {
  history: [],

  // ─────────────────────────────────────────────────
  // INIT & AUTH
  // ─────────────────────────────────────────────────
  // Cek hak akses (capability) user yang login.
  can: function(cap) {
    return !!(App.currentUser && App.currentUser.perms && App.currentUser.perms[cap]);
  },

  // Baca nilai angka dari input (buang pemisah ribuan/titik). Terima id (string) atau elemen.
  num: function(x) {
    var el = (typeof x === 'string') ? document.getElementById(x) : x;
    if (!el) return 0;
    return parseInt(String(el.value).replace(/[^0-9]/g, ''), 10) || 0;
  },

  // Format input angka dengan pemisah ribuan (id-ID), pertahankan posisi kursor.
  _formatTsep: function(el) {
    var raw = String(el.value).replace(/[^0-9]/g, '');
    var pos = el.selectionStart || 0;
    var digitsBefore = String(el.value).slice(0, pos).replace(/[^0-9]/g, '').length;
    var formatted = raw === '' ? '' : Number(raw).toLocaleString('id-ID');
    if (formatted === el.value) return;
    el.value = formatted;
    var newPos = 0, seen = 0;
    while (newPos < formatted.length && seen < digitsBefore) {
      if (/[0-9]/.test(formatted.charAt(newPos))) seen++;
      newPos++;
    }
    try { el.setSelectionRange(newPos, newPos); } catch(e) {}
  },

  init: function() {
    var self = this;
    // Pasang pemisah ribuan otomatis untuk semua input bertanda data-tsep (capture phase
    // agar memformat sebelum handler oninput lain membaca nilainya).
    if (!this._tsepBound) {
      document.addEventListener('input', function(e) {
        var t = e.target;
        if (t && t.matches && t.matches('[data-tsep]')) self._formatTsep(t);
      }, true);
      // Format nilai prefilled (form edit) begitu field difokus
      document.addEventListener('focusin', function(e) {
        var t = e.target;
        if (t && t.matches && t.matches('[data-tsep]')) self._formatTsep(t);
      }, true);
      this._tsepBound = true;
    }
    google.script.run
      .withSuccessHandler(function(user) {
        if (user) {
          self.currentUser = user;
          self.loadDashboard();
          // Tampilkan FAB jika ada antrian, coba kirim setelah 3 detik
          self.updateSyncFab();
          setTimeout(function() { self.checkAndFlushQueue(); }, 3000);
        } else {
          self.renderLogin();
        }
      })
      .withFailureHandler(function() {
        self.renderLogin();
      })
      .getCurrentUser();
  },

  renderLogin: function() {
    document.getElementById('app').innerHTML =
      '<div class="login-container">' +
        '<div class="login-logo">🕌</div>' +
        '<div class="login-title">Kas Kelompok</div>' +
        '<p class="login-subtitle">Manajemen Keuangan Jamaah</p>' +
        '<div class="login-card">' +
          '<div class="form-group">' +
            '<label>Email Anda</label>' +
            '<input type="email" id="loginEmail" placeholder="contoh@email.com" ' +
              'onkeydown="if(event.key===\'Enter\'){App.doLogin();}" autocomplete="email" />' +
          '</div>' +
          '<div id="loginError"></div>' +
          '<button id="loginBtn" class="btn btn-primary" onclick="App.doLogin()">Masuk →</button>' +
          '<p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:12px;">Proses login pertama mungkin membutuhkan<br>beberapa detik. Mohon tunggu.</p>' +
        '</div>' +
      '</div>';
    setTimeout(function() {
      var el = document.getElementById('loginEmail');
      if (el) el.focus();
    }, 100);
  },

  doLogin: function() {
    var email = (document.getElementById('loginEmail').value || '').trim();
    if (!email) {
      document.getElementById('loginError').innerHTML = '<div class="error-box">Masukkan email Anda.</div>';
      return;
    }
    var btn = document.getElementById('loginBtn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Memeriksa akun...'; }
    document.getElementById('loginError').innerHTML =
      '<div class="info-box" style="display:flex;align-items:center;gap:8px;">' +
        '<span style="display:inline-block;width:14px;height:14px;border:2px solid #BFDBFE;border-top-color:#2563EB;border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;"></span>' +
        'Memverifikasi akun, mohon tunggu...' +
      '</div>';
    var self = this;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.currentUser = res.user;
          self.loadDashboard();
        } else {
          if (btn) { btn.disabled = false; btn.textContent = 'Masuk →'; }
          document.getElementById('loginError').innerHTML = '<div class="error-box">❌ ' + res.message + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        if (btn) { btn.disabled = false; btn.textContent = 'Masuk →'; }
        document.getElementById('loginError').innerHTML = '<div class="error-box">❌ Gagal terhubung. Coba lagi.<br><small>' + err.message + '</small></div>';
      })
      .loginWithEmail(email);
  },

  doLogout: function() {
    var self = this;
    google.script.run
      .withSuccessHandler(function() {
        self.currentUser = null;
        self.history = [];
        self.renderLogin();
      })
      .withFailureHandler(function() {
        self.renderLogin();
      })
      .logoutUser();
  },

  // ─────────────────────────────────────────────────
  // DASHBOARD
  // ─────────────────────────────────────────────────
  loadDashboard: function() {
    this.history = [];
    this.showLoading('Memuat dashboard...');
    var self = this;
    var done = false;

    // Timeout 35 detik — tampilkan tombol retry jika server tidak respons
    var timeout = setTimeout(function() {
      if (!done) {
        document.getElementById('app').innerHTML =
          '<div style="padding:32px;text-align:center;">' +
            '<div style="font-size:40px;margin-bottom:12px;">⏱️</div>' +
            '<p style="font-weight:700;font-size:16px;margin-bottom:8px;">Server Lambat Merespons</p>' +
            '<p style="color:var(--text-muted);font-size:14px;margin-bottom:20px;">Google Apps Script sedang memuat data.<br>Ini normal pada akses pertama (cold start).</p>' +
            '<button class="btn btn-primary" onclick="App.loadDashboard()" style="max-width:240px;margin:0 auto;">🔄 Coba Lagi</button>' +
          '</div>';
      }
    }, 35000);

    google.script.run
      .withSuccessHandler(function(res) {
        done = true;
        clearTimeout(timeout);
        try {
          if (res && res.success) {
            self.renderDashboard(res);
          } else {
            self.showError((res && res.message) || 'Gagal memuat data. Pastikan spreadsheet sudah dikonfigurasi.');
          }
        } catch(err) {
          // Tampilkan error JS yang sebenarnya — membantu debugging
          document.getElementById('app').innerHTML =
            '<div style="padding:20px;">' +
              '<div class="error-box"><strong>Error Render:</strong> ' + err.message + '</div>' +
              '<button class="btn btn-outline mt-16" onclick="App.loadDashboard()">🔄 Coba Lagi</button>' +
            '</div>';
        }
      })
      .withFailureHandler(function(err) {
        done = true;
        clearTimeout(timeout);
        document.getElementById('app').innerHTML =
          '<div style="padding:20px;">' +
            '<div class="error-box"><strong>Error Server:</strong> ' + (err ? err.message : 'Tidak diketahui') + '</div>' +
            '<p style="font-size:13px;color:var(--text-muted);margin-top:8px;">Pastikan email Anda ada di sheet <strong>Master User</strong> dan sheet <strong>Master Period</strong> sudah dibuat.</p>' +
            '<button class="btn btn-outline mt-16" onclick="App.loadDashboard()">🔄 Coba Lagi</button>' +
            '<button class="btn btn-danger mt-8" onclick="App.doLogout()" style="max-width:100%;">Logout</button>' +
          '</div>';
      })
      .getDashboardData();
  },

  renderDashboard: function(data) {
    var u = data.user || {};
    var inisial = (u.nama || 'U').charAt(0).toUpperCase();
    var periode = data.periode;

    var html = '<div class="page-content" style="padding-top:20px;">' +
      '<div class="user-info">' +
        '<div class="avatar">' + inisial + '</div>' +
        '<div>' +
          '<div class="user-name">' + (u.nama || '-') + '</div>' +
          '<div class="user-role">' + (u.role || '') + ' · ' + (data.namaKelompok || 'Kas Kelompok') + '</div>' +
          (periode ? '<div class="text-small text-muted mt-8">Periode: ' + periode.nama + '</div>' : '<div class="text-small text-danger mt-8">⚠ Tidak ada periode aktif</div>') +
        '</div>' +
        '<button class="btn btn-sm" style="background:#FEF2F2;color:#DC2626;border:none;cursor:pointer;" onclick="App.doLogout()">Keluar</button>' +
      '</div>' +

      '<div class="total-card">' +
        '<div class="total-label">💰 Total Kas</div>' +
        '<div class="total-amount">' + this.formatNumber(data.totalKas || 0) + '</div>' +
      '</div>' +

      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">' +
        '<div class="kas-card tunai">' +
          '<div class="kas-label">🪙 Kas Tunai</div>' +
          '<div class="kas-amount">' + this.formatNumber(data.kasTunai || 0) + '</div>' +
        '</div>' +
        '<div class="kas-card bank">' +
          '<div class="kas-label">🏦 Kas Bank</div>' +
          '<div class="kas-amount">' + this.formatNumber(data.kasBank || 0) + '</div>' +
        '</div>' +
      '</div>' +

      '<button class="btn btn-success mb-16" onclick="App.pageTransaksi()">+ Input Transaksi</button>' +

      '<div class="section-title mb-8">Menu</div>' +
      '<div class="menu-grid">' +
        (App.can('view.penerobosanInfak') ? '<div class="menu-item" style="border:2px solid var(--primary);background:#EFF6FF;" onclick="App.pagePenerobos()"><span class="icon">📋</span><span>Penerobosan Infak</span></div>' : '') +
        (App.can('view.bukuIR') ? '<div class="menu-item' + (data.belumDirincikanCount > 0 ? ' menu-item-alert' : '') + '" onclick="App.pageBukuIR()">' +
              '<span class="icon">📖</span><span>Buku IR' + (data.belumDirincikanCount > 0 ? ' <span class="menu-badge">' + data.belumDirincikanCount + '</span>' : '') + '</span>' +
            '</div>' : '') +
        (App.can('view.kelolaBuku') ? '<div class="menu-item" onclick="App.pageKelolaBuku()"><span class="icon">📊</span><span>Kelola Buku</span></div>' : '') +
        (App.can('view.setoranDesa') ? '<div class="menu-item" onclick="App.pageSetoranDesa()"><span class="icon">🏘️</span><span>Setoran Desa</span></div>' : '') +
        (App.can('view.jamaah') ? '<div class="menu-item" onclick="App.pageJamaah()"><span class="icon">👥</span><span>Jamaah</span></div>' : '') +
        (App.can('view.laporanSetoran') ? '<div class="menu-item" onclick="App.pageLaporanSetoran()"><span class="icon">📈</span><span>Laporan Setoran</span></div>' : '') +
        (App.can('view.pemeriksaanSaldo') ? '<div class="menu-item" onclick="App.pagePemeriksaanSaldo()"><span class="icon">🧮</span><span>Pemeriksaan Saldo</span></div>' : '') +
        (App.can('view.laporanPDF') ? '<div class="menu-item" onclick="App.pageLaporanPDF()"><span class="icon">📄</span><span>Laporan PDF</span></div>' : '') +
        (App.can('view.terobosan') ? '<div class="menu-item" onclick="App.pagePatungan()"><span class="icon">🤝</span><span>Terobosan Kelompok</span></div>' : '') +
        (App.can('view.setting') ? '<div class="menu-item" onclick="App.pageSetting()"><span class="icon">⚙️</span><span>Setting</span></div>' : '') +
        '<div class="menu-item" onclick="App.loadDashboard()"><span class="icon">🔄</span><span>Refresh</span></div>' +
      '</div>' +

      '<div class="app-footer">' + (data.namaKelompok || 'Kas Kelompok') + '</div>' +
    '</div>';

    document.getElementById('app').innerHTML = html;
  },

  // ─────────────────────────────────────────────────
  // TRANSAKSI
  // ─────────────────────────────────────────────────
  pageTransaksi: function() {
    this.history.push('dashboard');
    this.showLoading('Memuat data transaksi...');
    var self = this;
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.success) {
          self.renderTransaksiForm('masuk', r.pemasukan || [], r.pengeluaran || [], r.anggota || []);
        } else {
          self.showError((r && r.message) || 'Gagal memuat data');
        }
      })
      .withFailureHandler(function(err) {
        // Fallback: render form kosong agar tetap bisa dipakai
        self.renderTransaksiForm('masuk', [], [], []);
      })
      .getTransaksiMasterData();
    this._masterP = null; this._masterPK = null; this._anggota = null;
  },

  renderTransaksiForm: function(tipe, masterP, masterPK, anggota) {
    this._masterP = masterP;
    this._masterPK = masterPK;
    this._anggota = anggota;
    this._tipeTransaksi = tipe;

    var formHtml = '';
    var today = new Date().toISOString().split('T')[0];

    if (tipe === 'masuk') {
      // Filter lenient: tampilkan semua kecuali yang statusnya eksplisit 'Nonaktif'
      var filteredP = (masterP || []).filter(function(p) {
        var s = (p.status || '').toString().trim().toLowerCase();
        return s !== 'nonaktif';
      });
      var opts = filteredP.map(function(p) {
        return '<option value="' + p.id + '" data-kategori="' + (p.kategori || '') + '">' + p.nama + '</option>';
      }).join('');
      if (!opts) opts = '<option value="">-- Belum ada data. Tambah di Setting > Pos Pemasukan --</option>';
      var angOpts = '<option value="">-- Pilih Jamaah --</option>' + (anggota || []).map(function(a) {
        return '<option value="' + a.id + '">' + a.nama + '</option>';
      }).join('');
      formHtml =
        '<div class="form-group"><label>Jenis Pemasukan</label>' +
        '<select id="trxJenis" onchange="App.onJenisMasukChange()">' + opts + '</select></div>' +
        '<div id="jamaahGroup" style="display:none;" class="form-group"><label id="jamaahLabel">Jamaah</label>' +
        '<select id="trxAnggota">' + angOpts + '</select></div>' +
        '<div class="form-group"><label>Nominal (Rp)</label>' +
        '<input type="text" inputmode="numeric" data-tsep="1" id="trxNominal" placeholder="0" oninput="App.onNominalInput()" min="0"/>' +
        '<div id="previewNominal"></div></div>' +
        '<div class="form-group"><label>Sumber Kas</label>' +
        '<select id="trxSumber"><option value="Tunai">Tunai</option><option value="Bank">Bank</option></select></div>' +
        '<div class="form-group"><label>Tanggal</label><input type="date" id="trxTanggal" value="' + today + '"/></div>' +
        '<div class="form-group"><label>Catatan</label><textarea id="trxCatatan" placeholder="Opsional..."></textarea></div>';
      setTimeout(function() { App.onJenisMasukChange(); }, 100);
    } else if (tipe === 'keluar') {
      var filteredPK = (masterPK || []).filter(function(p) {
        var s = (p.status || '').toString().trim().toLowerCase();
        return s !== 'nonaktif';
      });
      var opts = filteredPK.map(function(p) {
        return '<option value="' + p.id + '">' + p.nama + '</option>';
      }).join('');
      if (!opts) opts = '<option value="">-- Belum ada data. Tambah di Setting > Pos Pengeluaran --</option>';
      formHtml =
        '<div class="form-group"><label>Jenis Pengeluaran</label><select id="trxJenis">' + opts + '</select></div>' +
        '<div class="form-group"><label>Nominal (Rp)</label>' +
        '<input type="text" inputmode="numeric" data-tsep="1" id="trxNominal" placeholder="0" oninput="App.onNominalInput()" min="0"/>' +
        '<div id="previewNominal"></div></div>' +
        '<div class="form-group"><label>Sumber Kas</label>' +
        '<select id="trxSumber"><option value="Tunai">Tunai</option><option value="Bank">Bank</option></select></div>' +
        '<div class="form-group"><label>Tanggal</label><input type="date" id="trxTanggal" value="' + today + '"/></div>' +
        '<div class="form-group"><label>Catatan</label><textarea id="trxCatatan" placeholder="Opsional..."></textarea></div>';
    } else {
      formHtml =
        '<div class="form-group"><label>Arah Mutasi</label>' +
        '<select id="trxArah"><option value="setor">Setor (Tunai → Bank)</option><option value="tarik">Tarik (Bank → Tunai)</option></select></div>' +
        '<div class="form-group"><label>Nominal (Rp)</label>' +
        '<input type="text" inputmode="numeric" data-tsep="1" id="trxNominal" placeholder="0" oninput="App.onNominalInput()" min="0"/>' +
        '<div id="previewNominal"></div></div>' +
        '<div class="form-group"><label>Tanggal</label><input type="date" id="trxTanggal" value="' + today + '"/></div>';
    }

    var html = this.pageWrapper('Input Transaksi',
      '<div class="tabs">' +
        '<button class="tab-btn' + (tipe === 'masuk' ? ' active' : '') + '" onclick="App.renderTransaksiForm(\'masuk\', App._masterP, App._masterPK, App._anggota)">💚 Masuk</button>' +
        '<button class="tab-btn' + (tipe === 'keluar' ? ' active' : '') + '" onclick="App.renderTransaksiForm(\'keluar\', App._masterP, App._masterPK, App._anggota)">❤️ Keluar</button>' +
        '<button class="tab-btn' + (tipe === 'mutasi' ? ' active' : '') + '" onclick="App.renderTransaksiForm(\'mutasi\', App._masterP, App._masterPK, App._anggota)">🔄 Mutasi</button>' +
      '</div>' +
      formHtml +
      '<div id="trxError"></div>' +
      '<button class="btn btn-primary" onclick="App.submitTransaksi()">Simpan Transaksi</button>'
    );
    document.getElementById('app').innerHTML = html;
  },

  onJenisMasukChange: function() {
    var sel = document.getElementById('trxJenis');
    if (!sel) return;
    var opt = sel.options[sel.selectedIndex];
    // Cek dari nama option ATAU kategori — lebih toleran
    var optText = opt ? (opt.textContent || opt.text || '').toLowerCase() : '';
    var kategori = opt ? (opt.getAttribute('data-kategori') || '').toLowerCase() : '';
    var isBukuIR = optText.indexOf('buku ir') !== -1 || kategori.indexOf('buku ir') !== -1;
    var grp = document.getElementById('jamaahGroup');
    var lbl = document.getElementById('jamaahLabel');
    if (grp) {
      grp.style.display = isBukuIR ? 'block' : 'none';
      // Reset value saat field disembunyikan
      if (!isBukuIR) {
        var sel2 = document.getElementById('trxAnggota');
        if (sel2) sel2.value = '';
      }
    }
    if (lbl) {
      lbl.innerHTML = isBukuIR
        ? 'Jamaah <span style="color:var(--danger);font-weight:700;">* WAJIB</span>'
        : 'Jamaah';
    }
  },

  onNominalInput: function() {
    var val = App.num('trxNominal');
    var el = document.getElementById('previewNominal');
    if (el && val > 0) {
      el.innerHTML = '<div class="preview-box"><span class="preview-amount">' + this.formatNumber(val) + '</span></div>';
    } else if (el) {
      el.innerHTML = '';
    }
  },

  submitTransaksi: function() {
    var tipe = this._tipeTransaksi;
    var nominal = App.num('trxNominal');
    var tanggal = document.getElementById('trxTanggal').value;
    if (nominal <= 0) {
      document.getElementById('trxError').innerHTML = '<div class="error-box">Nominal harus lebih dari 0.</div>';
      return;
    }
    var data = { tipe: tipe, nominal: nominal, tanggal: tanggal };
    if (tipe === 'masuk') {
      data.jenisId = document.getElementById('trxJenis').value;
      data.sumberKas = document.getElementById('trxSumber').value;
      data.anggotaId = (document.getElementById('trxAnggota') || {}).value || '';
      data.catatan = document.getElementById('trxCatatan').value;
      // Validasi: Buku IR wajib pilih jamaah
      var jenisOpt = document.getElementById('trxJenis');
      var opt2 = jenisOpt ? jenisOpt.options[jenisOpt.selectedIndex] : null;
      var optText2 = opt2 ? (opt2.textContent || opt2.text || '').toLowerCase() : '';
      var kat2 = opt2 ? (opt2.getAttribute('data-kategori') || '').toLowerCase() : '';
      var isBukuIRValidasi = optText2.indexOf('buku ir') !== -1 || kat2.indexOf('buku ir') !== -1;
      if (isBukuIRValidasi && !data.anggotaId) {
        document.getElementById('trxError').innerHTML = '<div class="error-box">⚠️ Pilih Jamaah terlebih dahulu untuk jenis Buku IR.</div>';
        document.getElementById('jamaahGroup').scrollIntoView({ behavior: 'smooth' });
        return;
      }
    } else if (tipe === 'keluar') {
      data.jenisId = document.getElementById('trxJenis').value;
      data.sumberKas = document.getElementById('trxSumber').value;
      data.catatan = document.getElementById('trxCatatan').value;
    } else {
      data.arah = document.getElementById('trxArah').value;
    }
    document.getElementById('trxError').innerHTML = '<div class="info-box">Menyimpan...</div>';
    var self = this;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Transaksi berhasil disimpan ✓');
          self.loadDashboard();
        } else {
          document.getElementById('trxError').innerHTML = '<div class="error-box">' + res.message + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        document.getElementById('trxError').innerHTML = '<div class="error-box">Error: ' + err.message + '</div>';
      })
      .submitTransaksi(data);
  },

  // ─────────────────────────────────────────────────
  // BUKU IR
  // ─────────────────────────────────────────────────
  pageBukuIR: function() {
    this.history.push('dashboard');
    // Auto-flush antrian offline jika ada
    var qLen = this.getQueue().length;
    if (qLen > 0) {
      this.checkAndFlushQueue();
    }
    this.showLoading('Memuat Buku IR...');
    var self = this;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) self.renderBukuIR(res.data, 'belum');
        else self.showError(res.message);
      })
      .withFailureHandler(function(err) { self.showError(err.message); })
      .getBukuIRData();
  },

  renderBukuIR: function(data, activeTab) {
    this._bukuIRData = data;
    var belum = data.belumDirincikan || [];
    var sudah = data.sudahDirincikan || [];

    // Simpan map id→item agar onclick tidak passing JSON ke HTML
    this._bukuIRMap = {};
    belum.concat(sudah).forEach(function(it) { App._bukuIRMap[it.id] = it; });

    var qLen = this.getQueue().length;
    var queueBanner = qLen > 0
      ? '<div style="background:#FEF3C7;border:1px solid #F59E0B;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;">' +
          '<span style="font-size:13px;color:#92400E;">📤 <strong>' + qLen + ' rincian</strong> belum terkirim (offline)</span>' +
          '<button class="action-btn-sm edit" onclick="App.checkAndFlushQueue();App.pageBukuIR();" style="font-size:11px;">Kirim Sekarang</button>' +
        '</div>'
      : '';

    var listBelum = belum.length === 0
      ? '<div class="text-center text-muted" style="padding:32px;">Semua sudah dirincikan 👍</div>'
      : belum.map(function(item) {

      '<div class="form-group"><label>Infak Daerah (Rp)</label><input type="text" inputmode="numeric" data-tsep="1" id="rInfakDaerah" value="' + vInfak + '" oninput="App.cekTotalRincian()"/></div>' +
      '<div class="form-group"><label>Index (Rp)</label><input type="text" inputmode="numeric" data-tsep="1" id="rIndex" value="' + vIndex + '" oninput="App.cekTotalRincian()"/></div>' +

  cekTotalRincian: function() {
    var ir = App.num('rIR');
    var ir10 = App.num('rIR10');
    var cicilan = App.num('rCicilan');
    var infak = App.num('rInfakDaerah');
    var index = App.num('rIndex');
    var totalRincian = ir + ir10 + cicilan + infak + index;
    var totalTrx = this._rincianItem ? this._rincianItem.nominal : 0;
    var el = document.getElementById('validasiRincian');
    if (totalRincian === totalTrx) {
      el.innerHTML = '<div class="valid-indicator ok">✓ Total sesuai: ' + this.formatNumber(totalRincian) + '</div>';
    } else {
      el.innerHTML = '<div class="valid-indicator error">✗ Total rincian: ' + this.formatNumber(totalRincian) + ' (selisih: ' + this.formatNumber(totalTrx - totalRincian) + ')</div>';
    }
    return totalRincian === totalTrx;
  },

  submitRincianIR: function() {
    if (!this.cekTotalRincian()) {
      document.getElementById('rincianError').innerHTML = '<div class="error-box">Total rincian harus sama dengan total transaksi.</div>';
      return;
    }
    var item = this._rincianItem;
    var data = {
      transaksiId: item.id, periodeId: item.periodeId, anggotaId: item.anggotaId,
      tanggal: item.tanggal,
      ir: App.num('rIR'),
      ir10: App.num('rIR10'),
      cicilan: App.num('rCicilan'),
      infakDaerah: App.num('rInfakDaerah'),
      index: App.num('rIndex'),
      total: item.nominal,
      anggotaNama: item.anggota ? item.anggota.nama : ''
    };

    // Simpan ke antrian lokal dulu (offline-first)
    App.queueRincian(data);
    App.updateSyncFab();
    document.getElementById('rincianError').innerHTML = '<div class="valid-indicator ok">✓ Tersimpan lokal. Mengirim ke server...</div>';
    var self = this;

    // Coba kirim langsung; jika gagal tetap ada di antrian
    App.flushRincianQueue(function(berhasil) {
      if (berhasil) {
        self.toast('Rincian berhasil disimpan ✓');
        self.pageBukuIR();
      } else {
        self.toast('Tersimpan lokal. Akan dikirim saat ada jaringan. 📲', 4000);
        self.pageBukuIR();
      }
    });
  },

  // ─────────────────────────────────────────────────
  // OFFLINE QUEUE — Buku IR
  // ─────────────────────────────────────────────────
  _QUEUE_KEY: 'kas_rincian_queue',

  queueRincian: function(data) {
    var q = this.getQueue();
    data._queuedAt = new Date().toISOString();
    q.push(data);
    try { localStorage.setItem(this._QUEUE_KEY, JSON.stringify(q)); } catch(e) {}
  },

  getQueue: function() {
    try {
      var raw = localStorage.getItem(this._QUEUE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  },

  saveQueue: function(q) {
    try { localStorage.setItem(this._QUEUE_KEY, JSON.stringify(q)); } catch(e) {}
  },

  flushRincianQueue: function(callback) {
    var q = this.getQueue();
    if (q.length === 0) { if (callback) callback(true); return; }
    var self = this;
    var item = q[0];

    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          q.shift();
          self.saveQueue(q);
          if (q.length > 0) {
            self.flushRincianQueue(callback);
          } else {
            if (callback) callback(true);
          }
        } else {
          if (callback) callback(false);
        }
      })
      .withFailureHandler(function() {
        if (callback) callback(false);
      })
      .submitRincianIR(item);
  },

  checkAndFlushQueue: function() {
    var q = this.getQueue();
    if (q.length === 0) { this.updateSyncFab(); return; }
    var total = q.length;
    var self = this;
    this.updateSyncFab('sending');
    this.flushRincianQueue(function(ok) {
      var remaining = self.getQueue().length;
      if (ok && remaining === 0) {
        self.toast('✅ ' + total + ' rincian berhasil dikirim ke server');
      } else if (remaining > 0) {
        self.toast('⏳ ' + remaining + ' rincian masih dalam antrian (offline)', 3000);
      }
      self.updateSyncFab();
    });
  },

  // Floating Action Button untuk sync antrian
  updateSyncFab: function(state) {
    var fab = document.getElementById('sync-fab');
    var q = this.getQueue();
    var count = q.length;

    if (count === 0 && state !== 'sending') {
      if (fab) fab.style.display = 'none';
      return;
    }

    if (!fab) {
      fab = document.createElement('div');
      fab.id = 'sync-fab';
      fab.onclick = function() { App.checkAndFlushQueue(); };
      document.body.appendChild(fab);
    }

    fab.style.display = 'flex';
    if (state === 'sending') {
      fab.innerHTML = '<span style="font-size:18px;animation:spin 1s linear infinite;display:inline-block;">↻</span><span style="font-size:12px;margin-left:4px;">Mengirim...</span>';
      fab.style.background = '#F59E0B';
    } else {
      fab.innerHTML = '<span style="font-size:16px;">📤</span><span style="font-size:12px;margin-left:4px;">' + count + ' belum terkirim</span>';
      fab.style.background = '#EF4444';
    }
  },

  renderPemeriksaanSaldo: function(res) {
    var self = this;
    self._pemeriksaanData = res;
    var sis = res.saldoSistem || { tunai: 0, bank: 0, total: 0 };

      ? '<div class="info-box" style="margin-bottom:12px;">Pemeriksaan terakhir (' + App.formatDate(t.tanggal) + '): Tunai ' + App.formatNumber(t.saldoTunaiAktual) + ', Bank ' + App.formatNumber(t.saldoBankAktual) + (t.status === 'Tutup' ? ' — <b>SUDAH TUTUP BUKU</b>' : '') + '</div>'

        '<div class="form-group"><label>🏦 Kas Bank Aktual (Rp)</label>' +
          '<input type="text" inputmode="numeric" data-tsep="1" id="psBank" value="' + defBank + '" oninput="App.cekSelisihSaldo()"/></div>' +
        '<div id="selisihBox" class="mb-16"></div>' +
        '<div class="form-group"><label>Catatan</label><textarea id="psCatatan" placeholder="Opsional — alasan selisih, dll"></textarea></div>' +

      '</div>';

  cekSelisihSaldo: function() {
    var res = this._pemeriksaanData;
    if (!res) return;
    var sis = res.saldoSistem || { tunai: 0, bank: 0 };
    var aktTunai = App.num('psTunai');
    var aktBank = App.num('psBank');
    var selTunai = aktTunai - sis.tunai;
    var selBank = aktBank - sis.bank;
    var selTotal = selTunai + selBank;

    function baris(label, sel) {
      var warna = sel === 0 ? 'var(--success)' : 'var(--danger)';
      var tanda = sel > 0 ? '+' : '';
      var ket = sel === 0 ? '✓ cocok' : (sel > 0 ? 'lebih' : 'kurang');
      return '<div class="stat-row"><span class="stat-label">' + label + '</span>' +
        '<span class="stat-value" style="color:' + warna + ';">' + tanda + App.formatNumber(sel) + ' <span style="font-size:10px;">(' + ket + ')</span></span></div>';
    }

    var el = document.getElementById('selisihBox');
    var allOk = (selTunai === 0 && selBank === 0);
    el.innerHTML =
      '<div class="card" style="margin:0;background:' + (allOk ? '#F0FDF4' : '#FEF2F2') + ';border:1px solid ' + (allOk ? '#86EFAC' : '#FECACA') + ';">' +
        '<div class="section-title mb-8">Selisih (Aktual − Sistem)</div>' +
        baris('Selisih Tunai', selTunai) +
        baris('Selisih Bank', selBank) +
        baris('Selisih Total', selTotal) +
      '</div>';
  },

  submitPemeriksaanSaldo: function(tutup) {
    var data = {
      saldoTunaiAktual: App.num('psTunai'),
      saldoBankAktual: App.num('psBank'),
      catatan: document.getElementById('psCatatan').value,

  buatLaporanPDF: function() {
    var btn = document.getElementById('btnLaporanPDF');
    var errEl = document.getElementById('laporanPDFError');
    var resEl = document.getElementById('laporanPDFResult');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Membuat laporan...'; }
    errEl.innerHTML = '';
    resEl.style.display = 'none';
    // Buka tab baru dulu (sebelum async call) agar tidak diblokir popup blocker
    var win = window.open('', '_blank');
    if (win) win.document.write('<html><body style="font-family:Arial;padding:24px;color:#555;">⏳ Menyiapkan laporan...</body></html>');
    google.script.run
      .withSuccessHandler(function(res) {
        if (btn) { btn.disabled = false; btn.textContent = '📄 Buat & Unduh Laporan'; }
        if (!res.success) {
          if (win) win.close();
          errEl.innerHTML = '<div class="error-box">' + (res.message || 'Gagal membuat laporan') + '</div>';
          return;
        }
        // Tulis HTML langsung ke tab yang sudah dibuka — render di browser
        if (win) {
          win.document.open();
          win.document.write(res.html);
          win.document.close();
        } else {
          // Fallback: popup diblokir, tampilkan link manual
          resEl.style.display = 'block';
          resEl.innerHTML = '⚠️ Popup diblokir. <a href="#" onclick="App._openLaporanManual();return false;">Klik di sini untuk buka laporan</a>';
          App._laporanHtml = res.html;
        }
      })
      .withFailureHandler(function(err) {
        if (btn) { btn.disabled = false; btn.textContent = '📄 Buat & Unduh Laporan'; }
        if (win) win.close();
        errEl.innerHTML = '<div class="error-box">' + err.message + '</div>';
      })
      .generatePDF();
  },

  _openLaporanManual: function() {
    if (!this._laporanHtml) return;
    var win = window.open('', '_blank');
    if (win) { win.document.open(); win.document.write(this._laporanHtml); win.document.close(); }
  },

        '<div class="form-group"><label>Target Total (Rp)</label><input type="text" inputmode="numeric" data-tsep="1" id="patTarget" placeholder="mis. 11000000" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;text-align:right;"/></div>' +
        bobotRows +

  _bagiTargetPatungan: function() {
    var counts = this._patunganGradeCounts || {};
    var keys = Object.keys(counts);
    var target = App.num('patTarget');
    if (target <= 0) {
      document.getElementById('patError').innerHTML = '<div class="error-box">Isi Target Total dulu (mis. 11000000)</div>';
      return;
    }
    // Hitung total unit bobot = Σ (bobot_g × jumlah_jamaah_g)
    var totalUnit = 0;
    var bobot = {};
    keys.forEach(function(g) {
      var w = parseFloat((document.getElementById('bobot_' + g) || {}).value);
      if (isNaN(w) || w < 0) w = 1; // default bobot 1 jika kosong
      bobot[g] = w;
      totalUnit += w * counts[g];
    });
    if (totalUnit <= 0) {
      document.getElementById('patError').innerHTML = '<div class="error-box">Total bobot × jamaah harus > 0</div>';
      return;
    }
    var perUnit = target / totalUnit;
    // Nominal per orang grade g = perUnit × bobot_g, dibulatkan ke 10.000 terdekat
    keys.forEach(function(g) {
      var nominal = Math.round((perUnit * bobot[g]) / 10000) * 10000;
      var el = document.getElementById('grade_' + g);
      if (el) { el.value = nominal; App._formatTsep(el); }
    });
    document.getElementById('patError').innerHTML = '';
    this._hitungTotalPatungan();
  },

  _hitungTotalPatungan: function() {
    var counts = this._patunganGradeCounts || {};
    var total = 0;
    Object.keys(counts).forEach(function(g) {
      var el = document.getElementById('grade_' + g);
      if (el) total += (App.num(el)) * counts[g];
    });
    var el = document.getElementById('patTotal');
    if (el) {
      var txt = 'Rp ' + total.toLocaleString('id-ID');
      var tgtEl = document.getElementById('patTarget');
      var target = tgtEl ? (App.num(tgtEl)) : 0;
      if (target > 0) {
        var selisih = total - target;
        if (selisih === 0) txt += ' ✅ (pas target)';
        else txt += (selisih > 0 ? ' (+' : ' (−') + Math.abs(selisih).toLocaleString('id-ID') + ' dari target)';
      }
      el.textContent = txt;
    }
  },

  submitPatungan: function() {
    var self = this;
    var nama = (document.getElementById('patNama') || {}).value || '';
    if (!nama.trim()) {
      document.getElementById('patError').innerHTML = '<div class="error-box">Nama musyawarah wajib diisi</div>';
      return;
    }
    var counts = this._patunganGradeCounts || {};
    var gradeConfig = {};
    var hasGrade = false;
    Object.keys(counts).forEach(function(g) {
      var el = document.getElementById('grade_' + g);
      var val = App.num(el);
      if (val > 0) { gradeConfig[g] = val; hasGrade = true; }
    });
    if (!hasGrade) {
      document.getElementById('patError').innerHTML = '<div class="error-box">Isi minimal satu grade dengan nominal > 0</div>';
      return;
    }
    var data = {
      nama: nama.trim(),
      tanggal: (document.getElementById('patTgl') || {}).value || '',
      catatan: (document.getElementById('patCatatan') || {}).value || '',
      gradeConfig: gradeConfig
    };
    document.getElementById('patError').innerHTML = '<div class="info-box">⏳ Membuat penerobosan...</div>';
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.success) {
          document.getElementById('patError').innerHTML = '<div class="error-box">' + res.message + '</div>';
          return;
        }
        self.toast('Terobosan Kelompok dibuat! ' + (res.tagihanCount || 0) + ' penerobosan, total Rp ' + (res.total || 0).toLocaleString('id-ID'));
        self.pagePatungan();
      })
      .withFailureHandler(function(err) {
        document.getElementById('patError').innerHTML = '<div class="error-box">' + err.message + '</div>';
      })
      .addPatungan(data);
  },

  renderTagihanPatungan: function(res) {
    var self = this;
    var p = res.patungan || {};
    var tagihan = res.tagihan || [];
    var u = App.currentUser || {};
    var canBayar = App.can('terobosan.bayar');
    var canBatal = App.can('terobosan.batal');

    var summaryCards =
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;">' +
        '<div class="card" style="margin:0;text-align:center;">' +
          '<div style="font-size:11px;color:#888;">Target</div>' +
          '<div style="font-weight:bold;color:var(--primary);font-size:14px;">' + App.formatNumber(res.totalTarget) + '</div>' +
        '</div>' +
        '<div class="card" style="margin:0;text-align:center;">' +
          '<div style="font-size:11px;color:#888;">Sudah Bayar</div>' +
          '<div style="font-weight:bold;color:var(--success);font-size:14px;">' + App.formatNumber(res.totalLunas) + '</div>' +
        '</div>' +
        '<div class="card" style="margin:0;text-align:center;">' +
          '<div style="font-size:11px;color:#888;">Belum Bayar</div>' +
          '<div style="font-weight:bold;color:var(--danger);font-size:14px;">' + App.formatNumber(res.totalBelum) + '</div>' +
        '</div>' +
      '</div>';

    // Group by grade
    var byGrade = {};
    tagihan.forEach(function(t) {
      var g = t.grade || '-';
      if (!byGrade[g]) byGrade[g] = [];
      byGrade[g].push(t);
    });

    var rows = Object.keys(byGrade).sort().map(function(g) {
      var list = byGrade[g];
      var header = '<div style="font-weight:bold;background:#f3f4f6;padding:6px 10px;border-radius:6px;margin:10px 0 6px;font-size:12px;">Grade ' + g +
        ' — Rp ' + App.formatNumber(list[0].nominal) + '/orang</div>';
      var items = list.map(function(t) {
        var sudah = t.statusBayar === 'Lunas';
        return '<div class="stat-row" style="padding:6px 4px;border-bottom:1px solid #f3f4f6;">' +
          '<div>' +
            '<div style="font-size:13px;">' + t.anggotaNama + '</div>' +

  renderHakAkses: function(res) {
    var caps = res.capabilities || [];
    var roles = res.roles || [];
    var matrix = res.matrix || {};
    this._hakAksesRoles = roles;
    this._hakAksesCaps = caps.map(function(c){ return c.code; });

    function th(t){ return '<th style="padding:6px 8px;border:1px solid #d1d5db;background:#f3f4f6;font-size:11px;text-align:center;">' + t + '</th>'; }

    var head = '<th style="padding:6px 8px;border:1px solid #d1d5db;background:#f3f4f6;font-size:11px;text-align:left;">Hak Akses</th>' +
      roles.map(function(r){ return th(r.replace('BENDAHARA_','B')); }).join('');

    var lastGrup = '';
    var body = caps.map(function(c) {
      var grupRow = '';
      if (c.grup !== lastGrup) {
        lastGrup = c.grup;
        grupRow = '<tr><td colspan="' + (roles.length+1) + '" style="padding:5px 8px;background:#e5e7eb;font-weight:bold;font-size:11px;">' +
          (c.grup === 'lihat' ? '👁️ LIHAT (Menu)' : '✏️ EDIT / AKSI') + '</td></tr>';
      }
      var cells = roles.map(function(r) {
        var checked = !!(matrix[r] && matrix[r][c.code]);
        var isAdmin = (r === 'ADMIN');
        return '<td style="padding:4px;border:1px solid #d1d5db;text-align:center;">' +
          '<input type="checkbox" data-cap="' + c.code + '" data-role="' + r + '"' +
          (checked ? ' checked' : '') + (isAdmin ? ' disabled title="ADMIN selalu penuh"' : '') + '/></td>';
      }).join('');
      return grupRow + '<tr><td style="padding:4px 8px;border:1px solid #d1d5db;font-size:11px;">' + c.label + '</td>' + cells + '</tr>';
    }).join('');

    var html = this.pageWrapper('Kelola Hak Akses',
      '<div class="info-box mb-12">Centang = role boleh. Kolom ADMIN terkunci (selalu penuh). Perubahan berlaku setelah user login ulang / refresh.</div>' +
      '<div id="hakAksesError"></div>' +
      '<div style="overflow-x:auto;"><table style="border-collapse:collapse;width:100%;"><tr>' + head + '</tr>' + body + '</table></div>' +
      '<button class="btn btn-primary" style="margin-top:14px;" onclick="App.saveHakAkses()">💾 Simpan Hak Akses</button>'
    );
    document.getElementById('app').innerHTML = html;
  },

  saveHakAkses: function() {
    var self = this;
    var roles = this._hakAksesRoles || [];
    var matrix = {};
    roles.forEach(function(r){ matrix[r] = {}; });
    var boxes = document.querySelectorAll('input[type="checkbox"][data-cap]');
    for (var i = 0; i < boxes.length; i++) {
      var b = boxes[i];
      var r = b.getAttribute('data-role');
      var cap = b.getAttribute('data-cap');
      if (!matrix[r]) matrix[r] = {};
      matrix[r][cap] = (r === 'ADMIN') ? true : b.checked;
    }
    document.getElementById('hakAksesError').innerHTML = '<div class="info-box">⏳ Menyimpan...</div>';
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.success) { document.getElementById('hakAksesError').innerHTML = '<div class="error-box">' + res.message + '</div>'; return; }
        self.toast('Hak akses tersimpan ✓');
        self.pageSetting();
      })
      .withFailureHandler(function(err) {
        document.getElementById('hakAksesError').innerHTML = '<div class="error-box">' + err.message + '</div>';
      })
      .savePermMatrix(matrix);
  },

  showSettingForm: function(item) {
    this._editSettingItem = item;
    var mode = this._settingMode;
    var isEdit = !!item;
    var v = item || {};
    var fields = '';
    if (mode === 'pemasukan' || mode === 'pengeluaran') {
      fields = '<div class="form-group"><label>Nama *</label><input type="text" id="sNama" value="' + (v.nama || '') + '"/></div>' +
        '<div class="form-group"><label>Kategori</label><input type="text" id="sKategori" value="' + (v.kategori || '') + '" placeholder="misal: Buku IR, Umum"/></div>' +
        '<div class="form-group"><label>Status</label><select id="sStatus"><option value="Aktif"' + (v.status !== 'Nonaktif' ? ' selected' : '') + '>Aktif</option><option value="Nonaktif"' + (v.status === 'Nonaktif' ? ' selected' : '') + '>Nonaktif</option></select></div>';
    } else if (mode === 'posSetoran') {
      var st = v.sumberTipe || 'manual';
      // Opsi kolom Buku IR (fixed, tidak ketik bebas)
      var irKeys = [['ir','IR'],['ir10','1/10 IR'],['cicilan','Cicilan'],['infakdaerah','Infak Daerah'],['index','Index']];
      var irOpts = irKeys.map(function(k){ return '<option value="' + k[0] + '"' + (v.sumberRef === k[0] ? ' selected' : '') + '>' + k[1] + '</option>'; }).join('');

        '<div class="form-group" id="grpRefPemasukan" style="display:' + (st === 'pemasukan' ? 'block' : 'none') + ';"><label>Jenis Pemasukan</label><select id="sRefPemasukan"><option value="">-- Pilih --</option>' + pmOpts + '</select></div>' +

          '<div class="text-small text-muted" style="margin-top:4px;">Saat realisasi setoran diinput, uang keluar dicatat otomatis ke pos pengeluaran ini agar saldo kas berkurang.</div></div>' +
        '<div class="form-group"><label>Status</label><select id="sStatus"><option value="Aktif"' + (v.status !== 'Nonaktif' ? ' selected' : '') + '>Aktif</option><option value="Nonaktif"' + (v.status === 'Nonaktif' ? ' selected' : '') + '>Nonaktif</option></select></div>';

      '</div>';

  onSumberTipeChange: function() {
    var st = document.getElementById('sSumberTipe').value;
    var grpIR = document.getElementById('grpRefBukuIR');
    var grpPm = document.getElementById('grpRefPemasukan');
    var grpTg = document.getElementById('grpTarget');
    if (grpIR) grpIR.style.display = (st === 'bukuir') ? 'block' : 'none';

  closeModalSetting: function(e) {
    if (e.target.classList.contains('modal-overlay')) this.closeModalSettingDirect();
  },

  closeModalSettingDirect: function() {
    var el = document.getElementById('settingModal');
    if (el) el.innerHTML = '';
  },

  submitSettingItem: function() {
    var mode = this._settingMode;
    var isEdit = !!this._editSettingItem;
    var nama = (document.getElementById('sNama').value || '').trim();
    if (!nama) {
      document.getElementById('settingFormError').innerHTML = '<div class="error-box">Nama wajib diisi.</div>';
      return;
    }
    var data = { nama: nama };
    if (isEdit) data.id = this._editSettingItem.id;

    if (mode === 'pemasukan' || mode === 'pengeluaran') {
      data.kategori = document.getElementById('sKategori').value;
      data.status = document.getElementById('sStatus').value;
    } else if (mode === 'posSetoran') {
      var st = document.getElementById('sSumberTipe').value;
      data.sumberTipe = st;
      if (st === 'bukuir') data.sumberRef = document.getElementById('sRefBukuIR').value;
      else if (st === 'pemasukan') data.sumberRef = document.getElementById('sRefPemasukan').value;
      else data.sumberRef = '';
      data.target = st === 'manual' ? (App.num('sTarget')) : 0;
      data.pengeluaranRef = document.getElementById('sPengeluaranRef').value;
      data.status = document.getElementById('sStatus').value;
      if (st === 'pemasukan' && !data.sumberRef) {
        document.getElementById('settingFormError').innerHTML = '<div class="error-box">Pilih jenis pemasukan terlebih dahulu.</div>';
        return;
      }
    } else if (mode === 'musyawaroh') {
      data.nilai = App.num('sNilai');
      data.keterangan = document.getElementById('sKet').value;
    }

    var fnMap = {
      pemasukan: isEdit ? 'updatePosPemasukan' : 'addPosPemasukan',
      pengeluaran: isEdit ? 'updatePosPengeluaran' : 'addPosPengeluaran',
      posSetoran: isEdit ? 'updatePosSetoran' : 'addPosSetoran',
      musyawaroh: isEdit ? 'updateMusyawaroh' : 'addMusyawaroh'
    };
    var fn = fnMap[mode];
    document.getElementById('settingFormError').innerHTML = '<div class="info-box">Menyimpan...</div>';
    var self = this;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Tersimpan ✓');
          if (mode === 'pemasukan') self.pagePosPemasukan();
          else if (mode === 'pengeluaran') self.pagePosPengeluaran();
          else if (mode === 'posSetoran') self.pagePosSetoran();
          else self.pageMusyawaroh();
        } else {
          document.getElementById('settingFormError').innerHTML = '<div class="error-box">' + res.message + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        document.getElementById('settingFormError').innerHTML = '<div class="error-box">Error: ' + err.message + '</div>';
      })
      [fn](data);
  },

  deleteSettingItem: function(id) {
    if (!confirm('Hapus item ini?')) return;
    var mode = this._settingMode;
    var fnMap = {
      pemasukan: 'deletePosPemasukan',
      pengeluaran: 'deletePosPengeluaran',
      posSetoran: 'deletePosSetoran',
      musyawaroh: 'deleteMusyawaroh'
    };
    var self = this;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Dihapus');
          if (mode === 'pemasukan') self.pagePosPemasukan();
          else if (mode === 'pengeluaran') self.pagePosPengeluaran();
          else if (mode === 'posSetoran') self.pagePosSetoran();
          else self.pageMusyawaroh();
        } else { self.toast('Gagal: ' + res.message); }
      })
      .withFailureHandler(function(err) { self.toast('Error: ' + err.message); })
      [fnMap[mode]](id);
  },

  pageWrapper: function(title, content, hideBack) {
    var backBtn = hideBack ? '<span style="width:36px;"></span>' : '<button class="btn-back" onclick="App.back()">‹</button>';
    return '<div class="page-header">' +
      backBtn +
      '<h2>' + title + '</h2>' +
      '<button class="btn-home" onclick="App.loadDashboard()" title="Beranda">⌂</button>' +
    '</div>' +
    '<div class="page-content">' + content + '</div>';
  },

  showLoading: function(msg) {
    document.getElementById('app').innerHTML =
      '<div class="loading-screen"><div class="loading-spinner"></div><p>' + (msg || 'Memuat...') + '</p></div>';
  },

  showError: function(msg) {
    document.getElementById('app').innerHTML =
      '<div style="padding:24px;">' +
        '<div class="error-box">' + (msg || 'Terjadi kesalahan.') + '</div>' +
        '<button class="btn btn-outline mt-16" onclick="App.loadDashboard()">← Kembali ke Dashboard</button>' +
      '</div>';
  },

  toast: function(msg, duration) {
    var existing = document.querySelector('.toast');
    if (existing) existing.remove();
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function() { el.classList.add('show'); }, 10);
    setTimeout(function() {
      el.classList.remove('show');
      setTimeout(function() { if (el.parentNode) el.remove(); }, 300);
    }, duration || 2500);
  },

  back: function() {
    var prev = this.history.pop();
    if (!prev || prev === 'dashboard') { this.loadDashboard(); return; }
    var map = {
      bukuIR: 'pageBukuIR',
      kelolaBuku: 'pageKelolaBuku',
      setting: 'pageSetting',
      jamaah: 'pageJamaah',
      setoranDesa: 'pageSetoranDesa',
      patungan: 'pagePatungan',
      aturGrade: 'pageAturGrade'
    };
    if (map[prev]) this[map[prev]]();
    else this.loadDashboard();
  },

  formatNumber: function(n) {
    if (!n && n !== 0) return 'Rp 0';
    return 'Rp ' + Number(n).toLocaleString('id-ID');
  },

  formatDate: function(d) {
    if (!d) return '-';
    try {
      var dt = new Date(d);
      var months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      return dt.getDate() + ' ' + months[dt.getMonth()] + ' ' + dt.getFullYear();
    } catch(e) { return String(d); }
  },

    this.history.push('kelolaBuku');

      '</tr>';
    }).join('') || '<tr><td colspan="6" class="text-center text-muted" style="padding:16px;">Tidak ada transaksi pending.</td></tr>';

        '<div class="stat-row"><span class="stat-label">Saldo Bank (Aktual)</span><span class="stat-value">' + this.formatNumber(data.saldoBankAktual || 0) + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Selisih</span><span class="stat-value ' + (selisih === 0 ? 'text-success' : 'text-danger') + '">' + this.formatNumber(selisih) + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Total Pending</span><span class="stat-value text-warning">' + this.formatNumber(data.totalPending || 0) + '</span></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="section-title mb-8">Input Saldo Harian</div>' +
        '<div class="form-group"><label>Tanggal</label><input type="date" id="rekonTgl" value="' + today + '"/></div>' +
        '<div class="form-group"><label>Saldo Awal (Rp)</label><input type="text" inputmode="numeric" data-tsep="1" id="rekonSaldoAwal" value="' + (data.saldoBankAktual || 0) + '" min="0"/></div>' +
        '<div class="form-group"><label>Pemasukan Bank (Rp)</label><input type="text" inputmode="numeric" data-tsep="1" id="rekonMasuk" value="0" min="0"/></div>' +
        '<div class="form-group"><label>Pengeluaran Bank (Rp)</label><input type="text" inputmode="numeric" data-tsep="1" id="rekonKeluar" value="0" min="0"/></div>' +
        '<div class="form-group"><label>Saldo Akhir Aktual (Rp)</label><input type="text" inputmode="numeric" data-tsep="1" id="rekonSaldoAkhir" value="0" min="0"/></div>' +
        '<div class="form-group"><label>Catatan</label><input type="text" id="rekonCatatan"/></div>' +
        '<div id="rekonError"></div>' +
        '<button class="btn btn-primary" onclick="App.submitRekonsiliasi()">Simpan Rekonsiliasi</button>' +

      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">' +

        '</div>' +
        '<div style="background:linear-gradient(135deg,#059669,#047857);border-radius:12px;padding:14px;color:white;">' +

          '<div style="font-size:16px;font-weight:800;">' + App.formatNumber(s.totalJatahDesa || 0) + '</div>' +
          '<div style="font-size:10px;opacity:0.75;margin-top:3px;">otomatis dari % Desa</div>' +
        '</div>' +
        '<div style="background:linear-gradient(135deg,#7C3AED,#6D28D9);border-radius:12px;padding:14px;color:white;">' +
          '<div style="font-size:11px;opacity:0.85;margin-bottom:4px;">Sudah Disetor</div>' +
          '<div style="font-size:16px;font-weight:800;">' + App.formatNumber(s.totalSudahSetor || 0) + '</div>' +
          '<div style="font-size:10px;opacity:0.75;margin-top:3px;">realisasi (' + persen + '%)</div>' +
        '</div>' +
        '<div style="background:linear-gradient(135deg,#F59E0B,#D97706);border-radius:12px;padding:14px;color:white;">' +
          '<div style="font-size:11px;opacity:0.85;margin-bottom:4px;">Tambahan dari Kas</div>' +
          '<div style="font-size:16px;font-weight:800;">' + App.formatNumber(s.totalTopUpKas || 0) + '</div>' +
          '<div style="font-size:10px;opacity:0.75;margin-top:3px;">kekurangan pemasukan</div>' +
        '</div>' +
      '</div>';

    var cards = data.map(function(item, idx) {
      var badgeClass = item.status === 'Lunas' ? 'lunas' : (item.status === 'Sebagian' ? 'pending' : 'belum');
      var topUpRow = item.topUpKas > 0
        ? '<div class="pos-card-row"><span class="pos-card-label">+ dari Kas</span><span class="pos-card-value" style="color:#D97706;">' + App.formatNumber(item.topUpKas) + '</span></div>'
        : '';
      var targetRow = item.targetMusyawaroh > 0
        ? '<div class="pos-card-row"><span class="pos-card-label">Target Musyawaroh</span><span class="pos-card-value">' + App.formatNumber(item.targetMusyawaroh) + '</span></div>'
        : '';
      return '<div class="pos-card">' +
        '<div class="pos-card-header">' +
          '<div class="pos-card-nama">' + item.nama + ' <span style="font-size:10px;color:var(--text-muted);font-weight:500;">(' + item.pctDesa + '% desa)</span></div>' +
          '<span class="status-badge ' + badgeClass + '">' + item.status + '</span>' +
        '</div>' +
        '<div class="pos-card-row"><span class="pos-card-label">Pemasukan</span><span class="pos-card-value">' + App.formatNumber(item.totalMasuk) + '</span></div>' +
        '<div class="pos-card-row"><span class="pos-card-label">Jatah Desa (otomatis)</span><span class="pos-card-value text-success">' + App.formatNumber(item.jatahDesa) + '</span></div>' +
        targetRow +
        topUpRow +
        '<div class="pos-card-row"><span class="pos-card-label">Sudah Disetor</span><span class="pos-card-value">' + App.formatNumber(item.sudahSetor) + (item.sudahDiinput ? '' : ' <span style="font-size:9px;color:var(--text-muted);">(belum diinput)</span>') + '</span></div>' +
        '<div class="pos-card-row"><span class="pos-card-label">Sisa</span><span class="pos-card-value" style="color:' + (item.sisa > 0 ? 'var(--danger)' : 'var(--success)') + ';font-weight:700;">' + App.formatNumber(item.sisa) + '</span></div>' +
        (item.tindakLanjut ? '<div style="font-size:11px;color:var(--text-muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">' + item.tindakLanjut + '</div>' : '') +
        '<div style="display:flex;gap:6px;margin-top:8px;">' +
          '<button class="btn btn-outline btn-sm" style="flex:1;font-size:12px;" onclick="App.showEditSetoranDesa(' + idx + ')">✏️ Input Setoran</button>' +
          '<button class="action-btn-sm edit" style="flex:1;justify-content:center;font-size:12px;" onclick="App.pageJamaahBelumBayar(\'' + String(item.id).replace(/'/g, "\\'") + '\')">👥 Cek Jamaah</button>' +
        '</div>' +
      '</div>';
    }).join('') || '<div class="text-center text-muted" style="padding:32px;">Belum ada jenis pemasukan dengan jatah desa. Atur % Desa di Master Pemasukan.</div>';

    var html = self.pageWrapper('Laporan Setoran Desa',
      summaryCards + cards + '<div id="setoranDesaModal"></div>'
    );
    document.getElementById('app').innerHTML = html;
  },

  showEditSetoranDesa: function(idx) {
    var item = (this._laporanSetoran && this._laporanSetoran.data) ? this._laporanSetoran.data[idx] : null;
    if (!item) return;
    this._editSetoranDesaItem = item;
    // Saran nilai setoran = kewajiban (target musyawaroh atau jatah desa)
    var saran = item.sudahDiinput ? item.sudahSetor : item.kewajiban;
    document.getElementById('setoranDesaModal').innerHTML =
      '<div class="modal-overlay" onclick="App.closeModalSetoranDesa(event)">' +
        '<div class="modal">' +
          '<div class="modal-title">Setoran Desa: ' + item.nama + '</div>' +
          '<div class="info-box" style="margin-bottom:10px;font-size:12px;">Jatah dari pemasukan: <b>' + App.formatNumber(item.jatahDesa) + '</b>' +
            (item.topUpKas > 0 ? '<br>Perlu tambahan dari kas: <b>' + App.formatNumber(item.topUpKas) + '</b>' : '') +
            '<br>Kewajiban setor: <b>' + App.formatNumber(item.kewajiban) + '</b></div>' +
          '<div class="form-group"><label>Jumlah Disetor (Rp)</label><input type="text" inputmode="numeric" data-tsep="1" id="sdRealisasi" value="' + saran + '"/></div>' +
          '<div class="form-group"><label>Catatan</label><input type="text" id="sdCatatan" placeholder="opsional"/></div>' +
          '<div id="setoranDesaError"></div>' +
          '<button class="btn btn-primary" onclick="App.submitSetoranDesa()">Simpan Setoran</button>' +
          '<button class="btn btn-outline mt-8" onclick="App.closeModalSetoranDesaDirect()">Batal</button>' +
        '</div>' +
      '</div>';
  },

  closeModalSetoranDesa: function(e) {
    if (e.target.classList.contains('modal-overlay')) this.closeModalSetoranDesaDirect();
  },

  closeModalSetoranDesaDirect: function() {
    var el = document.getElementById('setoranDesaModal');
    if (el) el.innerHTML = '';
  },

  submitSetoranDesa: function() {
    var item = this._editSetoranDesaItem;
    var data = {
      posId: item.id, // disimpan sebagai referensi jenis pemasukan
      realisasi: App.num('sdRealisasi'),
      catatan: document.getElementById('sdCatatan').value
    };
    document.getElementById('setoranDesaError').innerHTML = '<div class="info-box">Menyimpan...</div>';
    var self = this;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Setoran berhasil disimpan ✓');
          self.pageLaporanSetoran();
        } else {
          document.getElementById('setoranDesaError').innerHTML = '<div class="error-box">' + res.message + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        document.getElementById('setoranDesaError').innerHTML = '<div class="error-box">Error: ' + err.message + '</div>';
      })
      .submitRealisasiSetoran(data);
  },

  pageJamaahBelumBayar: function(posNama) {
    this.history.push('laporanSetoran');
    this.showLoading('Memuat data jamaah...');
    var self = this;
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.success) { self.showError(res.message); return; }
        self.renderJamaahBelumBayar(res, 'belum');
      })
      .withFailureHandler(function(err) { self.showError(err.message); })
      .getJamaahBelumBayar(posNama);
  },

  renderJamaahBelumBayar: function(res, activeTab) {
    var self = this;
    self._jamaahBayarData = res;
    var belum = res.belumBayar || [];
    var sudah = res.sudahBayar || [];

    var listBelum = belum.length === 0
      ? '<div class="text-center text-muted" style="padding:32px;">Semua jamaah sudah infak 👍</div>'
      : belum.map(function(a) {
          return '<div class="jamaah-card">' +
            '<div class="jamaah-avatar">' + (a.nama || 'J').charAt(0).toUpperCase() + '</div>' +
            '<div class="jamaah-info">' +
              '<div class="jamaah-nama">' + a.nama + '</div>' +
              '<div class="jamaah-detail">' + (a.noTelp || '-') + '</div>' +
              (a.targetBayar > 0 ? '<div class="jamaah-detail" style="color:var(--danger);font-weight:600;">Belum bayar: ' + App.formatNumber(a.targetBayar) + '</div>' : '') +
            '</div>' +
          '</div>';
        }).join('');

    var listSudah = sudah.length === 0
      ? '<div class="text-center text-muted" style="padding:32px;">Belum ada yang membayar.</div>'
      : sudah.map(function(a) {
          return '<div class="jamaah-card">' +
            '<div class="jamaah-avatar" style="background:linear-gradient(135deg,var(--success),#047857);">' + (a.nama || 'J').charAt(0).toUpperCase() + '</div>' +
            '<div class="jamaah-info">' +
              '<div class="jamaah-nama">' + a.nama + '</div>' +
              '<div class="jamaah-detail">' + (a.noTelp || '-') + '</div>' +
              '<div class="jamaah-detail" style="color:var(--success);font-weight:600;">Bayar: ' + App.formatNumber(a.jumlahBayar) + '</div>' +
            '</div>' +
            '<span class="status-badge lunas">✓ Bayar</span>' +
          '</div>';
        }).join('');

    var total = res.total || {};
    var summary =
      '<div class="card" style="margin-bottom:12px;">' +
        '<div class="stat-row"><span class="stat-label">Pos</span><span class="stat-value">' + res.posNama + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Total Jamaah</span><span class="stat-value">' + (total.totalAnggota || 0) + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Belum Infak</span><span class="stat-value text-danger">' + (total.belum || 0) + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Sudah Infak</span><span class="stat-value text-success">' + (total.sudah || 0) + '</span></div>' +
      '</div>';

    var html = self.pageWrapper('Jamaah per Pos',
      summary +
      '<div class="tabs">' +
        '<button class="tab-btn' + (activeTab === 'belum' ? ' active' : '') + '" onclick="App.renderJamaahBelumBayar(App._jamaahBayarData, \'belum\')">Belum Infak <span class="badge">' + belum.length + '</span></button>' +
        '<button class="tab-btn' + (activeTab === 'sudah' ? ' active' : '') + '" onclick="App.renderJamaahBelumBayar(App._jamaahBayarData, \'sudah\')">Sudah Infak <span class="badge" style="background:var(--success);">' + sudah.length + '</span></button>' +
      '</div>' +
      (activeTab === 'belum' ? listBelum : listSudah)
    );
    document.getElementById('app').innerHTML = html;
  },

  // ─────────────────────────────────────────────────
  // PENEROBOS — Dashboard (3 tab: Buku IR, Infak, Pembelaan)
  // ─────────────────────────────────────────────────
  pagePenerobos: function(activeTab) {
    this.history.push('dashboard');
    activeTab = activeTab || 'bukuir';
    this._penerobosTab = activeTab;
    this.showLoading('Memuat data...');
    var self = this;
    if (activeTab === 'bukuir') {
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res.success) { self.showError(res.message); return; }
          self._bukuIRBelumSerah = res;
          self.renderPenerobosHome();
        })
        .withFailureHandler(function(err) { self.showError(err.message); })
        .getBukuIRBelumSerah();
    } else if (activeTab === 'infak') {
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res.success) { self.showError(res.message); return; }
          self._penerobosData = res;
          self.renderPenerobosHome();
        })
        .withFailureHandler(function(err) { self.showError(err.message); })
        .getTagihanPenerobos();
    } else {
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res.success) { self.showError(res.message); return; }
          self._pembelaanData = res;
          self.renderPenerobosHome();
        })
        .withFailureHandler(function(err) { self.showError(err.message); })
        .getPembelaanData();
    }
  },

  renderPenerobosHome: function() {
    var tab = this._penerobosTab || 'bukuir';
    var content = '';

    if (tab === 'bukuir') {
      var d = this._bukuIRBelumSerah || {};
      var belum = d.belumSerah || [], sudah = d.sudahSerah || [];
      var listB = belum.length === 0
        ? '<div class="text-center text-muted" style="padding:32px;">Semua buku IR sudah diserahkan 👍</div>'
        : belum.map(function(a) {
            var wa = (a.noTelp || '').replace(/[^0-9]/g, '');
            var waBtn = wa ? '<a href="https://wa.me/62' + wa.replace(/^0/,'') + '?text=' + encodeURIComponent('Assalamu\'alaikum ' + a.nama + ', mohon segera menyerahkan Buku IR. Jazakallah khair') + '" target="_blank" style="background:#25D366;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;text-decoration:none;white-space:nowrap;">WA</a>' : '';
            return '<div class="jamaah-card">' +
              '<div class="jamaah-avatar" style="background:linear-gradient(135deg,#F59E0B,#B45309);">' + (a.nama||'J').charAt(0).toUpperCase() + '</div>' +
              '<div class="jamaah-info">' +
                '<div class="jamaah-nama">' + a.nama + '</div>' +
                '<div class="jamaah-detail">' + App.formatNumber(a.nominal) + ' · ' + App.formatDate(a.tanggal) + '</div>' +
              '</div>' + waBtn +
            '</div>';
          }).join('');
      content =
        '<div style="display:flex;gap:10px;margin-bottom:12px;">' +
          '<div style="flex:1;text-align:center;background:#FEF3C7;border-radius:10px;padding:12px 0;">' +
            '<div style="font-size:22px;font-weight:700;color:#B45309;">' + belum.length + '</div>' +
            '<div style="font-size:11px;color:#6B7280;">Belum Serah</div>' +
          '</div>' +
          '<div style="flex:1;text-align:center;background:#F0FDF4;border-radius:10px;padding:12px 0;">' +
            '<div style="font-size:22px;font-weight:700;color:var(--success);">' + sudah.length + '</div>' +
            '<div style="font-size:11px;color:#6B7280;">Sudah Serah</div>' +
          '</div>' +
        '</div>' +
        '<div class="section-title mb-8">Belum Menyerahkan Buku IR</div>' +
        listB;

    } else if (tab === 'infak') {
      var summary = (this._penerobosData || {}).summary || [];
      content = summary.map(function(pos, idx) {
        var pct = pos.totalAnggota > 0 ? Math.round((pos.sudah / pos.totalAnggota) * 100) : 0;
        var fillClass = pct >= 100 ? '' : pct >= 60 ? 'warning' : 'danger';
        return '<div class="pos-card" style="cursor:pointer;" onclick="App.pagePenerobosDetail(' + idx + ')">' +
          '<div class="pos-card-header">' +
            '<div style="flex:1;">' +
              '<div class="pos-card-nama">' + pos.nama + '</div>' +
              '<div class="progress-bar" style="margin-top:6px;"><div class="progress-fill ' + fillClass + '" style="width:' + pct + '%;"></div></div>' +
            '</div>' +
            '<div style="text-align:right;padding-left:12px;">' +
              '<div style="font-size:18px;font-weight:700;color:' + (pct>=100?'var(--success)':'var(--danger)') + ';">' + pct + '%</div>' +
              '<div class="text-small text-muted">' + pos.sudah + '/' + pos.totalAnggota + '</div>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:8px;margin-top:8px;">' +
            '<div style="flex:1;text-align:center;background:#FEF2F2;border-radius:8px;padding:6px 0;"><div style="font-weight:700;color:var(--danger);">' + pos.belum + '</div><div style="font-size:11px;color:#6B7280;">Belum</div></div>' +
            '<div style="flex:1;text-align:center;background:#F0FDF4;border-radius:8px;padding:6px 0;"><div style="font-weight:700;color:var(--success);">' + pos.sudah + '</div><div style="font-size:11px;color:#6B7280;">Sudah</div></div>' +
          '</div>' +
        '</div>';
      }).join('') || '<div class="info-box">Belum ada pos pemasukan aktif.</div>';

    } else {
      // Tab pembelaan
      var pd = this._pembelaanData || {};
      content = this._buildPembelaanContent(pd);
    }

    var html = this.pageWrapper('Dashboard Penerobos',
      '<div class="tabs">' +
        '<button class="tab-btn' + (tab==='bukuir'?' active':'') + '" onclick="App.pagePenerobos(\'bukuir\')">📖 Buku IR</button>' +
        '<button class="tab-btn' + (tab==='infak'?' active':'') + '" onclick="App.pagePenerobos(\'infak\')">💰 Infak</button>' +
        '<button class="tab-btn' + (tab==='pembelaan'?' active':'') + '" onclick="App.pagePenerobos(\'pembelaan\')">📝 Pembelaan</button>' +
      '</div>' +
      content
    );
    document.getElementById('app').innerHTML = html;
  },

  _buildPembelaanContent: function(pd) {
    var belum = pd.belum || [], lunas = pd.lunas || [];
    var today = new Date().toISOString().split('T')[0];

    var listBelum = belum.length === 0
      ? '<div class="text-center text-muted" style="padding:20px;">Belum ada kesanggupan tercatat.</div>'
      : belum.map(function(r) {
          var lewat = r.tanggalJanji && r.tanggalJanji < today;
          var borderColor = lewat ? '#EF4444' : '#F59E0B';
          var tag = lewat ? '<span style="font-size:10px;background:#FEE2E2;color:#B91C1C;border-radius:4px;padding:1px 6px;">Terlambat</span>' : '<span style="font-size:10px;background:#FEF3C7;color:#92400E;border-radius:4px;padding:1px 6px;">Menunggu</span>';
          return '<div style="border:1.5px solid ' + borderColor + ';border-radius:12px;padding:12px;margin-bottom:10px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:flex-start;">' +
              '<div>' +
                '<div style="font-weight:700;">' + r.anggotaNama + '</div>' +
                '<div class="text-small text-muted">Sanggup: ' + App.formatNumber(r.nominal) + '</div>' +
                '<div class="text-small text-muted">Janji bayar: ' + App.formatDate(r.tanggalJanji) + '</div>' +
                (r.catatan ? '<div class="text-small text-muted">' + r.catatan + '</div>' : '') +
              '</div>' + tag +
            '</div>' +
            '<div style="display:flex;gap:8px;margin-top:8px;">' +
              '<button class="btn btn-success btn-sm" style="flex:1;" onclick="App.markLunasPembelaan(\'' + r.id + '\')">✓ Lunas</button>' +
            '</div>' +
          '</div>';
        }).join('');

    var listLunas = lunas.length === 0
      ? '<div class="text-center text-muted" style="padding:20px;">Belum ada yang lunas.</div>'
      : lunas.map(function(r) {
          return '<div class="jamaah-card">' +
            '<div class="jamaah-avatar" style="background:linear-gradient(135deg,var(--success),#047857);">' + (r.anggotaNama||'J').charAt(0).toUpperCase() + '</div>' +
            '<div class="jamaah-info">' +
              '<div class="jamaah-nama">' + r.anggotaNama + '</div>' +
              '<div class="jamaah-detail">' + App.formatNumber(r.nominal) + ' · Lunas ' + App.formatDate(r.lunasAt) + '</div>' +
            '</div>' +
            '<span class="status-badge lunas">Lunas</span>' +
          '</div>';
        }).join('');

    var angOpts = '<option value="">-- Pilih Jamaah --</option>' + (pd.anggotaList || []).map(function(a){
      return '<option value="' + a.id + '">' + a.nama + '</option>';
    }).join('');

    return '<div class="card" style="margin-bottom:12px;">' +
        '<div class="section-title mb-8">+ Input Kesanggupan Baru</div>' +
        '<div class="form-group"><label>Jamaah</label><select id="pbAnggota">' + angOpts + '</select></div>' +
        '<div class="form-group"><label>Nominal Sanggup (Rp)</label><input type="text" inputmode="numeric" data-tsep="1" id="pbNominal" placeholder="0" min="0"/></div>' +
        '<div class="form-group"><label>Janji Bayar</label><input type="date" id="pbTanggal" value="' + today + '"/></div>' +
        '<div class="form-group"><label>Catatan</label><input type="text" id="pbCatatan" placeholder="Opsional..."/></div>' +
        '<div id="pbError"></div>' +
        '<button class="btn btn-primary" onclick="App.submitPembelaan()">Simpan Kesanggupan</button>' +
      '</div>' +
      '<div class="section-title mb-8">Menunggu Pembayaran <span class="badge">' + belum.length + '</span></div>' +
      listBelum +
      '<div class="section-title mb-8" style="margin-top:16px;">Sudah Lunas <span class="badge" style="background:var(--success);">' + lunas.length + '</span></div>' +
      listLunas;
  },

  submitPembelaan: function() {
    var anggotaId = (document.getElementById('pbAnggota') || {}).value || '';
    var nominal = App.num('pbNominal');
    var tanggalJanji = (document.getElementById('pbTanggal') || {}).value || '';
    var catatan = (document.getElementById('pbCatatan') || {}).value || '';
    var errEl = document.getElementById('pbError');
    if (!anggotaId) { if(errEl) errEl.innerHTML = '<div class="error-box">Pilih jamaah terlebih dahulu.</div>'; return; }
    if (nominal <= 0) { if(errEl) errEl.innerHTML = '<div class="error-box">Nominal harus lebih dari 0.</div>'; return; }
    if (errEl) errEl.innerHTML = '<div class="info-box">Menyimpan...</div>';
    var self = this;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Kesanggupan berhasil disimpan ✓');
          self.pagePenerobos('pembelaan');
        } else {
          if (errEl) errEl.innerHTML = '<div class="error-box">' + res.message + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        if (errEl) errEl.innerHTML = '<div class="error-box">Error: ' + err.message + '</div>';
      })
      .submitKesanggupanPembelaan({ anggotaId: anggotaId, nominal: nominal, tanggalJanji: tanggalJanji, catatan: catatan });
  },

  markLunasPembelaan: function(id) {
    var self = this;
    if (!confirm('Tandai sebagai lunas?')) return;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Ditandai lunas ✓');
          self.pagePenerobos('pembelaan');
        } else {
          self.toast('Gagal: ' + res.message);
        }
      })
      .withFailureHandler(function(err) { self.toast('Error: ' + err.message); })
      .updateStatusPembelaan(id, 'Lunas');
  },

  pagePenerobosDetail: function(idx) {
    this.history.push('penerobos');
    var pos = (this._penerobosData && this._penerobosData.summary) ? this._penerobosData.summary[idx] : null;
    if (!pos) { this.showError('Data tidak ditemukan.'); return; }
    this._penerobosDetail = pos;
    this.renderPenerobosDetail(pos, 'belum');
  },

  renderPenerobosDetail: function(pos, activeTab) {
    var belum = pos.belumBayar || [];
    var sudah = pos.sudahBayar || [];

    var listBelum = belum.length === 0
      ? '<div class="text-center text-muted" style="padding:32px;">Semua jamaah sudah infak!</div>'
      : belum.map(function(a) {
          var wa = (a.noTelp || '').replace(/[^0-9]/g, '');
          var waBtn = wa
            ? '<a href="https://wa.me/62' + wa.replace(/^0/,'') + '?text=' + encodeURIComponent('Assalamu\'alaikum ' + a.nama + ', mohon segera melunasi ' + pos.nama + '. Jazakallah khair') + '" target="_blank" style="background:#25D366;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;text-decoration:none;">WA</a>'
            : '';
          return '<div class="jamaah-card">' +
            '<div class="jamaah-avatar" style="background:linear-gradient(135deg,#EF4444,#B91C1C);">' + (a.nama||'J').charAt(0).toUpperCase() + '</div>' +
            '<div class="jamaah-info"><div class="jamaah-nama">' + a.nama + '</div><div class="jamaah-detail">' + (a.noTelp||'No. HP tidak ada') + '</div></div>' +
            waBtn +
          '</div>';
        }).join('');

    var listSudah = sudah.length === 0
      ? '<div class="text-center text-muted" style="padding:32px;">Belum ada yang membayar.</div>'
      : sudah.map(function(a) {
          return '<div class="jamaah-card">' +
            '<div class="jamaah-avatar" style="background:linear-gradient(135deg,var(--success),#047857);">' + (a.nama||'J').charAt(0).toUpperCase() + '</div>' +
            '<div class="jamaah-info"><div class="jamaah-nama">' + a.nama + '</div><div class="jamaah-detail">' + App.formatNumber(a.jumlah) + '</div></div>' +
            '<span class="status-badge lunas">✓</span>' +
          '</div>';
        }).join('');

    var pct = pos.totalAnggota > 0 ? Math.round((pos.sudah / pos.totalAnggota) * 100) : 0;
    var html = this.pageWrapper(pos.nama,
      '<div class="card" style="margin-bottom:12px;">' +
        '<div class="stat-row"><span class="stat-label">Total Jamaah</span><span class="stat-value">' + pos.totalAnggota + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Belum Infak</span><span class="stat-value text-danger">' + belum.length + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Sudah Infak</span><span class="stat-value text-success">' + sudah.length + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Progress</span><span class="stat-value">' + pct + '%</span></div>' +
      '</div>' +
      '<div class="tabs">' +
        '<button class="tab-btn' + (activeTab==='belum'?' active':'') + '" onclick="App.renderPenerobosDetail(App._penerobosDetail,\'belum\')">Belum Infak <span class="badge">' + belum.length + '</span></button>' +
        '<button class="tab-btn' + (activeTab==='sudah'?' active':'') + '" onclick="App.renderPenerobosDetail(App._penerobosDetail,\'sudah\')">Sudah Infak <span class="badge" style="background:var(--success);">' + sudah.length + '</span></button>' +
      '</div>' +
      (activeTab === 'belum' ? listBelum : listSudah)
    );
    document.getElementById('app').innerHTML = html;
  },

  markPendingFound: function(id) {
    var self = this;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Status diperbarui menjadi Found ✓');
          self.pageRekonsiliasi();
        } else {
          self.toast('Gagal: ' + res.message);
        }
      })
      .withFailureHandler(function(err) { self.toast('Error: ' + err.message); })
      .updatePendingStatus(id, 'Found', '');
  }
};

document.addEventListener('DOMContentLoaded', function() {
  App.init();
});
</script>
