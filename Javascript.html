<script>
var App = {
  history: [],

  // ─────────────────────────────────────────────────
  // INIT & AUTH
  // ─────────────────────────────────────────────────
  // Cek hak akses (capability) user yang login.
  can: function(cap) {
    return !!(App.currentUser && App.currentUser.perms && App.currentUser.perms[cap]);
  },

  // FASE 5.1: cek izin input per-arah dengan fallback ke kapabilitas lama 'trx.input'.
  // tipe: 'masuk' → trx.input.masuk; selain itu → trx.input.keluar.
  canInput: function(tipe) {
    var perms = (App.currentUser && App.currentUser.perms) || {};
    var cap = (tipe === 'masuk') ? 'trx.input.masuk' : 'trx.input.keluar';
    if (Object.prototype.hasOwnProperty.call(perms, cap)) return !!perms[cap];
    return !!perms['trx.input'];
  },

  // ─── FASE 2c: TOKEN & DISPATCHER FRONTEND ───────────────
  // Token disimpan di localStorage: sesi (harian) & perangkat (terpercaya).
  _K_SESSION: 'kk_session', _K_DEVICE: 'kk_device', _K_EMAIL: 'kk_email',
  getToken: function() { try { return localStorage.getItem(this._K_SESSION) || ''; } catch(e) { return ''; } },
  setToken: function(t) { try { if (t) localStorage.setItem(this._K_SESSION, t); } catch(e) {} },
  getDeviceToken: function() { try { return localStorage.getItem(this._K_DEVICE) || ''; } catch(e) { return ''; } },
  setDeviceToken: function(t) { try { if (t) localStorage.setItem(this._K_DEVICE, t); } catch(e) {} },
  getSavedEmail: function() { try { return localStorage.getItem(this._K_EMAIL) || ''; } catch(e) { return ''; } },
  setSavedEmail: function(e) { try { if (e) localStorage.setItem(this._K_EMAIL, e); } catch(err) {} },
  clearSession: function() { try { localStorage.removeItem(this._K_SESSION); } catch(e) {} },

  // Deteksi error "belum login"/sesi invalid dari respons endpoint.
  _isAuthError: function(msg) { return /belum login|sesi tidak valid|sesi kadaluarsa/i.test(String(msg || '')); },
  // Sesi habis → hapus token sesi (device dipertahankan agar bisa login PIN).
  _forceRelogin: function() {
    this.clearSession();
    this.currentUser = null;
    this.history = [];
    this.toast('Sesi berakhir. Silakan masuk lagi.');
    this.renderLoginEmail();
  },

  // Wrapper pengganti google.script.run: menyisipkan session token sebagai
  // argumen pertama lewat endpoint dispatcher apiCall(token, fnName, args).
  // Mempertahankan API withSuccessHandler/withFailureHandler yang sama.
  srv: function() {
    var self = this;
    var handlers = { s: null, f: null };
    // PENTING: withSuccessHandler/withFailureHandler harus mengembalikan PROXY
    // (bukan objek biasa) agar rantai .withSuccessHandler().withFailureHandler()
    // .namaFungsi() tetap utuh sampai method terminal.
    var proxy = new Proxy({}, {
      get: function(target, prop) {
        if (prop === 'withSuccessHandler') return function(cb) { handlers.s = cb; return proxy; };
        if (prop === 'withFailureHandler') return function(cb) { handlers.f = cb; return proxy; };
        if (typeof prop !== 'string') return undefined;
        return function() {
          var args = Array.prototype.slice.call(arguments);
          var token = self.getToken();
          google.script.run
            .withSuccessHandler(function(res) {
              if (res && res.success === false && self._isAuthError(res.message)) { self._forceRelogin(); return; }
              if (handlers.s) handlers.s(res);
            })
            .withFailureHandler(function(err) { if (handlers.f) handlers.f(err); })
            .apiCall(token, prop, args);
        };
      }
    });
    return proxy;
  },

  // Baca nilai angka dari input (buang pemisah ribuan/titik). Terima id (string) atau elemen.
  num: function(x) {
    var el = (typeof x === 'string') ? document.getElementById(x) : x;
    if (!el) return 0;
    return parseInt(String(el.value).replace(/[^0-9]/g, ''), 10) || 0;
  },

  // Format input angka dengan pemisah ribuan (id-ID), pertahankan posisi kursor.
  _formatAllTsep: function() {
    var self = this;
    document.querySelectorAll('[data-tsep]').forEach(function(el) { self._formatTsep(el); });
  },

  _formatTsep: function(el) {
    var raw = String(el.value).replace(/[^0-9]/g, '');
    var pos = el.selectionStart || 0;
    var digitsBefore = String(el.value).slice(0, pos).replace(/[^0-9]/g, '').length;
    var formatted = raw === '' ? '' : Number(raw).toLocaleString('id-ID');
    if (formatted === el.value) return;
    el.value = formatted;
    var newPos = 0, seen = 0;
    while (newPos < formatted.length && seen < digitsBefore) {
      if (/[0-9]/.test(formatted.charAt(newPos))) seen++;
      newPos++;
    }
    try { el.setSelectionRange(newPos, newPos); } catch(e) {}
  },

  init: function() {
    var self = this;
    // Pasang pemisah ribuan otomatis untuk semua input bertanda data-tsep (capture phase
    // agar memformat sebelum handler oninput lain membaca nilainya).
    if (!this._tsepBound) {
      document.addEventListener('input', function(e) {
        var t = e.target;
        if (t && t.matches && t.matches('[data-tsep]')) self._formatTsep(t);
      }, true);
      // Format nilai prefilled (form edit) begitu field difokus
      document.addEventListener('focusin', function(e) {
        var t = e.target;
        if (t && t.matches && t.matches('[data-tsep]')) self._formatTsep(t);
      }, true);
      // Format otomatis setiap kali konten #app berubah (menangkap semua render)
      var appEl = document.getElementById('app');
      if (appEl && window.MutationObserver) {
        new MutationObserver(function() {
          setTimeout(function() { self._formatAllTsep(); }, 50);
        }).observe(appEl, { childList: true, subtree: false });
      }
      this._tsepBound = true;
    }
    // FASE 2c: pulihkan sesi dari session token bila ada; jika tidak/expired,
    // tampilkan layar login (email → PIN/OTP).
    var token = this.getToken();
    if (!token) { this.renderLoginEmail(); return; }
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success && res.user) {
          self.currentUser = res.user;
          self.loadDashboard();
          self.updateSyncFab();
          setTimeout(function() { self.checkAndFlushQueue(); }, 3000);
        } else {
          self.clearSession();
          self.renderLoginEmail();
        }
      })
      .withFailureHandler(function() {
        self.renderLoginEmail();
      })
      .apiCurrentUser(token);
  },

  // ─── FASE 2c: ALUR LOGIN (email → PIN / OTP → set PIN) ───
  _deviceName: function() {
    try {
      var ua = navigator.userAgent || '';
      var m = ua.match(/(Android|iPhone|iPad|Windows|Macintosh|Linux)/);
      return (m ? m[1] : 'Perangkat') + ' · ' + ((navigator.platform || 'web')).substring(0, 20);
    } catch(e) { return 'Perangkat Web'; }
  },

  _loginShell: function(inner) {
    document.getElementById('app').innerHTML =
      '<div class="login-container">' +
        '<div class="login-logo">🕌</div>' +
        '<div class="login-title">Kas Kelompok</div>' +
        '<p class="login-subtitle">Manajemen Keuangan Jamaah</p>' +
        '<div class="login-card">' + inner + '</div>' +
      '</div>';
  },

  // Alias lama agar pemanggilan renderLogin() tetap aman.
  renderLogin: function() { this.renderLoginEmail(); },

  // Layar 1: masukkan email.
  renderLoginEmail: function() {
    var saved = this.getSavedEmail();
    this._loginShell(
      '<div class="form-group"><label>Email</label>' +
        '<input type="email" id="loginEmail" class="form-control" inputmode="email" placeholder="email@contoh.com" value="' + this.escapeHtml(saved) + '"></div>' +
      '<div id="loginError"></div>' +
      '<button id="loginBtn" class="btn btn-primary" style="width:100%;" onclick="App.loginStart()">Lanjut →</button>' +
      '<p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:12px;">Sudah punya PIN? cukup <b>Email + PIN</b>.<br>Pertama kali diverifikasi lewat <b>OTP email</b>.</p>'
    );
  },

  loginStart: function() {
    var email = (document.getElementById('loginEmail').value || '').trim().toLowerCase();
    if (!email || email.indexOf('@') < 0) {
      document.getElementById('loginError').innerHTML = '<div class="error-box">Masukkan email yang valid.</div>';
      return;
    }
    this.setSavedEmail(email);
    var btn = document.getElementById('loginBtn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Memeriksa…'; }
    var self = this;
    // Tanya server: email ini sudah punya PIN? Jika ya → PIN; jika belum → OTP.
    // Tidak bergantung token perangkat (yang sering hilang di iframe GAS/incognito).
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.needOtp) self.requestOtpAndShow(email);
        else self.renderLoginPin(email);
      })
      .withFailureHandler(function() {
        if (btn) { btn.disabled = false; btn.textContent = 'Lanjut →'; }
        document.getElementById('loginError').innerHTML = '<div class="error-box">❌ Gagal terhubung. Coba lagi.</div>';
      })
      .apiCheckLogin(email);
  },

  requestOtpAndShow: function(email) {
    var self = this;
    this._loginShell('<div class="info-box" style="display:flex;align-items:center;gap:8px;">' +
      '<span style="display:inline-block;width:14px;height:14px;border:2px solid #BFDBFE;border-top-color:#2563EB;border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;"></span>' +
      'Mengirim OTP ke email…</div>');
    google.script.run
      .withSuccessHandler(function() { self.renderLoginOtp(email); })
      .withFailureHandler(function() { self.renderLoginOtp(email); })
      .apiRequestOtp(email);
  },

  // Layar 2a: input OTP (perangkat baru).
  renderLoginOtp: function(email) {
    this._loginShell(
      '<div class="info-box" style="margin-bottom:12px;">Kode OTP dikirim ke <b>' + this.escapeHtml(email) + '</b> (bila terdaftar). Berlaku 5 menit.</div>' +
      '<div class="form-group"><label>Kode OTP (6 digit)</label>' +
        '<input type="text" id="otpCode" class="form-control" inputmode="numeric" maxlength="6" placeholder="000000"></div>' +
      '<div id="loginError"></div>' +
      '<button id="loginBtn" class="btn btn-primary" style="width:100%;" onclick="App.verifyOtpSubmit(\'' + this.escapeHtml(email).replace(/'/g, "\\'") + '\')">Verifikasi →</button>' +
      '<div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px;">' +
        '<a href="#" onclick="App.requestOtpAndShow(\'' + this.escapeHtml(email).replace(/'/g, "\\'") + '\');return false;">Kirim ulang OTP</a>' +
        '<a href="#" onclick="App.renderLoginEmail();return false;">Ganti email</a>' +
      '</div>'
    );
  },

  verifyOtpSubmit: function(email) {
    var otp = (document.getElementById('otpCode').value || '').trim();
    if (!/^\d{6}$/.test(otp)) {
      document.getElementById('loginError').innerHTML = '<div class="error-box">OTP harus 6 digit.</div>';
      return;
    }
    var btn = document.getElementById('loginBtn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Memverifikasi…'; }
    var self = this;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          self.setDeviceToken(res.deviceToken);
          self.setToken(res.sessionToken);
          self.setSavedEmail(email);
          self.currentUser = res.user;
          self.renderSetPin(true);
        } else {
          if (btn) { btn.disabled = false; btn.textContent = 'Verifikasi →'; }
          document.getElementById('loginError').innerHTML = '<div class="error-box">❌ ' + self.escapeHtml((res && res.message) || 'Verifikasi gagal.') + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        if (btn) { btn.disabled = false; btn.textContent = 'Verifikasi →'; }
        document.getElementById('loginError').innerHTML = '<div class="error-box">❌ Gagal terhubung. Coba lagi.</div>';
      })
      .apiVerifyOtp(email, otp, self._deviceName());
  },

  // Layar 2b: input PIN (Email + PIN, tanpa token perangkat).
  renderLoginPin: function(email) {
    this._loginShell(
      '<div class="info-box" style="margin-bottom:12px;">Masuk sebagai <b>' + this.escapeHtml(email) + '</b></div>' +
      '<div class="form-group"><label>PIN (6 digit)</label>' +
        '<input type="password" id="pinCode" class="form-control" inputmode="numeric" maxlength="6" placeholder="••••••"></div>' +
      '<div id="loginError"></div>' +
      '<button id="loginBtn" class="btn btn-primary" style="width:100%;" onclick="App.loginPinSubmit(\'' + this.escapeHtml(email).replace(/'/g, "\\'") + '\')">Masuk →</button>' +
      '<div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px;">' +
        '<a href="#" onclick="App.requestOtpAndShow(\'' + this.escapeHtml(email).replace(/'/g, "\\'") + '\');return false;">Masuk dengan OTP</a>' +
        '<a href="#" onclick="App.renderLoginEmail();return false;">Ganti email</a>' +
      '</div>'
    );
  },

  loginPinSubmit: function(email) {
    var pin = (document.getElementById('pinCode').value || '').trim();
    if (!/^\d{6}$/.test(pin)) {
      document.getElementById('loginError').innerHTML = '<div class="error-box">PIN harus 6 digit.</div>';
      return;
    }
    var btn = document.getElementById('loginBtn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Masuk…'; }
    var self = this;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          self.setToken(res.sessionToken);
          self.currentUser = res.user;
          self.loadDashboard();
        } else {
          if (btn) { btn.disabled = false; btn.textContent = 'Masuk →'; }
          var m = (res && res.message) || 'Login gagal.';
          document.getElementById('loginError').innerHTML = '<div class="error-box">❌ ' + self.escapeHtml(m) + '</div>' +
            ((res && res.needOtp) || /belum diatur/i.test(m) ? '<button class="btn btn-outline mt-8" style="width:100%;" onclick="App.requestOtpAndShow(\'' + self.escapeHtml(email).replace(/'/g, "\\'") + '\')">Masuk dengan OTP</button>' : '');
        }
      })
      .withFailureHandler(function() {
        if (btn) { btn.disabled = false; btn.textContent = 'Masuk →'; }
        document.getElementById('loginError').innerHTML = '<div class="error-box">❌ Gagal terhubung. Coba lagi.</div>';
      })
      .apiLoginEmailPin(email, pin);
  },

  // Layar 3: atur PIN (setelah OTP; boleh dilewati).
  renderSetPin: function(optional) {
    this._loginShell(
      '<div class="info-box" style="margin-bottom:12px;">Atur <b>PIN 6 digit</b> untuk login cepat di perangkat ini berikutnya.</div>' +
      '<div class="form-group"><label>PIN baru</label>' +
        '<input type="password" id="pinNew" class="form-control" inputmode="numeric" maxlength="6" placeholder="••••••"></div>' +
      '<div class="form-group"><label>Ulangi PIN</label>' +
        '<input type="password" id="pinNew2" class="form-control" inputmode="numeric" maxlength="6" placeholder="••••••"></div>' +
      '<div id="loginError"></div>' +
      '<button class="btn btn-primary" style="width:100%;" onclick="App.setPinSubmit()">Simpan PIN</button>' +
      (optional ? '<button class="btn btn-outline mt-8" style="width:100%;" onclick="App.loadDashboard()">Lewati</button>' : '')
    );
  },

  setPinSubmit: function() {
    var pin = (document.getElementById('pinNew').value || '').trim();
    var pin2 = (document.getElementById('pinNew2').value || '').trim();
    if (!/^\d{6}$/.test(pin)) { document.getElementById('loginError').innerHTML = '<div class="error-box">PIN harus 6 digit angka.</div>'; return; }
    if (pin !== pin2) { document.getElementById('loginError').innerHTML = '<div class="error-box">PIN tidak sama.</div>'; return; }
    var self = this;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) { self.toast('PIN tersimpan.'); self.loadDashboard(); }
        else { document.getElementById('loginError').innerHTML = '<div class="error-box">❌ ' + self.escapeHtml((res && res.message) || 'Gagal menyimpan PIN.') + '</div>'; }
      })
      .withFailureHandler(function() { document.getElementById('loginError').innerHTML = '<div class="error-box">❌ Gagal terhubung.</div>'; })
      .apiSetPin(self.getToken(), pin);
  },

  doLogout: function() {
    var self = this;
    var token = this.getToken();
    var done = function() {
      self.clearSession(); // token perangkat dipertahankan → login berikutnya cukup PIN
      self.currentUser = null;
      self.history = [];
      self.renderLoginEmail();
    };
    google.script.run.withSuccessHandler(done).withFailureHandler(done).apiLogout(token);
  },

  // ─────────────────────────────────────────────────
  // DASHBOARD
  // ─────────────────────────────────────────────────
  loadDashboard: function() {
    this.history = [];
    this.showLoading('Memuat dashboard...');
    var self = this;
    var done = false;

    // Timeout 35 detik — tampilkan tombol retry jika server tidak respons
    var timeout = setTimeout(function() {
      if (!done) {
        document.getElementById('app').innerHTML =
          '<div style="padding:32px;text-align:center;">' +
            '<div style="font-size:40px;margin-bottom:12px;">⏱️</div>' +
            '<p style="font-weight:700;font-size:16px;margin-bottom:8px;">Server Lambat Merespons</p>' +
            '<p style="color:var(--text-muted);font-size:14px;margin-bottom:20px;">Google Apps Script sedang memuat data.<br>Ini normal pada akses pertama (cold start).</p>' +
            '<button class="btn btn-primary" onclick="App.loadDashboard()" style="max-width:240px;margin:0 auto;">🔄 Coba Lagi</button>' +
          '</div>';
      }
    }, 35000);

    App.srv()
      .withSuccessHandler(function(res) {
        done = true;
        clearTimeout(timeout);
        try {
          if (res && res.success) {
            self.renderDashboard(res);
          } else {
            self.showError((res && res.message) || 'Gagal memuat data. Pastikan spreadsheet sudah dikonfigurasi.');
          }
        } catch(err) {
          // Tampilkan error JS yang sebenarnya — membantu debugging
          document.getElementById('app').innerHTML =
            '<div style="padding:20px;">' +
              '<div class="error-box"><strong>Error Render:</strong> ' + err.message + '</div>' +
              '<button class="btn btn-outline mt-16" onclick="App.loadDashboard()">🔄 Coba Lagi</button>' +
            '</div>';
        }
      })
      .withFailureHandler(function(err) {
        done = true;
        clearTimeout(timeout);
        document.getElementById('app').innerHTML =
          '<div style="padding:20px;">' +
            '<div class="error-box"><strong>Error Server:</strong> ' + (err ? err.message : 'Tidak diketahui') + '</div>' +
            '<p style="font-size:13px;color:var(--text-muted);margin-top:8px;">Pastikan email Anda ada di sheet <strong>Master User</strong> dan sheet <strong>Master Period</strong> sudah dibuat.</p>' +
            '<button class="btn btn-outline mt-16" onclick="App.loadDashboard()">🔄 Coba Lagi</button>' +
            '<button class="btn btn-danger mt-8" onclick="App.doLogout()" style="max-width:100%;">Logout</button>' +
          '</div>';
      })
      .getDashboardData();
  },

  renderDashboard: function(data) {
    var u = data.user || {};
    var inisial = (u.nama || 'U').charAt(0).toUpperCase();
    var periode = data.periode;

    var html = '<div class="page-content" style="padding-top:20px;">' +
      '<div class="user-info">' +
        '<div class="avatar">' + inisial + '</div>' +
        '<div>' +
          '<div class="user-name">' + App.escapeHtml(u.nama || '-') + '</div>' +
          '<div class="user-role">' + App.escapeHtml(u.role || '') + ' · ' + App.escapeHtml(data.namaKelompok || 'Kas Kelompok') + '</div>' +
          (periode ? '<div class="text-small text-muted mt-8">Periode: ' + App.escapeHtml(periode.nama) + '</div>' : '<div class="text-small text-danger mt-8">⚠ Tidak ada periode aktif</div>') +
        '</div>' +
        '<div style="display:flex;gap:6px;">' +
          '<button class="btn btn-sm" style="background:#EFF6FF;color:#2563EB;border:none;cursor:pointer;" onclick="App.loadDashboard()" title="Refresh">🔄</button>' +
          '<button class="btn btn-sm" style="background:#FEF2F2;color:#DC2626;border:none;cursor:pointer;" onclick="App.doLogout()">Keluar</button>' +
        '</div>' +
      '</div>' +

      // K3: peringatan bila tidak ada periode OPEN (angka = saldo arsip tutup buku).
      (data.peringatan ? '<div class="info-box" style="background:#FEF3C7;border:1px solid #F59E0B;color:#92400E;margin-bottom:14px;">⚠ ' + App.escapeHtml(data.peringatan) + '</div>' : '') +

      (u.role !== 'PENEROBOS' ? '<div class="total-card">' +
        '<div class="total-label">💰 Total Kas</div>' +
        '<div class="total-amount">' + this.formatNumber(data.totalKas || 0) + '</div>' +
      '</div>' : '') +

      (u.role !== 'PENEROBOS' ? '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">' +
        '<div class="kas-card tunai">' +
          '<div class="kas-label">🪙 Kas Tunai</div>' +
          '<div class="kas-amount">' + this.formatNumber(data.kasTunai || 0) + '</div>' +
        '</div>' +
        '<div class="kas-card bank">' +
          '<div class="kas-label">🏦 Kas Bank</div>' +
          '<div class="kas-amount">' + this.formatNumber(data.kasBank || 0) + '</div>' +
        '</div>' +
      '</div>' : '') +

      // T7: pos ketiga — kas di tangan penerobos (belum masuk kas kelompok) + aging.
      ((u.role !== 'PENEROBOS' && ((data.kasPenerobos || 0) > 0 || (data.penerobosTutup && data.penerobosTutup.count > 0))) ? this._renderKasPenerobos(data) : '') +

      // T12: pengeluaran menunggu persetujuan (untuk penyetuju).
      ((App.can('trx.approve') && data.menungguApproval && data.menungguApproval.count > 0) ?
        '<button class="btn btn-outline mb-16" style="border-color:#D97706;color:#D97706;" onclick="App.pageApproval()">✅ Persetujuan Pengeluaran (' + data.menungguApproval.count + ' · ' + this.formatNumber(data.menungguApproval.total) + ')</button>' : '') +

      // K3: input transaksi hanya bila ada periode aktif (OPEN).
      (periode ? '<button class="btn btn-success mb-16" onclick="App.pageTransaksi()">+ Input Transaksi</button>' : '') +

      '<button class="btn btn-secondary mb-16" onclick="App.pageRiwayatSaya()">🧾 Riwayat Transaksi Saya</button>' +

      (u.role === 'ADMIN' ? '<button class="btn btn-outline mb-16" onclick="App.openAdminConsole()">🖥️ Admin Console (desktop)</button>' : '') +

      this._renderMenuGroups(data) +

      '<div class="app-footer">' + App.escapeHtml(data.namaKelompok || 'Kas Kelompok') +
        (data.buildDate ? ' <span style="opacity:.6;">· build ' + App.escapeHtml(data.buildDate) + '</span>' : '') + '</div>' +
    '</div>';

    document.getElementById('app').innerHTML = html;
  },

  // T7: kartu Kas di Tangan Penerobos + aging.
  _renderKasPenerobos: function(data) {
    var self = this;
    var agingHari = data.agingHari || 7;
    var dalamTotal = (data.penerobosDalamTotal !== false); // default true (mode periode)
    var list = (data.penerobosDetail || []).map(function(p) {

      : '<b>Tidak termasuk</b> dalam Total Kas di atas — Total berasal dari arsip tutup buku (basis waktu berbeda). Uang ini masih menunggu serah terima.';
    var tombolKelola = App.can('penerobos.kelola')
      ? '<button class="btn btn-sm btn-outline" style="margin-top:10px;border-color:#D97706;color:#B45309;" onclick="App.pageKelolaKasPenerobos()">🔧 Kelola Kas Penerobos</button>'
      : '';
    return '<div class="card" style="margin-bottom:14px;border-left:4px solid ' + (dalamTotal ? '#D97706' : '#B91C1C') + ';">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;">' +

        '<div style="font-weight:800;">' + self.formatNumber(data.kasPenerobos) + '</div>' +

  pageTransaksi: function() {
    this.history.push('dashboard');
    this.showLoading('Memuat data transaksi...');
    var self = this;
    App.srv()
      .withSuccessHandler(function(r) {
        if (r && r.success) {
          self.renderTransaksiForm('masuk', r.pemasukan || [], r.pengeluaran || [], r.anggota || []);
        } else {
          self.showError((r && r.message) || 'Gagal memuat data');
        }
      })
      .withFailureHandler(function(err) {
        // Fallback: render form kosong agar tetap bisa dipakai
        self.renderTransaksiForm('masuk', [], [], []);
      })
      .getTransaksiMasterData();
    this._masterP = null; this._masterPK = null; this._anggota = null;
  },

    var formHtml = '';

    var isPenerobos = App.currentUser && App.currentUser.role === 'PENEROBOS';

    if (tipe === 'masuk' && isPenerobos) {
      formHtml += '<div class="info-box" style="margin-bottom:12px;">💼 Pemasukan Anda akan dicatat sebagai <b>Kas Penerobos</b> dan menunggu serah terima ke bendahara.</div>';
    }

    if (tipe === 'masuk') {
      // Filter lenient: tampilkan semua kecuali yang statusnya eksplisit 'Nonaktif'
      var filteredP = (masterP || []).filter(function(p) {
        var s = (p.status || '').toString().trim().toLowerCase();
        return s !== 'nonaktif';

        return '<option value="' + p.id + '" data-kategori="' + App.escapeHtml(p.kategori || '') + '">' + App.escapeHtml(p.nama) + '</option>';
      }).join('');
      if (!opts) opts = '<option value="">-- Belum ada data. Tambah di Setting > Pos Pemasukan --</option>';
      var angOpts = '<option value="">-- Pilih Jamaah --</option>' + (anggota || []).map(function(a) {
        return '<option value="' + a.id + '">' + App.escapeHtml(a.nama) + '</option>';
      }).join('');
      formHtml =
        '<div class="form-group"><label>Jenis Pemasukan</label>' +
        '<select id="trxJenis" onchange="App.onJenisMasukChange()">' + opts + '</select></div>' +
        '<div id="jamaahGroup" style="display:none;" class="form-group"><label id="jamaahLabel">Jamaah</label>' +
        '<select id="trxAnggota">' + angOpts + '</select></div>' +
        '<div class="form-group"><label>Nominal (Rp)</label>' +
        '<input type="text" inputmode="numeric" data-tsep="1" id="trxNominal" placeholder="0" oninput="App.onNominalInput()" min="0"/>' +
        '<div id="previewNominal"></div></div>' +
        '<div class="form-group"><label>Sumber Kas</label>' +

      setTimeout(function() { App.onJenisMasukChange(); App._formatAllTsep(); }, 100);
    } else if (tipe === 'keluar') {
      var filteredPK = (masterPK || []).filter(function(p) {
        var s = (p.status || '').toString().trim().toLowerCase();
        return s !== 'nonaktif';
      });
      var opts = filteredPK.map(function(p) {
        return '<option value="' + p.id + '">' + App.escapeHtml(p.nama) + '</option>';
      }).join('');
      if (!opts) opts = '<option value="">-- Belum ada data. Tambah di Setting > Pos Pengeluaran --</option>';
      formHtml =
        '<div class="form-group"><label>Jenis Pengeluaran</label><select id="trxJenis">' + opts + '</select></div>' +
        '<div class="form-group"><label>Nominal (Rp)</label>' +
        '<input type="text" inputmode="numeric" data-tsep="1" id="trxNominal" placeholder="0" oninput="App.onNominalInput()" min="0"/>' +
        '<div id="previewNominal"></div></div>' +
        '<div class="form-group"><label>Sumber Kas</label>' +
        '<select id="trxSumber"><option value="Tunai">Tunai</option><option value="Bank">Bank</option></select></div>' +
        '<div class="form-group"><label>Tanggal</label><input type="date" id="trxTanggal" value="' + today + '"/></div>' +

    } else {

        ((isPenerobos || !App.canInput('keluar')) ? '' : '<button class="tab-btn' + (tipe === 'mutasi' ? ' active' : '') + '" onclick="App.renderTransaksiForm(\'mutasi\', App._masterP, App._masterPK, App._anggota)">🔄 Mutasi</button>') +

  onJenisMasukChange: function() {
    var sel = document.getElementById('trxJenis');
    if (!sel) return;
    var opt = sel.options[sel.selectedIndex];
    // Cek dari nama option ATAU kategori — lebih toleran
    var optText = opt ? (opt.textContent || opt.text || '').toLowerCase() : '';
    var kategori = opt ? (opt.getAttribute('data-kategori') || '').toLowerCase() : '';
    var isBukuIR = optText.indexOf('buku ir') !== -1 || kategori.indexOf('buku ir') !== -1;
    var grp = document.getElementById('jamaahGroup');
    var lbl = document.getElementById('jamaahLabel');
    if (grp) {
      grp.style.display = isBukuIR ? 'block' : 'none';
      // Reset value saat field disembunyikan
      if (!isBukuIR) {
        var sel2 = document.getElementById('trxAnggota');
        if (sel2) sel2.value = '';
      }
    }
    if (lbl) {
      lbl.innerHTML = isBukuIR
        ? 'Jamaah <span style="color:var(--danger);font-weight:700;">* WAJIB</span>'
        : 'Jamaah';
    }
  },

  onNominalInput: function() {
    var val = App.num('trxNominal');
    var el = document.getElementById('previewNominal');
    if (el && val > 0) {
      el.innerHTML = '<div class="preview-box"><span class="preview-amount">' + this.formatNumber(val) + '</span></div>';
    } else if (el) {
      el.innerHTML = '';
    }
  },

  submitTransaksi: function() {
    var tipe = this._tipeTransaksi;
    var nominal = App.num('trxNominal');
    var tanggal = document.getElementById('trxTanggal').value;
    if (nominal <= 0) {
      document.getElementById('trxError').innerHTML = '<div class="error-box">Nominal harus lebih dari 0.</div>';
      return;
    }
    var data = { tipe: tipe, nominal: nominal, tanggal: tanggal };
    if (tipe === 'masuk') {
      data.jenisId = document.getElementById('trxJenis').value;
      data.sumberKas = document.getElementById('trxSumber').value;
      data.anggotaId = (document.getElementById('trxAnggota') || {}).value || '';
      data.catatan = document.getElementById('trxCatatan').value;
      // Validasi: Buku IR wajib pilih jamaah
      var jenisOpt = document.getElementById('trxJenis');
      var opt2 = jenisOpt ? jenisOpt.options[jenisOpt.selectedIndex] : null;
      var optText2 = opt2 ? (opt2.textContent || opt2.text || '').toLowerCase() : '';
      var kat2 = opt2 ? (opt2.getAttribute('data-kategori') || '').toLowerCase() : '';
      var isBukuIRValidasi = optText2.indexOf('buku ir') !== -1 || kat2.indexOf('buku ir') !== -1;
      if (isBukuIRValidasi && !data.anggotaId) {
        document.getElementById('trxError').innerHTML = '<div class="error-box">⚠️ Pilih Jamaah terlebih dahulu untuk jenis Buku IR.</div>';
        document.getElementById('jamaahGroup').scrollIntoView({ behavior: 'smooth' });
        return;
      }
    } else if (tipe === 'keluar') {
      data.jenisId = document.getElementById('trxJenis').value;
      data.sumberKas = document.getElementById('trxSumber').value;
      data.catatan = document.getElementById('trxCatatan').value;
    } else {
      data.arah = document.getElementById('trxArah').value;
    }
    var self = this;
    var kirim = function(buktiList) {
      if (buktiList && buktiList.length) data.buktiList = buktiList;
      document.getElementById('trxError').innerHTML = '<div class="info-box">Menyimpan...</div>';
      App.srv()
        .withSuccessHandler(function(res) {
          if (res.success) { self.toast(res.perluApproval ? 'Disimpan sbg Draft — menunggu persetujuan ✓' : 'Transaksi berhasil disimpan ✓'); self.loadDashboard(); }
          else { document.getElementById('trxError').innerHTML = '<div class="error-box">' + (res.message || 'Gagal') + '</div>'; }
        })
        .withFailureHandler(function(err) { document.getElementById('trxError').innerHTML = '<div class="error-box">Error: ' + err.message + '</div>'; })
        .submitTransaksi(data);
    };
    // Pengeluaran: kompres & sertakan foto bukti bila ada.
    var buktiEl = document.getElementById('trxBukti');
    if (tipe === 'keluar' && buktiEl && buktiEl.files && buktiEl.files.length) {
      document.getElementById('trxError').innerHTML = '<div class="info-box">Menyiapkan bukti...</div>';
      this._kumpulBukti_(buktiEl.files, kirim);
    } else {
      kirim(null);
    }
  },

  // Kompres 1 gambar → dataURL JPEG (maks ~800px, kualitas 0.6) untuk hemat kuota.
  _kompresGambar_: function(file, cb) {
    try {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var maxW = 800, scale = Math.min(1, maxW / img.width);
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          try { cb(canvas.toDataURL('image/jpeg', 0.6)); } catch(err) { cb(null); }
        };
        img.onerror = function() { cb(null); };
        img.src = e.target.result;
      };
      reader.onerror = function() { cb(null); };
      reader.readAsDataURL(file);
    } catch(e) { cb(null); }
  },
  _kumpulBukti_: function(fileList, done) {
    var files = fileList ? Array.prototype.slice.call(fileList) : [];
    if (!files.length) { done([]); return; }
    var out = [], self = this, n = 0;
    files.forEach(function(f) {
      self._kompresGambar_(f, function(b64) { if (b64) out.push(b64); n++; if (n === files.length) done(out); });
    });
  },

  pageBukuIR: function() {
    this.history.push('dashboard');

    if (qLen > 0) {
      this.checkAndFlushQueue();

      .withSuccessHandler(function(res) {
        if (res.success) self.renderBukuIR(res.data, 'belum');
        else self.showError(res.message);
      })
      .withFailureHandler(function(err) { self.showError(err.message); })
      .getBukuIRData();

    var belum = data.belumDirincikan || [];

    this._bukuIRMap = {};
    belum.concat(sudah).forEach(function(it) { App._bukuIRMap[it.id] = it; });

                '<div class="text-small text-muted">' + App.formatDate(item.tanggal) + '</div>' +
              '</div>' +
              '<div style="text-align:right;">' +
                '<div class="font-bold">' + App.formatNumber(item.nominal) + '</div>' +
                '<span class="status-badge lunas">✓ Dirincikan</span>' +
                '<div class="text-small" style="color:var(--primary);margin-top:2px;">✎ Ubah</div>' +
              '</div>' +

        }).join('');

    var rekEl = document.getElementById('rekapTujuan');

      rekEl.innerHTML = '<div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:10px 12px;font-size:12px;">' +

        '<div style="display:flex;justify-content:space-between;"><span style="color:#166534;">→ Kas Kelompok (Index):</span><span style="font-weight:700;color:#15803D;">' + App.formatNumber(index) + '</span></div>' +

  submitRincianIR: function() {
    if (!this.cekTotalRincian()) {
      document.getElementById('rincianError').innerHTML = '<div class="error-box">Total rincian harus sama dengan total transaksi.</div>';
      return;
    }
    var item = this._rincianItem;
    var data = {
      transaksiId: item.id, periodeId: item.periodeId, anggotaId: item.anggotaId,
      tanggal: item.tanggal,
      ir: App.num('rIR'),
      ir10: App.num('rIR10'),
      cicilan: App.num('rCicilan'),
      infakDaerah: App.num('rInfakDaerah'),
      index: App.num('rIndex'),
      total: item.nominal,
      anggotaNama: item.anggota ? item.anggota.nama : ''
    };

    // Simpan ke antrian lokal dulu (offline-first)
    App.queueRincian(data);
    App.updateSyncFab();
    document.getElementById('rincianError').innerHTML = '<div class="valid-indicator ok">✓ Tersimpan lokal. Mengirim ke server...</div>';
    var self = this;

    // Coba kirim langsung; jika gagal tetap ada di antrian
    App.flushRincianQueue(function(berhasil) {
      if (berhasil) {
        self.toast('Rincian berhasil disimpan ✓');
        self.pageBukuIR();
      } else {
        self.toast('Tersimpan lokal. Akan dikirim saat ada jaringan. 📲', 4000);
        self.pageBukuIR();
      }
    });
  },

  // ─────────────────────────────────────────────────
  // OFFLINE QUEUE — Buku IR
  // ─────────────────────────────────────────────────
  _QUEUE_KEY: 'kas_rincian_queue',

  queueRincian: function(data) {
    var q = this.getQueue();
    data._queuedAt = new Date().toISOString();
    q.push(data);
    try { localStorage.setItem(this._QUEUE_KEY, JSON.stringify(q)); } catch(e) {}
  },

  getQueue: function() {
    try {
      var raw = localStorage.getItem(this._QUEUE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  },

  saveQueue: function(q) {
    try { localStorage.setItem(this._QUEUE_KEY, JSON.stringify(q)); } catch(e) {}
  },

  flushRincianQueue: function(callback) {
    var q = this.getQueue();
    if (q.length === 0) { if (callback) callback(true); return; }
    var self = this;
    var item = q[0];

    App.srv()
      .withSuccessHandler(function(res) {
        if (res.success) {
          q.shift();
          self.saveQueue(q);
          if (q.length > 0) {
            self.flushRincianQueue(callback);
          } else {
            if (callback) callback(true);
          }
        } else {
          if (callback) callback(false);
        }
      })
      .withFailureHandler(function() {
        if (callback) callback(false);
      })
      .submitRincianIR(item);
  },

  checkAndFlushQueue: function() {
    var q = this.getQueue();
    if (q.length === 0) { this.updateSyncFab(); return; }
    var total = q.length;
    var self = this;
    this.updateSyncFab('sending');
    this.flushRincianQueue(function(ok) {
      var remaining = self.getQueue().length;
      if (ok && remaining === 0) {
        self.toast('✅ ' + total + ' rincian berhasil dikirim ke server');
      } else if (remaining > 0) {
        self.toast('⏳ ' + remaining + ' rincian masih dalam antrian (offline)', 3000);
      }
      self.updateSyncFab();
    });
  },

  // Floating Action Button untuk sync antrian
  updateSyncFab: function(state) {
    var fab = document.getElementById('sync-fab');
    var q = this.getQueue();
    var count = q.length;

    if (count === 0 && state !== 'sending') {
      if (fab) fab.style.display = 'none';
      return;
    }

    if (!fab) {
      fab = document.createElement('div');
      fab.id = 'sync-fab';
      fab.onclick = function() { App.checkAndFlushQueue(); };
      document.body.appendChild(fab);
    }

    fab.style.display = 'flex';
    if (state === 'sending') {
      fab.innerHTML = '<span style="font-size:18px;animation:spin 1s linear infinite;display:inline-block;">↻</span><span style="font-size:12px;margin-left:4px;">Mengirim...</span>';
      fab.style.background = '#F59E0B';
    } else {
      fab.innerHTML = '<span style="font-size:16px;">📤</span><span style="font-size:12px;margin-left:4px;">' + count + ' belum terkirim</span>';
      fab.style.background = '#EF4444';
    }
  },

      .deleteTransaksi({ id: id, tipe: trx.tipe, sumberKas: trx.sumber, alasan: alasan });

  _renderKasPenerobos: function(res) {
    var self = this;
    var periodeOpen = res.periode && res.periode.status === 'OPEN';
    var canInput = App.can('penerobos.input');

    // Store items for checkbox selection
    App._kpItems = {};
    (res.data || []).forEach(function(d) { App._kpItems[d.id] = d; });

    var activeItems = (res.data || []).filter(function(d) { return d.status === 'Aktif'; });
    var rows = (res.data || []).map(function(d) {
      var badge = d.status === 'Aktif'
        ? '<span class="badge badge-success">Aktif</span>'
        : '<span class="badge badge-muted">' + App.escapeHtml(d.status || 'Diserahkan') + '</span>';
      var chk = (d.status === 'Aktif' && canInput && periodeOpen)
        ? '<input type="checkbox" class="kp-check" data-id="' + d.id + '" onchange="App._updateKpBtn()" style="width:18px;height:18px;margin-right:4px;">'
        : '';
      return '<div class="trx-item" style="display:flex;align-items:flex-start;gap:8px;">' +
        chk +
        '<div style="flex:1;">' +
          '<div class="trx-item-top">' +
            '<span class="trx-item-nama">' + App.escapeHtml(d.jenis || '-') + (d.anggota ? ' · ' + App.escapeHtml(d.anggota) : '') + '</span>' +
            '<span class="trx-item-nominal text-success">' + App.formatNumber(d.nominal) + '</span>' +
          '</div>' +
          '<div class="trx-item-meta">' + App.formatDate(d.tanggal) + (d.catatan ? ' · ' + App.escapeHtml(d.catatan) : '') + ' ' + badge + '</div>' +
          ((d.status === 'Aktif' && App.can('penerobos.kelola') && periodeOpen && !d.serahTerimaId) ?
            '<button class="btn btn-sm btn-danger" style="margin-top:6px;" onclick="App.batalkanKasPenerobos(\'' + self._esc(d.id).replace(/'/g, "\\'") + '\',' + (Number(d.nominal) || 0) + ')">🗑️ Batalkan</button>' : '') +
        '</div>' +
      '</div>';
    }).join('') || '<p class="text-muted text-small" style="padding:12px 0;">Belum ada data</p>';

    // L2d: bila ada kas Aktif tapi serah terima tak bisa dibuat, jelaskan alasannya.
    var diagBanner = '';
    if (activeItems.length > 0 && res.dapatSerahTerima === false) {
      diagBanner = '<div class="info-box" style="background:#FEF3C7;border:1px solid #F59E0B;color:#92400E;margin-bottom:12px;">⚠ Serah terima belum bisa diproses: ' +
        App.escapeHtml(res.alasanSerahTerima || 'sebab tidak diketahui') + '</div>';
    } else if (activeItems.length > 0 && res.alasanSerahTerima) {
      diagBanner = '<div class="info-box" style="margin-bottom:12px;">' + App.escapeHtml(res.alasanSerahTerima) + '</div>';
    }
    var bisaSerah = (res.dapatSerahTerima !== false);
    var html = self.pageWrapper('Kas Penerobos',
      diagBanner +
      (canInput && periodeOpen ?
        '<button class="btn btn-primary mb-16" onclick="App._showFormKasPenerobos()">+ Tambah Kas Masuk</button>'
      : '') +
      '<div class="card" style="padding:0 16px;" id="kpList">' + rows + '</div>' +
      (canInput && periodeOpen && bisaSerah && activeItems.length > 0 ?
        '<div id="kpActionBar" style="display:none;margin-top:12px;">' +
          '<button class="btn btn-warning" id="kpSerahBtn" onclick="App._showModalSerahTerima()">Buat Serah Terima</button>' +
        '</div>'
      : '')
    );
    document.getElementById('app').innerHTML = html;
  },

  _updateKpBtn: function() {
    var checked = document.querySelectorAll('.kp-check:checked').length;
    var bar = document.getElementById('kpActionBar');
    if (bar) bar.style.display = checked > 0 ? 'block' : 'none';
  },

  // L2c: batalkan baris Kas Penerobos (soft delete). Wajib alasan ≥15 karakter.
  // Bila backend menilai BAHAYA / PERLU_DIKONFIRMASI, minta ketik ulang nominal.
  // tutup: true bila baris di periode CLOSED (tampilkan peringatan PRIVILEGED).
  // onSelesai opsional: fungsi refresh halaman pemanggil.
  batalkanKasPenerobos: function(id, nominal, onSelesai, tutup) {
    var self = this;
    var SIAP = 'Uang sudah diserahkan ke Bendahara dan dicatat langsung sebagai penerimaan. Serah terima tidak dapat diproses aplikasi.';
    if (tutup && !confirm('⚠ Baris ini milik periode yang SUDAH DITUTUP.\nPembatalan boleh (kas penerobos tak masuk saldo periode) tetapi dicatat sebagai Aktivitas Istimewa untuk direviu ketua.\n\nLanjut?')) return;
    var alasan = prompt('Alasan pembatalan (minimal 15 karakter). Baris tidak dihapus, hanya ditandai "Dibatalkan".\n\nContoh siap pakai (boleh diedit):', SIAP);
    if (alasan === null) return;
    if (alasan.trim().length < 15) { self.toast('Alasan minimal 15 karakter.'); return; }
    var refresh = (typeof onSelesai === 'function') ? onSelesai : function() { self.pageKasPenerobos(); };
    function kirim(konfirmasiNominal) {
      App.srv()
        .withSuccessHandler(function(r) {
          if (r && r.success) { self.toast('Kas Penerobos dibatalkan ✓'); refresh(); return; }
          if (r && r.butuhKonfirmasiNominal) {
            var ket = prompt('⚠ ' + (r.message || 'Perlu konfirmasi.') + '\n\nKetik ULANG nominal untuk konfirmasi:');
            if (ket === null) return;
            var n = Number(String(ket).replace(/[^0-9]/g, ''));
            if (n !== Number(r.nominal)) { self.toast('Nominal tidak cocok. Dibatalkan.'); return; }
            kirim(n);
            return;
          }
          self.toast((r && r.message) || 'Gagal membatalkan.');
        })
        .withFailureHandler(function() { self.toast('Gagal terhubung.'); })
        .batalkanKasPenerobos(id, alasan.trim(), konfirmasiNominal);
    }
    kirim(Number(nominal) || '');
  },

  // L2c: halaman Kelola Kas Penerobos (Admin) — daftar semua baris + penilaian risiko.
  pageKelolaKasPenerobos: function() {
    var self = this;
    self.showLoading();
    App.srv()
      .withSuccessHandler(function(r) { if (r && r.success) self.renderKelolaKasPenerobos(r); else self.showError((r && r.message) || 'Gagal memuat'); })
      .withFailureHandler(function() { self.showError('Gagal terhubung.'); })
      .getKelolaKasPenerobos();
  },

  renderKelolaKasPenerobos: function(res) {
    var self = this;
    var agingHari = res.agingHari || 7;
    function badge(a) {
      if (a.status !== 'Aktif') return '<span class="badge badge-muted">' + self.escapeHtml(a.status) + '</span>';
      if (a.risiko === 'AMAN_DIBATALKAN') return '<span class="badge" style="background:#DCFCE7;color:#166534;">🟢 Aman dibatalkan</span>';
      if (a.risiko === 'PERLU_DIKONFIRMASI') return '<span class="badge" style="background:#FEF3C7;color:#92400E;">🟡 Perlu dikonfirmasi</span>';
      if (a.risiko === 'BAHAYA_UANG_HILANG') return '<span class="badge" style="background:#FEE2E2;color:#B91C1C;">🔴 Bahaya: uang hilang</span>';
      return '<span class="badge badge-muted">—</span>';
    }
    function sumberTxt(a) {
      if (!a.trxSumberId) return '<span style="color:var(--text-muted);">— (input langsung)</span>';
      if (a.sumberAda && !a.sumberBatal) return '<span style="color:#166534;">ADA</span> · ' + self.escapeHtml(a.trxSumberId);
      if (a.sumberBatal) return '<span style="color:#B91C1C;">DIBATALKAN</span> · ' + self.escapeHtml(a.trxSumberId);
      return '<span style="color:#B91C1C;">TIDAK DITEMUKAN</span> · ' + self.escapeHtml(a.trxSumberId);
    }
    var rows = (res.data || []).map(function(a) {
      var warnUmur = (a.status === 'Aktif' && a.umurHari > agingHari);
      var risikoTinggi = (a.risiko === 'BAHAYA_UANG_HILANG' || a.risiko === 'PERLU_DIKONFIRMASI');
      var idJs = self._esc(a.id).replace(/'/g, "\\'");
      // Kandidat pasangan (kemungkinan sudah dicatat langsung oleh bendahara).
      var pairTxt = a.kandidatPasangan
        ? '<div style="font-size:11px;color:#92400E;background:#FEF3C7;border-radius:5px;padding:4px 6px;margin-top:4px;">🔎 Mungkin sudah dicatat langsung: ' +
            self.escapeHtml(a.kandidatPasangan.id) + ' · ' + self.formatDate(a.kandidatPasangan.tanggal) + ' · Rp ' + self.formatNumber(a.kandidatPasangan.nominal) + '</div>'
        : '';
      var aksi = '';
      if (a.status === 'Aktif') {
        var cls = risikoTinggi ? 'btn-danger' : 'btn-warning';
        // Periode tutup: pembatalan BOLEH (PRIVILEGED) — kirim flag tutup=true.
        aksi = '<button class="btn btn-sm ' + cls + '" onclick="App.batalkanKasPenerobos(\'' + idJs + '\',' + (Number(a.nominal) || 0) + ', function(){App.pageKelolaKasPenerobos();}, ' + (a.periodeTertutup ? 'true' : 'false') + ')">Batalkan' + (a.periodeTertutup ? ' (periode tutup)' : '') + '</button>';
      }
      return '<div class="card" style="margin-bottom:8px;padding:10px 12px;">' +
        '<div style="display:flex;justify-content:space-between;gap:8px;">' +
          '<div style="min-width:0;">' +
            '<div style="font-weight:700;">' + self.escapeHtml(a.jenis || '-') + (a.anggota ? ' · ' + self.escapeHtml(a.anggota) : '') + '</div>' +
            '<div style="font-size:12px;color:var(--text-muted);">' + self.formatDate(a.tanggal) +
              (warnUmur ? ' · <span style="color:#B91C1C;font-weight:700;">⚠ ' + a.umurHari + ' hari</span>' : ' · ' + a.umurHari + ' hari') +
              ' · ' + self.escapeHtml(a.penerobosNama) + ' · ' + self.escapeHtml(a.sumberKas) + '</div>' +
            '<div style="font-size:11px;color:var(--text-muted);">Periode ' + self.escapeHtml(a.periodeId) + (a.periodeTertutup ? ' <span style="color:#B91C1C;">(TUTUP)</span>' : '') + ' · Sumber: ' + sumberTxt(a) + '</div>' +
            pairTxt +
          '</div>' +
          '<div style="text-align:right;white-space:nowrap;"><div style="font-weight:800;">' + self.formatNumber(a.nominal) + '</div>' + badge(a) + '</div>' +
        '</div>' +
        (aksi ? '<div style="margin-top:8px;">' + aksi + '</div>' : '') +
      '</div>';
    }).join('') || '<p class="text-muted text-small" style="padding:12px 0;">Belum ada data.</p>';
    var info = '<div class="info-box" style="margin-bottom:12px;">Kelola & batalkan catatan ganda Kas Penerobos. <b>Tidak ada penghapusan</b> — hanya ditandai. Baris 🔴/🟡 perlu ketik ulang nominal. Baris di periode <b>tutup</b> boleh dibatalkan tetapi dicatat sebagai <b>Aktivitas Istimewa</b>.</div>' +
      (App.can('penerobos.kelola') ? '<button class="btn btn-sm btn-outline mb-16" onclick="App.pageAktivitasIstimewa()">📋 Aktivitas Istimewa</button>' : '');
    document.getElementById('app').innerHTML = this.pageWrapper('Kelola Kas Penerobos', info + rows);
  },

  // L2c: halaman Aktivitas Istimewa — daftar aksi PRIVILEGED untuk direviu ketua.
  pageAktivitasIstimewa: function() {
    var self = this;
    self.showLoading();
    App.srv()
      .withSuccessHandler(function(r) { if (r && r.success) self.renderAktivitasIstimewa(r.data || []); else self.showError((r && r.message) || 'Gagal memuat'); })
      .withFailureHandler(function() { self.showError('Gagal terhubung.'); })
      .getAktivitasIstimewa(200);
  },

        '<div style="font-weight:700;font-size:13px;">' + self.escapeHtml(a.aksi) + '</div>' +
        '<div style="font-size:12px;color:var(--text-muted);">' + self.formatDate(a.waktu) + ' · ' + self.escapeHtml(a.email) + '</div>' +

  _showFormKasPenerobos: function() {
    var self = this;
    self.showLoading('Memuat master...');
    App.srv()
      .withSuccessHandler(function(res) {
        if (!res.success) { self.showError(res.message); return; }
        var opts = (res.data || []).filter(function(m) { return m.status !== 'Nonaktif'; }).map(function(m) {
          return '<option value="' + m.id + '">' + App.escapeHtml(m.nama) + '</option>';
        }).join('');
        var modal = '<div class="modal-overlay" id="kpFormOverlay" onclick="if(event.target===this)this.remove()">' +
          '<div class="modal">' +
            '<h3 class="modal-title">Tambah Kas Masuk</h3>' +
            '<div class="form-group"><label>Jenis</label><select id="kpJenisId" class="form-control"><option value="">-- Pilih --</option>' + opts + '</select></div>' +
            '<div class="form-group"><label>Tanggal</label><input type="date" id="kpTanggal" class="form-control" value="' + new Date().toISOString().substr(0,10) + '"></div>' +
            '<div class="form-group"><label>Nominal</label><input type="text" id="kpNominal" class="form-control" inputmode="numeric" data-tsep="1" placeholder="0"></div>' +
            '<div class="form-group"><label>Catatan</label><input type="text" id="kpCatatan" class="form-control" placeholder="Opsional"></div>' +
            '<div class="btn-group" style="margin-top:16px;">' +
              '<button class="btn btn-secondary" onclick="document.getElementById(\'kpFormOverlay\').remove()">Batal</button>' +
              '<button class="btn btn-primary" onclick="App._submitKasPenerobos()">Simpan</button>' +
            '</div>' +
          '</div>' +
        '</div>';
        document.body.insertAdjacentHTML('beforeend', modal);
        var nomEl = document.getElementById('kpNominal');
        if (nomEl) App._formatTsep(nomEl);
      })
      .withFailureHandler(function(e) { self.showError(e.message); })
      .getMasterPemasukan();
  },

  _submitKasPenerobos: function() {
    var jenisId = document.getElementById('kpJenisId').value;
    var tanggal = document.getElementById('kpTanggal').value;
    var nominal = App.num('kpNominal');
    var catatan = document.getElementById('kpCatatan').value;
    if (!jenisId) { alert('Pilih jenis terlebih dahulu'); return; }
    if (!nominal) { alert('Nominal tidak boleh 0'); return; }
    var self = this;
    self.showLoading('Menyimpan...');
    document.getElementById('kpFormOverlay').remove();
    App.srv()
      .withSuccessHandler(function(res) {
        if (!res.success) { self.showError(res.message); return; }
        self.pageKasPenerobos();
      })
      .withFailureHandler(function(e) { self.showError(e.message); })
      .submitKasPenerobos({ jenisId: jenisId, tanggal: tanggal, nominal: nominal, catatan: catatan });
  },

  _showModalSerahTerima: function() {
    var checked = document.querySelectorAll('.kp-check:checked');
    var ids = [];
    var total = 0;
    for (var i = 0; i < checked.length; i++) {
      var id = checked[i].getAttribute('data-id');
      ids.push(id);
      if (App._kpItems && App._kpItems[id]) total += App._kpItems[id].nominal || 0;
    }
    if (ids.length === 0) { alert('Pilih minimal 1 item'); return; }
    var modal = '<div class="modal-overlay" id="stFormOverlay" onclick="if(event.target===this)this.remove()">' +
      '<div class="modal">' +
        '<h3 class="modal-title">Buat Serah Terima</h3>' +
        '<div class="stat-row"><span class="stat-label">Jumlah item</span><span class="stat-value">' + ids.length + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Total</span><span class="stat-value text-success">' + App.formatNumber(total) + '</span></div>' +
        '<div class="form-group" style="margin-top:12px;"><label>Tujuan Kas</label>' +
          '<select id="stTujuan" class="form-control">' +
            '<option value="Tunai">Kas Tunai (Bendahara 1)</option>' +
            '<option value="Bank">Kas Bank (Bendahara 2)</option>' +
          '</select>' +
        '</div>' +
        '<div class="form-group"><label>Catatan</label><input type="text" id="stCatatan" class="form-control" placeholder="Opsional"></div>' +
        '<div class="btn-group" style="margin-top:16px;">' +
          '<button class="btn btn-secondary" onclick="document.getElementById(\'stFormOverlay\').remove()">Batal</button>' +
          '<button class="btn btn-primary" onclick="App._submitSerahTerima(' + JSON.stringify(ids) + ')">Kirim</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    document.body.insertAdjacentHTML('beforeend', modal);
  },

  _submitSerahTerima: function(ids) {
    var tujuan = document.getElementById('stTujuan').value;
    var catatan = document.getElementById('stCatatan').value;
    var self = this;
    self.showLoading('Membuat serah terima...');
    document.getElementById('stFormOverlay').remove();
    App.srv()
      .withSuccessHandler(function(res) {
        if (!res.success) { self.showError(res.message); return; }
        self.toast('Serah terima berhasil dibuat');
        self.pageKasPenerobos();
      })
      .withFailureHandler(function(e) { self.showError(e.message); })
      .buatSerahTerima({ itemIds: ids, sumberTujuan: tujuan, catatan: catatan });
  },

  // ─────────────────────────────────────────────────
  // SERAH TERIMA
  // ─────────────────────────────────────────────────
  pageSerahTerima: function() {
    this.history.push('kelolaBuku');
    this.showLoading('Memuat serah terima...');
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {
        if (!res.success) { self.showError(res.message); return; }
        var canKonfirmasi = App.can('serahterima.konfirmasi');
        var rows = (res.data || []).map(function(d) {
          var statusBadge = d.status === 'Menunggu'
            ? '<span class="badge badge-warning">Menunggu</span>'
            : '<span class="badge badge-success">Dikonfirmasi</span>';
          var konfBtn = (d.status === 'Menunggu' && canKonfirmasi)
            ? '<button class="btn btn-sm btn-success" style="margin-top:6px;" onclick="App._konfirmasiST(\'' + d.id + '\',\'' + d.penerobosEmail + '\')">Konfirmasi</button>'
            : '';
          var cetakBtn = d.status === 'Dikonfirmasi'
            ? '<button class="btn btn-sm btn-outline" style="margin-top:6px;" onclick="App._cetakSerahTerima(\'' + d.id + '\')">Cetak</button>'
            : '';
          return '<div class="trx-item">' +
            '<div class="trx-item-top">' +
              '<span class="trx-item-nama">' + d.penerobosEmail + ' → ' + (d.sumberTujuan || '-') + '</span>' +
              '<span class="trx-item-nominal text-success">' + App.formatNumber(d.total) + '</span>' +
            '</div>' +
            '<div class="trx-item-meta">' + App.formatDate(d.tanggalSerah) + (d.catatan ? ' · ' + App.escapeHtml(d.catatan) : '') + ' ' + statusBadge + '</div>' +
            (d.status === 'Dikonfirmasi' ? '<div class="trx-item-meta text-muted">Dikonfirmasi oleh: ' + d.dikonfirmasiBy + '</div>' : '') +
            konfBtn + cetakBtn +
          '</div>';
        }).join('') || '<p class="text-muted text-small" style="padding:12px 0;">Belum ada data</p>';

        var html = self.pageWrapper('Serah Terima',
          '<div class="card" style="padding:0 16px;">' + rows + '</div>'
        );
        document.getElementById('app').innerHTML = html;
      })
      .withFailureHandler(function(e) { self.showError(e.message); })
      .getSerahTerimaList();
  },

  _konfirmasiST: function(id, dari) {
    if (!confirm('Konfirmasi serah terima dari ' + dari + '?\nUang akan masuk ke kas sesuai tujuan.')) return;
    var self = this;
    self.showLoading('Memproses...');
    App.srv()
      .withSuccessHandler(function(res) {
        if (!res.success) { self.showError(res.message); return; }
        self.toast('Serah terima dikonfirmasi, ' + (res.count || 1) + ' pemasukan dicatat otomatis');
        self.pageSerahTerima();
      })
      .withFailureHandler(function(e) { self.showError(e.message); })
      .konfirmasiSerahTerima(id);
  },

  _cetakSerahTerima: function(id) {

    App.srv()
      .withSuccessHandler(function(res) {

        var d = res.data;

            '<td style="padding:6px 10px;border:1px solid #ccc;">' + (i+1) + '</td>' +

            '<td style="padding:6px 10px;border:1px solid #ccc;text-align:right;">' + App.formatNumber(it.nominal) + '</td>' +
            '<td style="padding:6px 10px;border:1px solid #ccc;">' + (it.catatan || '-') + '</td>' +

        }).join('');
        var html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Serah Terima</title>' +

          '.sub{text-align:center;color:#555;font-size:12px;margin-bottom:16px;}' +
          'table{width:100%;border-collapse:collapse;margin-bottom:12px;}' +
          'th{padding:6px 10px;border:1px solid #ccc;background:#f3f4f6;text-align:left;}' +
          '.info-table td{padding:4px 10px;border:none;vertical-align:top;}' +
          '.info-table td:first-child{width:160px;font-weight:bold;}' +
          '.sign-area{display:flex;justify-content:space-between;margin-top:40px;}' +
          '.sign-box{text-align:center;width:45%;}' +
          '.sign-line{margin-top:60px;border-top:1px solid #333;padding-top:4px;}' +
          '@media print{button{display:none!important;}}' +
          '</style></head><body>' +
          '<h2>' + App.escapeHtml(namaKelompok) + '</h2>' +

  pageBukaPeriode: function() {
    this.history.push('kelolaBuku');
    if (!App.can('periode.manage')) {
      document.getElementById('app').innerHTML = this.pageWrapper('Buka Periode',
        '<div class="info-box" style="margin-top:20px;">⛔ Anda tidak memiliki izin.</div>'
      );
      return;
    }
    var self = this;
    self.showLoading('Memuat info periode...');
    App.srv()
      .withSuccessHandler(function(info) {
        if (!info || !info.success) { self.showError((info && info.message) || 'Gagal memuat info periode.'); return; }
        self._renderBukaPeriode(info);
      })
      .withFailureHandler(function(err) { self.showError(err.message); })
      .getInfoBukaPeriode();
  },

  _renderBukaPeriode: function(info) {
    var self = this;
    var today = new Date().toISOString().split('T')[0];
    if (info.adaOpen) {
      document.getElementById('app').innerHTML = this.pageWrapper('Buka Periode Baru',
        '<div class="info-box" style="margin-top:20px;background:#FEF3C7;border:1px solid #F59E0B;color:#92400E;">⚠ Masih ada periode yang <b>OPEN</b>. Tutup periode aktif terlebih dahulu sebelum membuka periode baru.</div>'
      );
      return;
    }
    var adaPrev = !!info.adaPrev;
    var rfTunai = Number(info.rollforwardTunai) || 0;
    var rfBank = Number(info.rollforwardBank) || 0;
    // Simpan rollforward untuk validasi saat submit.
    App._rfTunai = rfTunai; App._rfBank = rfBank; App._adaPrev = adaPrev;
    var noteRf = adaPrev
      ? '<div class="info-box" style="margin-bottom:12px;">Saldo awal otomatis mengikuti <b>saldo akhir tutup buku sebelumnya</b> (Tunai Rp ' + self.formatNumber(rfTunai) + ', Bank Rp ' + self.formatNumber(rfBank) + '). Ubah hanya bila memang ada selisih — wajib disertai alasan.</div>'
      : '<div class="info-box" style="margin-bottom:12px;">Ini periode pertama. Isi saldo awal apa adanya.</div>';
    var html = this.pageWrapper('Buka Periode Baru',
      noteRf +
      '<div class="card">' +
        '<div class="form-group"><label>Nama Periode <span class="text-danger">*</span></label>' +
          '<input type="text" id="bpNama" class="form-control" placeholder="Contoh: Periode Juli 2026">' +
        '</div>' +
        '<div class="form-group"><label>Tanggal Mulai <span class="text-danger">*</span></label>' +
          '<input type="date" id="bpTglMulai" class="form-control" value="' + today + '">' +
        '</div>' +
        '<div class="form-group"><label>Saldo Awal Tunai</label>' +
          '<input type="text" id="bpTunai" class="form-control" inputmode="numeric" data-tsep="1" value="' + rfTunai + '"' + (adaPrev ? ' readonly' : '') + '>' +
        '</div>' +
        '<div class="form-group"><label>Saldo Awal Bank</label>' +
          '<input type="text" id="bpBank" class="form-control" inputmode="numeric" data-tsep="1" value="' + rfBank + '"' + (adaPrev ? ' readonly' : '') + '>' +
        '</div>' +
        (adaPrev ?
          '<div class="form-group" style="border-top:1px solid var(--border);padding-top:10px;">' +
            '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;">' +
              '<input type="checkbox" id="bpSelisih" onchange="App._toggleBpSelisih()" style="width:18px;height:18px;"> Ada selisih dari saldo tutup buku' +
            '</label>' +
            '<div id="bpSelisihBox" style="display:none;margin-top:8px;">' +
              '<input type="text" id="bpAlasan" class="form-control" placeholder="Alasan selisih (wajib)">' +
              '<div class="text-small text-muted" style="margin-top:4px;">Selisih akan dicatat sebagai penyesuaian eksplisit di periode baru.</div>' +
            '</div>' +
          '</div>'
        : '') +
        '<div class="form-group"><label>Catatan</label>' +
          '<input type="text" id="bpCatatan" class="form-control" placeholder="Opsional">' +
        '</div>' +
        '<button class="btn btn-primary mt-8" style="width:100%;" onclick="App.submitBukaPeriode()">📅 Buka Periode</button>' +
      '</div>'
    );
    document.getElementById('app').innerHTML = html;
    ['bpTunai','bpBank'].forEach(function(id) {
      var el = document.getElementById(id); if (el) App._formatTsep(el);
    });
  },

  _toggleBpSelisih: function() {
    var chk = document.getElementById('bpSelisih');
    var box = document.getElementById('bpSelisihBox');
    var on = chk && chk.checked;
    if (box) box.style.display = on ? 'block' : 'none';
    // Saldo awal jadi bisa diedit hanya bila ada selisih.
    ['bpTunai','bpBank'].forEach(function(id) {
      var el = document.getElementById(id); if (el) { if (on) el.removeAttribute('readonly'); else { el.setAttribute('readonly', 'readonly'); } }
    });
    if (!on) {
      var t = document.getElementById('bpTunai'), b = document.getElementById('bpBank');
      if (t) t.value = App._rfTunai; if (b) b.value = App._rfBank;
      ['bpTunai','bpBank'].forEach(function(id) { var el = document.getElementById(id); if (el) App._formatTsep(el); });
    }
  },

  submitBukaPeriode: function() {
    var nama     = (document.getElementById('bpNama') || {}).value || '';
    var tglMulai = (document.getElementById('bpTglMulai') || {}).value || '';
    var catatan  = (document.getElementById('bpCatatan') || {}).value || '';
    if (!nama) { alert('Nama periode wajib diisi'); return; }
    if (!tglMulai) { alert('Tanggal mulai wajib diisi'); return; }
    var adaSelisih = !!(document.getElementById('bpSelisih') && document.getElementById('bpSelisih').checked);
    var alasan = (document.getElementById('bpAlasan') || {}).value || '';
    if (adaSelisih && !alasan.trim()) { alert('Alasan selisih wajib diisi.'); return; }
    var self = this;
    self.showLoading('Membuka periode...');
    App.srv()
      .withSuccessHandler(function(res) {
        if (!res.success) {
          // Bila backend menolak karena rollforward, jelaskan & tawarkan opsi selisih.
          if (res.rollforward) {
            self._renderBukaPeriode({ success: true, adaOpen: false, adaPrev: true, rollforwardTunai: res.rollforward.tunai, rollforwardBank: res.rollforward.bank });
            self.toast('Saldo awal harus mengikuti tutup buku. Centang "Ada selisih" bila memang berbeda.');
            return;
          }
          self.showError(res.message); return;
        }
        self.toast('Periode baru berhasil dibuka!');
        self.loadDashboard();
      })
      .withFailureHandler(function(err) { self.showError(err.message); })
      .bukaPeriode({
        nama: nama,
        tglMulai: tglMulai,
        saldoAwalTunai: App.num('bpTunai'),
        saldoAwalBank: App.num('bpBank'),
        catatan: catatan,
        overrideRollforward: adaSelisih,
        alasanRollforward: alasan
      });
  },

  // ─────────────────────────────────────────────────
  // SETORAN DESA
  // ─────────────────────────────────────────────────
  pageSetoranDesa: function() {
    this.history.push('dashboard');
    this.showLoading('Memuat setoran desa...');
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {
        if (!res.success) { self.showError(res.message); return; }
        var data = res.data || [];
        var totalTarget = 0, totalRealisasi = 0;
        App._setoranData = data;
        var cards = data.map(function(item, idx) {
          totalTarget += item.target;
          totalRealisasi += item.realisasi;
          var fill = Math.min(item.persen, 100);
          var fillClass = fill >= 100 ? '' : fill >= 60 ? 'warning' : 'danger';
          var targetLabel = item.sumberTipe === 'bukuir' ? 'Terkumpul dari Buku IR'
            : item.sumberTipe === 'pemasukan' ? 'Jatah dari Pemasukan'
            : 'Target';
          return '<div class="pos-card">' +
            '<div class="pos-card-header">' +
              '<div>' +
                '<div class="pos-card-nama">' + App.escapeHtml(item.nama) + (item.isAuto ? ' <span style="font-size:10px;color:#6B7280;font-weight:400;">(' + App.escapeHtml(item.sumberKet || 'otomatis') + ')</span>' : '') + '</div>' +
                '<div class="progress-bar" style="width:120px;margin-top:6px;"><div class="progress-fill ' + fillClass + '" style="width:' + fill + '%;"></div></div>' +
              '</div>' +
              '<div style="text-align:right;">' +
                '<span class="status-badge ' + (item.status === 'Lunas' ? 'lunas' : 'belum') + '">' + item.status + '</span>' +
                '<div class="text-muted text-small" style="margin-top:4px;">' + item.persen + '%</div>' +
              '</div>' +
            '</div>' +
            '<div class="pos-card-row"><span class="pos-card-label">' + targetLabel + '</span><span class="pos-card-value">' + App.formatNumber(item.target) + '</span></div>' +
            '<div class="pos-card-row"><span class="pos-card-label">Sudah Disetor</span><span class="pos-card-value text-success">' + App.formatNumber(item.realisasi) + '</span></div>' +
            '<div class="pos-card-row"><span class="pos-card-label">Sisa</span><span class="pos-card-value ' + (item.sisa > 0 ? 'text-danger' : 'text-success') + '">' + App.formatNumber(item.sisa) + '</span></div>' +
            '<button class="btn btn-outline btn-sm" style="margin-top:10px;width:100%;" onclick="App.showEditSetoran(' + idx + ')">✏️ Update Realisasi</button>' +
          '</div>';
        }).join('') || '<div class="info-box">Belum ada pos setoran aktif. Tambah di Setting → Kelola Pos Setoran.</div>';

        var totalSisa = totalTarget - totalRealisasi;
        var html = self.pageWrapper('Setoran Desa',
          '<div class="card">' +
            '<div class="stat-row"><span class="stat-label">Total Target</span><span class="stat-value">' + App.formatNumber(totalTarget) + '</span></div>' +
            '<div class="stat-row"><span class="stat-label">Total Realisasi</span><span class="stat-value text-success">' + App.formatNumber(totalRealisasi) + '</span></div>' +
            '<div class="stat-row"><span class="stat-label">Sisa</span><span class="stat-value ' + (totalSisa > 0 ? 'text-danger' : 'text-success') + '">' + App.formatNumber(totalSisa) + '</span></div>' +
          '</div>' +
          cards +
          '<div id="setoranModal"></div>'
        );
        document.getElementById('app').innerHTML = html;
      })
      .withFailureHandler(function(err) { self.showError(err.message); })
      .getRekapSetoran();
  },

  showEditSetoran: function(idx) {
    var item = (App._setoranData || [])[idx] || {};
    this._editSetoranItem = item;
    var targetRow = item.isAuto
      ? '<div class="pos-card-row" style="margin-bottom:8px;"><span class="pos-card-label">' + (item.sumberKet || 'Otomatis') + '</span><span class="pos-card-value">' + App.formatNumber(item.target) + '</span></div>'
      : '<div class="form-group"><label>Target (Rp)</label><input type="text" inputmode="numeric" data-tsep="1" id="sTarget" value="' + item.target + '"/></div>';
    var kas = item.sumberKas || 'Tunai';
    var kasRow = '<div class="form-group"><label>Sumber Kas (uang keluar dari)</label>' +
      '<select id="sSumberKas"><option value="Tunai"' + (kas !== 'Bank' ? ' selected' : '') + '>Tunai</option><option value="Bank"' + (kas === 'Bank' ? ' selected' : '') + '>Bank</option></select></div>';
    var pkInfo = item.pengeluaranRef
      ? '<div class="info-box" style="margin-bottom:10px;">💸 Realisasi akan dicatat otomatis sebagai <b>pengeluaran kas</b>, sehingga saldo berkurang.</div>'
      : '<div class="info-box" style="margin-bottom:10px;background:#FEF3C7;border-color:#F59E0B;">⚠️ Pos ini belum terhubung ke pengeluaran. Realisasi <b>tidak</b> mengurangi saldo. Atur di Setting → Pos Setoran.</div>';
    document.getElementById('setoranModal').innerHTML =
      '<div class="modal-overlay" onclick="App.closeModalSetoran(event)">' +
        '<div class="modal">' +
          '<div class="modal-title">Update Setoran: ' + App.escapeHtml(item.nama) + '</div>' +
          targetRow +
          '<div class="form-group"><label>Jumlah Disetor (Rp)</label><input type="text" inputmode="numeric" data-tsep="1" id="sRealisasi" value="' + item.realisasi + '"/></div>' +
          kasRow +
          pkInfo +
          '<div class="form-group"><label>Catatan</label><input type="text" id="sCatatan" value="' + (item.catatan || '') + '"/></div>' +
          '<div id="setoranError"></div>' +
          '<button class="btn btn-primary" onclick="App.submitSetoran()">Simpan</button>' +
          '<button class="btn btn-outline mt-8" onclick="App.closeModalSetoranDirect()">Batal</button>' +
        '</div>' +
      '</div>';
  },

  closeModalSetoran: function(e) {
    if (e.target.classList.contains('modal-overlay')) this.closeModalSetoranDirect();
  },

  closeModalSetoranDirect: function() {
    var el = document.getElementById('setoranModal');
    if (el) el.innerHTML = '';
  },

  submitSetoran: function() {
    var item = this._editSetoranItem;
    var sTargetEl = document.getElementById('sTarget');
    var kasEl = document.getElementById('sSumberKas');
    var data = {
      posId: item.id,
      target: sTargetEl ? (App.num(sTargetEl)) : item.target,
      realisasi: App.num('sRealisasi'),
      sumberKas: kasEl ? kasEl.value : 'Tunai',
      catatan: document.getElementById('sCatatan').value
    };
    document.getElementById('setoranError').innerHTML = '<div class="info-box">Menyimpan...</div>';
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast('Setoran berhasil diperbarui ✓');
          self.pageSetoranDesa();
        } else {
          document.getElementById('setoranError').innerHTML = '<div class="error-box">' + res.message + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        document.getElementById('setoranError').innerHTML = '<div class="error-box">Error: ' + err.message + '</div>';
      })
      .submitRealisasiSetoran(data);
  },

  // ─────────────────────────────────────────────────
  // PEMERIKSAAN SALDO (sebelum tutup buku)
  // ─────────────────────────────────────────────────
  pagePemeriksaanSaldo: function() {
    this.history.push('dashboard');
    this.showLoading('Memuat saldo sistem...');
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {
        if (!res.success) { self.showError(res.message); return; }
        self.renderPemeriksaanSaldo(res);
      })
      .withFailureHandler(function(err) { self.showError(err.message); })
      .getPemeriksaanSaldo();
  },

  renderPemeriksaanSaldo: function(res) {
    var self = this;
    self._pemeriksaanData = res;
    var sis = res.saldoSistem || { tunai: 0, bank: 0, total: 0 };
    var t = res.terakhir;

    var sysCard =
      '<div class="card">' +
        '<div class="section-title mb-8">Saldo Menurut Sistem</div>' +
        '<div class="stat-row"><span class="stat-label">🪙 Kas Tunai</span><span class="stat-value">' + App.formatNumber(sis.tunai) + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">🏦 Kas Bank</span><span class="stat-value">' + App.formatNumber(sis.bank) + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">Total</span><span class="stat-value text-success">' + App.formatNumber(sis.total) + '</span></div>' +
      '</div>';

    var lastInfo = t
      ? '<div class="info-box" style="margin-bottom:12px;">Pemeriksaan terakhir (' + App.formatDate(t.tanggal) + '): Tunai ' + App.formatNumber(t.saldoTunaiAktual) + ', Bank ' + App.formatNumber(t.saldoBankAktual) + (t.status === 'Tutup' ? ' — <b>SUDAH TUTUP BUKU</b>' : '') + '</div>'
      : '';

    var defTunai = t ? t.saldoTunaiAktual : sis.tunai;
    var defBank = t ? t.saldoBankAktual : sis.bank;

    var form =
      '<div class="card">' +
        '<div class="section-title mb-8">Saldo Aktual (Hasil Hitung Fisik)</div>' +
        '<div class="form-group"><label>🪙 Kas Tunai Aktual (Rp)</label>' +
          '<input type="text" inputmode="numeric" data-tsep="1" id="psTunai" value="' + defTunai + '" oninput="App.cekSelisihSaldo()"/></div>' +
        '<div class="form-group"><label>🏦 Kas Bank Aktual (Rp)</label>' +
          '<input type="text" inputmode="numeric" data-tsep="1" id="psBank" value="' + defBank + '" oninput="App.cekSelisihSaldo()"/></div>' +
        '<div id="selisihBox" class="mb-16"></div>' +

  cekSelisihSaldo: function() {
    var res = this._pemeriksaanData;
    if (!res) return;
    var sis = res.saldoSistem || { tunai: 0, bank: 0 };
    var aktTunai = App.num('psTunai');
    var aktBank = App.num('psBank');
    var selTunai = aktTunai - sis.tunai;
    var selBank = aktBank - sis.bank;
    var selTotal = selTunai + selBank;

    function baris(label, sel) {
      var warna = sel === 0 ? 'var(--success)' : 'var(--danger)';
      var tanda = sel > 0 ? '+' : '';
      var ket = sel === 0 ? '✓ cocok' : (sel > 0 ? 'lebih' : 'kurang');
      return '<div class="stat-row"><span class="stat-label">' + label + '</span>' +
        '<span class="stat-value" style="color:' + warna + ';">' + tanda + App.formatNumber(sel) + ' <span style="font-size:10px;">(' + ket + ')</span></span></div>';
    }

    var el = document.getElementById('selisihBox');
    var allOk = (selTunai === 0 && selBank === 0);
    el.innerHTML =
      '<div class="card" style="margin:0;background:' + (allOk ? '#F0FDF4' : '#FEF2F2') + ';border:1px solid ' + (allOk ? '#86EFAC' : '#FECACA') + ';">' +
        '<div class="section-title mb-8">Selisih (Aktual − Sistem)</div>' +
        baris('Selisih Tunai', selTunai) +
        baris('Selisih Bank', selBank) +
        baris('Selisih Total', selTotal) +
      '</div>';
  },

  submitPemeriksaanSaldo: function(tutup) {
    var data = {
      saldoTunaiAktual: App.num('psTunai'),
      saldoBankAktual: App.num('psBank'),
      catatan: document.getElementById('psCatatan').value,
      tutup: !!tutup
    };
    document.getElementById('psError').innerHTML = '<div class="info-box">Menyimpan...</div>';
    var self = this;
    App.srv()
      .withSuccessHandler(function(res) {
        if (res.success) {
          self.toast(tutup ? 'Buku berhasil ditutup ✓' : 'Pemeriksaan tersimpan ✓');
          self.loadDashboard();
        } else {
          document.getElementById('psError').innerHTML = '<div class="error-box">' + res.message + '</div>';
        }
      })
      .withFailureHandler(function(err) {
